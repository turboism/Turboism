# Gradle execution model for CI throughput.
#
# - parallel: multi-module task graph executes concurrently on the CI runner
#   (task dependencies still serialize correctly; single-project lanes such as
#   asyncHostReadFoundationTest that require serial execution keep their own
#   maxParallelForks = 1 and are unaffected).
# - caching: task-output build cache is enabled for every invocation so the
#   CI-restored ~/.gradle/caches/build-cache-1 directory (cached by
#   actions/setup-java `cache: gradle`) is reused across runs for unchanged
#   task inputs.
#
# Deliberately NOT set here:
# - org.gradle.configuration-cache: not enabled yet. `help`, `printBuildInfo` and
#   single-task lanes such as checkPythonLint store and reuse a clean entry, and
#   every script under gradle/verification/ is configuration-cache clean. The
#   remaining blockers are the doLast/doFirst closures that still capture a
#   Project or the script scope, in this order of size:
#     * build.gradle.kts (22) and the closures it registers in the module build
#       files (12), e.g. the bootstrap receipt classpath writer and the
#       generateVerificationSources action;
#     * gradle/module-boundaries.gradle.kts (6), gradle/runtime-verification.gradle.kts (5),
#       gradle/asm-admission.gradle.kts (4), gradle/distribution-preview.gradle.kts (4),
#       gradle/dependency-inventory.gradle.kts (1), gradle/sdk-api.gradle.kts (1).
#   `./gradlew devCheck checkCompletedCommit --dry-run --configuration-cache
#   --configuration-cache-problems=fail` reports 56 problems today, down from 109
#   before the ValueSource work; that count is the tracking number for the rest of
#   the migration.
# - A narrowed `subprojects.forEach { evaluationDependsOn(it.path) }` in
#   build.gradle.kts: gradle/asm-admission.gradle.kts reads each subproject's
#   SourceSetContainer while it configures, so an unevaluated module silently
#   drops out of checkAsmSupplyChainAdmission. The eager evaluation stays until
#   that gate switches to a lazy, task-graph-time source set lookup.
# - org.gradle.jvmargs: daemon defaults are adequate today; changing the memory
#   profile belongs to a measured tuning pass, not this change.
org.gradle.parallel=true
org.gradle.caching=true
