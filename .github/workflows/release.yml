# Candidate builder for immutable vMAJOR.MINOR.PATCH framework releases.
# This workflow has read-only repository permissions and no production secrets.
# The protected release-publisher workflow owns every remote mutation.

name: Product release candidate

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  PLUGIN_DIRECTORY_REVISION: c556c90adee0f12b5ce81c9c8108eab8e53aec16

concurrency:
  group: product-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check complete public history hygiene
        run: python3 scripts/check_remote_hygiene.py --all

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          FRAMEWORK_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("gradle/common-java.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'turboismFrameworkVersion"\]\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
          if match is None:
              raise SystemExit("framework version is unavailable")
          print(match.group(1))
          PY
          )"
          test "$VERSION" = "$FRAMEWORK_VERSION"
          grep -Fq "## [$VERSION] - " CHANGELOG.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nsis

      - name: Validate store eligibility policy
        id: policy
        run: |
          OUTPUT="$(python3 scripts/release/prepare-market-release.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest packaging/market-plugins.json \
            --plan)"
          ELIGIBLE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^selected=//p')"
          echo "eligible=${ELIGIBLE:-0}" >> "$GITHUB_OUTPUT"

      - name: Validate and build eligible plugin metadata
        if: steps.policy.outputs.eligible != '0'
        env:
          TURBOISM_WORKTREE_ID: market-publish
        run: ./gradlew --no-daemon validatePluginMeta verifyFirstPartyPluginMetadata

      - name: Stage all eligible plugin candidates
        if: steps.policy.outputs.eligible != '0'
        run: |
          python3 scripts/release/prepare-market-release.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest packaging/market-plugins.json \
            --build-root build/worktree/market-publish \
            --output build/market-release \
            --source-revision "${{ github.sha }}"

      - name: Run release verification
        run: |
          ./gradlew --no-daemon checkRelease \
            -PinstallerVersion="${{ steps.version.outputs.version }}" \
            -PturboismRelease=true \
            --console=plain

      - name: Assemble release archives and Windows installer
        run: bash packaging/windows-installer/assemble-release.sh "${{ steps.version.outputs.version }}"

      - name: Verify checksums and release metadata
        run: |
          (
            cd build/windows-installer/dist
            sha256sum -c *.sha256
          )
          python3 scripts/release/verify-release.py \
            --version "${{ steps.version.outputs.version }}" \
            --dist build/windows-installer/dist \
            --release-plugins packaging/release-plugins.txt \
            --windows-stage build/windows-installer/staging \
            --manifest-output build/release-orchestrator/framework-artifacts.json

      - name: Generate deterministic release candidate
        run: |
          market_args=()
          if [ "${{ steps.policy.outputs.eligible }}" != 0 ]; then
            market_args=(--market-dir build/market-release)
          fi
          python3 scripts/release/turboism-release.py build \
            --require-tag \
            --dist build/windows-installer/dist \
            "${market_args[@]}" \
            --candidate build/release-orchestrator/candidate.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("build/release-orchestrator/candidate.json")
          candidate = json.loads(path.read_text(encoding="utf-8"))
          revision = os.environ["PLUGIN_DIRECTORY_REVISION"]
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("Plugin Directory revision must be an immutable commit SHA")
          candidate["pluginDirectoryRevision"] = revision
          path.write_text(
              json.dumps(candidate, separators=(",", ":"), sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Extract release notes from changelog
        run: |
          python3 scripts/release/extract-release-notes.py \
            CHANGELOG.md "${{ steps.version.outputs.version }}" \
            > build/release-orchestrator/release-notes.md

      - name: Upload verified candidate payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turboism-release-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/windows-installer/dist
            build/windows-installer/staging
            build/release-orchestrator/candidate.json
            build/release-orchestrator/framework-artifacts.json
            build/release-orchestrator/release-notes.md
            build/release/sdk-docs
            build/release/sdk-docs-bundle
          retention-days: 7
          if-no-files-found: error

      - name: Upload market publication bundle
        if: steps.policy.outputs.eligible != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turboism-market-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/market-release
          retention-days: 7
          if-no-files-found: error
