# One source-bound build entry for stable, beta and changed-only nightly.
# 20:20 UTC = 04:20 next day in Asia/Shanghai (UTC+08:00).
# Candidate builds are read-only; a separate allocator writes only the build ledger.
# Explicit protected GitHub promotion owns remote tag/release creation.

name: Product release candidate

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Stable/Beta produce reviewed candidates; Nightly publishes automatically only for new main changes
        type: choice
        options: [stable, beta, nightly]
        default: stable
        required: true
      version:
        description: Beta requires the committed base plus beta.N/rc.N/alpha.N; leave blank for Stable/Nightly
        type: string
        required: false
        default: ''
      expected_source_sha:
        description: Exact main commit to build; mismatches fail rather than follow a moving branch
        required: true
        type: string

permissions:
  contents: read

env:
  PLUGIN_DIRECTORY_REVISION: c556c90adee0f12b5ce81c9c8108eab8e53aec16

concurrency:
  group: product-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'turboism/Turboism' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.target.outputs.should_build }}
      channel: ${{ steps.target.outputs.channel }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the pinned source and skip unchanged Nightly before allocation
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"; fi
          python3 scripts/release/product-build.py preflight --source "$GITHUB_SHA" --channel "$CHANNEL" --version "$VERSION"
  allocate-build:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/allocate-build.yml
    with:
      expected_source_sha: ${{ github.sha }}
      channel: ${{ needs.preflight.outputs.channel }}
      version: ${{ needs.preflight.outputs.version }}
  build:
    needs: [preflight, allocate-build]
    permissions:
      contents: read
    env:
      TURBOISM_BUILD_NUMBER: ${{ needs.allocate-build.outputs.build_number }}
      TURBOISM_SOURCE_REVISION: ${{ github.sha }}
      TURBOISM_BUILD_VERSION: ${{ needs.allocate-build.outputs.build_version }}
      TURBOISM_BUILD_CHANNEL: ${{ needs.allocate-build.outputs.build_channel }}
      ORG_GRADLE_PROJECT_turboismRelease: 'true'
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out immutable candidate revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify requested source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test '${{ needs.allocate-build.outputs.run_attempt }}' = "$GITHUB_RUN_ATTEMPT" || { echo '::error::A rebuilt candidate needs a new identity. Re-run ALL jobs, including allocate-build.'; exit 1; }

      - name: Check complete public history hygiene
        run: python3 scripts/check_remote_hygiene.py --all

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TURBOISM_BUILD_CHANNEL" != stable ]; then
            echo "version=$TURBOISM_BUILD_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("gradle/common-java.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'turboismFrameworkVersion"\]\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
          if match is None:
              raise SystemExit("framework version is unavailable")
          print(match.group(1))
          PY
          )"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # A version already bound to another source cannot be reused.
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            test "$(git rev-parse "v$VERSION^{commit}")" = "$GITHUB_SHA"
          fi
          grep -Fq "## [$VERSION] - " CHANGELOG.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nsis

      - name: Validate store eligibility policy
        if: needs.preflight.outputs.channel == 'stable'
        id: policy
        run: |
          OUTPUT="$(python3 scripts/release/prepare-market-release.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest packaging/market-plugins.json \
            --plan)"
          ELIGIBLE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^selected=//p')"
          echo "eligible=${ELIGIBLE:-0}" >> "$GITHUB_OUTPUT"

      - name: Validate and build eligible plugin metadata
        if: needs.preflight.outputs.channel == 'stable' && steps.policy.outputs.eligible != '0'
        env:
          TURBOISM_WORKTREE_ID: market-publish
        run: ./gradlew --no-daemon validatePluginMeta verifyFirstPartyPluginMetadata

      - name: Stage all eligible plugin candidates
        if: needs.preflight.outputs.channel == 'stable' && steps.policy.outputs.eligible != '0'
        run: |
          python3 scripts/release/prepare-market-release.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest packaging/market-plugins.json \
            --build-root build/worktree/market-publish \
            --output build/market-release \
            --source-revision "${{ github.sha }}"

      - name: Run release verification
        run: |
          ./gradlew --no-daemon checkRelease \
            -PinstallerVersion="${{ steps.version.outputs.version }}" \
            -PturboismRelease=true \
            --console=plain

      - name: Assemble release archives and Windows installer
        run: bash packaging/windows-installer/assemble-release.sh "${{ steps.version.outputs.version }}"

      - name: Verify checksums and release metadata
        run: |
          (
            cd build/windows-installer/dist
            sha256sum -c *.sha256
          )
          python3 scripts/release/verify-release.py \
            --version "${{ steps.version.outputs.version }}" \
            --channel "$TURBOISM_BUILD_CHANNEL" \
            --dist build/windows-installer/dist \
            --release-plugins packaging/release-plugins.txt \
            --windows-stage build/windows-installer/staging \
            --manifest-output build/release-orchestrator/framework-artifacts.json

      - name: Generate deterministic release candidate
        if: needs.preflight.outputs.channel == 'stable'
        run: |
          # Local-only tag after all build/payload checks; never push from this job.
          python3 scripts/release/promote-github-release.py candidate-tag \
            --source-root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA"
          market_args=()
          if [ "${{ steps.policy.outputs.eligible }}" != 0 ]; then
            market_args=(--market-dir build/market-release)
          fi
          python3 scripts/release/turboism-release.py build \
            --require-tag \
            --dist build/windows-installer/dist \
            "${market_args[@]}" \
            --candidate build/release-orchestrator/candidate.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("build/release-orchestrator/candidate.json")
          candidate = json.loads(path.read_text(encoding="utf-8"))
          revision = os.environ["PLUGIN_DIRECTORY_REVISION"]
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("Plugin Directory revision must be an immutable commit SHA")
          candidate["pluginDirectoryRevision"] = revision
          path.write_text(
              json.dumps(candidate, separators=(",", ":"), sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Extract release notes from changelog
        if: needs.preflight.outputs.channel == 'stable'
        run: |
          python3 scripts/release/extract-release-notes.py \
            CHANGELOG.md "${{ steps.version.outputs.version }}" \
            > build/release-orchestrator/release-notes.md

      - name: Write allocated build identity into the candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/build-identity.py receipt --source "$GITHUB_SHA" --version "$TURBOISM_BUILD_VERSION" --channel "$TURBOISM_BUILD_CHANNEL" --output build/release-orchestrator/build-identity.json

      - name: Prepare immutable Beta or Nightly candidate evidence
        if: needs.preflight.outputs.channel != 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -a build/windows-installer/dist build/release-orchestrator/dist
          python3 scripts/release/product-build.py prepare --source "$GITHUB_SHA" --channel "$TURBOISM_BUILD_CHANNEL" --version "$TURBOISM_BUILD_VERSION"
          rm -r build/release-orchestrator/dist

      - name: Upload verified candidate payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turboism-release-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/windows-installer/dist
            build/windows-installer/staging
            build/release-orchestrator/prerelease-candidate.json
            build/release-orchestrator/candidate.json
            build/release-orchestrator/build-identity.json
            build/release-orchestrator/framework-artifacts.json
            build/release-orchestrator/release-notes.md
          retention-days: 7
          if-no-files-found: error

      - name: Upload market publication bundle
        if: needs.preflight.outputs.channel == 'stable' && steps.policy.outputs.eligible != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turboism-market-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/market-release
          retention-days: 7
          if-no-files-found: error

      - name: Report candidate promotion identity
        run: |
          {
            echo '## Candidate verified — no official tag or Release was published'
            echo "Source: $GITHUB_SHA"
            echo "Candidate run: $GITHUB_RUN_ID; attempt: $GITHUB_RUN_ATTEMPT"
            if [ "$TURBOISM_BUILD_CHANNEL" = nightly ]; then
              echo 'The separate Nightly publishing job will revalidate this identity before publication.'
            else
              echo 'Review the artifacts, then explicitly dispatch release-github-only.yml.'
            fi
            echo "Channel: $TURBOISM_BUILD_CHANNEL; version: $TURBOISM_BUILD_VERSION; Build: $TURBOISM_BUILD_NUMBER"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-nightly:
    needs: [preflight, allocate-build, build]
    if: needs.preflight.outputs.channel == 'nightly' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    concurrency:
      group: turboism-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: turboism-release-candidate-${{ github.sha }}-${{ github.run_id }}-${{ needs.allocate-build.outputs.run_attempt }}
          path: build/nightly-candidate
      - name: Revalidate the exact successful build and publish only Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ATTEMPT: ${{ needs.allocate-build.outputs.run_attempt }}
        run: |
          cp -a build/nightly-candidate/windows-installer/dist build/nightly-candidate/release-orchestrator/dist
          python3 scripts/release/product-build.py publish-nightly --source "$GITHUB_SHA" --channel nightly --attempt "$CANDIDATE_ATTEMPT" --bundle build/nightly-candidate/release-orchestrator
