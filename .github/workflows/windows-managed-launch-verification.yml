# Synthetic Windows managed-launch and managed-Graal verification.
# This lane never discovers or launches an installed Cubism host.
# The native suite is offline by default; its optional live-download smoke
# provisions only a temporary private runtime and never executes Java.
# workflow_dispatch keeps Windows minutes explicit and reviewable.

name: Windows managed launch verification

on:
  workflow_dispatch:
    inputs:
      live_graal_download:
        description: "Verify the pinned official Graal download without Java (326 MiB)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-native-graal-installer:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Verify native Graal provisioning without Java (Windows PowerShell 5.1)
        shell: powershell
        run: .\packaging\windows-installer\test-managed-graal-install.ps1
      - name: Verify native Graal provisioning without Java (PowerShell 7)
        shell: pwsh
        run: .\packaging\windows-installer\test-managed-graal-install.ps1
      - name: Verify actual pinned Graal download without Java
        if: ${{ inputs.live_graal_download }}
        timeout-minutes: 15
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ("Turboism Graal download " + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $previousPath = $env:PATH
          $previousJavaHome = $env:JAVA_HOME
          try {
            $env:PATH = ""
            $env:JAVA_HOME = ""
            & .\packaging\windows-installer\install-managed-graal.ps1 -HomePath $fixture
            if ($LASTEXITCODE -ne 0) { throw "Native Graal download exited with $LASTEXITCODE" }
            $config = Get-Content -LiteralPath (Join-Path $fixture "config.json") -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($config.launcher.graalVmPath -ne (Join-Path $fixture "graal\runtime")) {
              throw "Downloaded Graal path was not recorded correctly"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $fixture "graal\runtime\bin\java.exe") -PathType Leaf)) {
              throw "Downloaded runtime is missing"
            }
            Write-Host "Pinned official Graal archive downloaded, verified, extracted, and configured without Java."
          } finally {
            $env:PATH = $previousPath
            $env:JAVA_HOME = $previousJavaHome
            Remove-Item -LiteralPath $fixture -Recurse -Force
          }

  verify-managed-launch:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Select Git for Windows bash
        shell: powershell
        run: |
          $gitBashDirectory = Join-Path $env:ProgramFiles "Git\bin"
          $gitBash = Join-Path $gitBashDirectory "bash.exe"
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "Git for Windows bash is unavailable: $gitBash"
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            $gitBashDirectory + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )
          & $gitBash --version
      - name: Set up Java 17
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify managed Graal on Windows filesystems
        shell: powershell
        env:
          TURBOISM_WORKTREE_ID: windows-managed-launch-ci
        run: .\gradlew.bat :runtime:test --tests dev.turboism.graal.ManagedGraalRuntimeServiceTest --tests dev.turboism.graal.ManagedGraalRuntimeCliTest --console=plain
      - name: Run synthetic managed-launch gate
        shell: powershell
        run: .\packaging\windows-installer\test-managed-launch.ps1
