# Synthetic Windows managed-launch and managed-Graal verification.
# This lane never downloads, discovers, or launches an installed Cubism host.
# It uses temporary Cubism-shaped fixtures, local Java tests, and production
# PowerShell seams stopped before network access.
# workflow_dispatch keeps Windows minutes explicit and reviewable.

name: Windows managed launch verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-managed-launch:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Select Git for Windows bash
        shell: powershell
        run: |
          $gitBashDirectory = Join-Path $env:ProgramFiles "Git\bin"
          $gitBash = Join-Path $gitBashDirectory "bash.exe"
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "Git for Windows bash is unavailable: $gitBash"
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            $gitBashDirectory + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )
          & $gitBash --version
      - name: Set up Java 17
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify managed Graal on Windows filesystems
        shell: powershell
        env:
          TURBOISM_WORKTREE_ID: windows-managed-launch-ci
        run: .\gradlew.bat :runtime:test --tests dev.turboism.graal.ManagedGraalRuntimeServiceTest --tests dev.turboism.graal.ManagedGraalRuntimeCliTest --console=plain
      - name: Verify managed Graal PowerShell bridge
        shell: powershell
        run: |
          $turboismHome = Join-Path $env:RUNNER_TEMP "Turboism bridge home"
          New-Item -ItemType Directory -Path $turboismHome -Force | Out-Null
          $windowsPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $output = & $windowsPowerShell -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File ".\packaging\windows-installer\install-managed-graal.ps1" `
            -Home $turboismHome 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { throw "missing-agent bridge fixture unexpectedly succeeded" }
          if ($output -match '(?i)cannot overwrite variable home|variable home.*read.only') {
            throw "managed Graal bridge still collides with PowerShell HOME: $output"
          }
          if ($output -notmatch 'Turboism agent is missing') {
            throw "managed Graal bridge did not reach the expected fixture boundary: $output"
          }
          $log = Join-Path $turboismHome "logs\installer\managed-graal-install.log"
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) {
            throw "managed Graal bridge did not persist its diagnostic log: $log"
          }
      - name: Run synthetic managed-launch gate
        shell: powershell
        run: .\packaging\windows-installer\test-managed-launch.ps1
