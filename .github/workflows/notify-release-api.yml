name: Notify release API
on:
  release:
    types: [published, edited, deleted, unpublished, prereleased, released]
  workflow_run:
    workflows: ['Publish verified GitHub release', 'Product release candidate']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: turboism-release-api-notification
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Authenticate with GitHub OIDC and request a refresh of public releases
        env:
          RELEASE_SYNC_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/monitor/notify-release-api.mjs
