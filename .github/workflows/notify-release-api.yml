name: Notify release API
on:
  release:
    types: [published, edited, deleted, unpublished, prereleased, released]
  workflow_run:
    workflows: ['Publish verified GitHub release']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: turboism-release-api-notification
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate with GitHub OIDC and request a refresh of public releases
        run: |
          node --input-type=module <<'JS'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'https://api.turboism.dev');
          const tokenResponse = await fetch(url, {headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},signal:AbortSignal.timeout(15000)});
          if (!tokenResponse.ok) throw new Error(`OIDC request failed: ${tokenResponse.status}`);
          const {value} = await tokenResponse.json();
          console.log(`::add-mask::${value}`);
          const response = await fetch('https://api.turboism.dev/v1/sync', {method:'POST',headers:{Authorization:`Bearer ${value}`},signal:AbortSignal.timeout(60000)});
          if (!response.ok) throw new Error(`Release refresh failed: HTTP ${response.status}. The scheduled refresh remains enabled.`);
          const status = await response.json();
          console.log(JSON.stringify(status));
          if(status.channels?.some(c=>c.status==='unavailable')) throw new Error('A channel did not synchronize; inspect the API health and release metadata');
          JS
