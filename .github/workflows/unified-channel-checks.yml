name: Unified build channel checks
on:
  push:
    branches: [feat/unified-build-channels-20260909]
  pull_request:
    paths: ['gradle/**', 'runtime/**', 'scripts/release/**', 'scripts/test/**', 'packaging/**', '.github/workflows/**', 'RELEASING.md']
permissions:
  contents: read
concurrency:
  group: unified-channel-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Release and API regression tests
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -m unittest discover -s scripts/test -p 'test_release*.py'
          node --test distribution/test/*.test.mjs
      - name: Verify source hygiene
        run: python3 scripts/check_remote_hygiene.py --worktree
      - name: Retain exact tested source
        if: always()
        run: |
          mkdir -p artifacts
          git archive HEAD | gzip > artifacts/source.tar.gz
          git rev-parse HEAD > artifacts/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-channel-checks
          path: artifacts
          retention-days: 7
