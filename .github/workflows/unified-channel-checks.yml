# Unified build channel, distribution and release-tooling checks.
#
# This workflow owns the release/channel/distribution regression suites, one
# Worker dry-run, the serial no-clean channel switch chain and the release-only
# Gradle packaging gate (`checkReleasePackaging`). Ordinary pull requests that
# do not touch release, packaging, distribution or build-channel identity paths
# skip this workflow completely.
#
#   release-gates   single job on matching PRs and main pushes: Node/Python
#                   regression suites, Worker bundle dry-run, worktree hygiene,
#                   no-clean channel chain, and `checkReleasePackaging`.
#   channel-package real per-channel NSIS/ZIP/JAR packaging matrix on `main`
#                   pushes only (`github.event_name != 'pull_request'`).
#
# release-notes/** is deliberately not a trigger: `checkLocalizedChangelogs`
# runs in `devCheck` on every pull request without path filters, so notes-only
# edits never schedule release or packaging jobs.

name: Unified build channel checks
on:
  push:
    branches: [main]
    paths:
      - 'gradle/common-java.gradle.kts'
      - 'gradle/asm-admission.gradle.kts'
      - 'gradle/verification.gradle.kts'
      - 'gradle/gates.txt'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'runtime/build.gradle.kts'
      - 'runtime/src/main/java/dev/turboism/core/FrameworkBuildInfo.java'
      - 'runtime/src/test/java/dev/turboism/core/FrameworkBuildInfoTest.java'
      - 'scripts/release/**'
      - 'scripts/plugin_event_metadata.py'
      - 'scripts/dev/mapping-review.sh'
      - 'scripts/dev/worktree-id.sh'
      - 'scripts/dev/worktree-id-lib.sh'
      - 'scripts/test/test_*release*.py'
      - 'scripts/test/test_build_channels.py'
      - 'scripts/test/test_nightly.py'
      - 'scripts/test/test_prerelease.py'
      - 'scripts/test/test_product_cli.py'
      - 'scripts/test/verify_built_identity.py'
      - 'scripts/test/test_asm_supply_chain_admission.sh'
      - 'scripts/test/asm_admission_gate.py'
      - 'scripts/test/test_mapping_review_wrapper_args.sh'
      - 'validation/supply-chain/**'
      - 'packaging/**'
      - '.github/workflows/unified-channel-checks.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/allocate-build.yml'
      - '.github/workflows/framework-release-signing.yml'
      - '.github/workflows/publish-selected-plugins.yml'
      - 'docs/RELEASING.md'
      - 'LICENSE'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - 'distribution/**'
  pull_request:
    paths:
      - 'gradle/common-java.gradle.kts'
      - 'gradle/asm-admission.gradle.kts'
      - 'gradle/verification.gradle.kts'
      - 'gradle/gates.txt'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'runtime/build.gradle.kts'
      - 'runtime/src/main/java/dev/turboism/core/FrameworkBuildInfo.java'
      - 'runtime/src/test/java/dev/turboism/core/FrameworkBuildInfoTest.java'
      - 'scripts/release/**'
      - 'scripts/plugin_event_metadata.py'
      - 'scripts/dev/mapping-review.sh'
      - 'scripts/dev/worktree-id.sh'
      - 'scripts/dev/worktree-id-lib.sh'
      - 'scripts/test/test_*release*.py'
      - 'scripts/test/test_build_channels.py'
      - 'scripts/test/test_nightly.py'
      - 'scripts/test/test_prerelease.py'
      - 'scripts/test/test_product_cli.py'
      - 'scripts/test/verify_built_identity.py'
      - 'scripts/test/test_asm_supply_chain_admission.sh'
      - 'scripts/test/asm_admission_gate.py'
      - 'scripts/test/test_mapping_review_wrapper_args.sh'
      - 'validation/supply-chain/**'
      - 'packaging/**'
      - '.github/workflows/unified-channel-checks.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/allocate-build.yml'
      - '.github/workflows/framework-release-signing.yml'
      - '.github/workflows/publish-selected-plugins.yml'
      - 'docs/RELEASING.md'
      - 'LICENSE'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - 'distribution/**'
permissions:
  contents: read
concurrency:
  group: unified-channel-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore Gradle build and SDK reference caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/turboism-sdk-reference-v1
          key: turboism-gradle-build-cache-v1-${{ github.workflow }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turboism-gradle-build-cache-v1-${{ github.workflow }}-${{ github.sha }}-
            turboism-gradle-build-cache-v1-${{ github.workflow }}-
            turboism-gradle-build-cache-v1-CI-${{ github.sha }}-
            turboism-gradle-build-cache-v1-CI-
            turboism-gradle-build-cache-v1-
      - name: Install the NSIS installer compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nsis
      - name: Distribution, release and channel regression tests
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -m unittest scripts.test.test_build_channels scripts.test.test_nightly scripts.test.test_prerelease scripts.test.test_product_cli scripts.test.test_release_details
          node --test distribution/test/*.test.mjs
          git diff --check
          npx --yes wrangler@4.127.0 deploy --dry-run --config distribution/wrangler.json --outdir build/worker-dry-run
      - name: Source hygiene
        run: python3 scripts/check_remote_hygiene.py --worktree
      - name: Check local metadata and successive channel inputs without cleaning
        # Reuses one Gradle daemon across the four fast channel-switch probes, then
        # stops it before QA environment variables are injected for the release gate.
        run: |
          ./gradlew -q printBuildInfo
          ./gradlew :runtime:test --tests dev.turboism.core.FrameworkBuildInfoTest -PturboismChannel=beta --console=plain
          ./gradlew :runtime:test --tests dev.turboism.core.FrameworkBuildInfoTest -PturboismChannel=nightly --console=plain
          ./gradlew :runtime:test --tests dev.turboism.core.FrameworkBuildInfoTest -PturboismChannel=stable --console=plain
          ./gradlew --stop
      - name: Resolve explicit QA-only identity, without allocating or publishing a product build
        run: |
          BASE=$(python3 -c 'import sys;sys.path.insert(0,"scripts/release");from turboism_release.versions import framework_version;from pathlib import Path;print(framework_version(Path.cwd()))')
          echo "TURBOISM_BUILD_VERSION=$BASE" >> "$GITHUB_ENV"
          echo "TURBOISM_BUILD_CHANNEL=stable" >> "$GITHUB_ENV"
          echo "TURBOISM_BUILD_NUMBER=900000000" >> "$GITHUB_ENV"
          echo "TURBOISM_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_turboismRelease=true" >> "$GITHUB_ENV"
      - name: Run the release-only gate
        run: ./gradlew --no-daemon checkReleasePackaging -PinstallerVersion="$TURBOISM_BUILD_VERSION" -PturboismRelease=true --console=plain
      - name: Retain exact tested source and history
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          git archive HEAD | gzip > artifacts/source.tar.gz
          git bundle create artifacts/history.bundle HEAD --tags
          git rev-parse HEAD > artifacts/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event_name != 'pull_request'
        with:
          name: unified-channel-source
          path: artifacts
          retention-days: 7
  channel-package:
    # Real three-channel NSIS/ZIP/JAR packaging runs on main pushes only; pull
    # requests already validate channel metadata and checkReleasePackaging above.
    if: github.event_name != 'pull_request'
    needs: release-gates
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta, nightly]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore Gradle build and SDK reference caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/turboism-sdk-reference-v1
          key: turboism-gradle-build-cache-v1-${{ github.workflow }}-${{ matrix.channel }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turboism-gradle-build-cache-v1-${{ github.workflow }}-${{ matrix.channel }}-${{ github.sha }}-
            turboism-gradle-build-cache-v1-${{ github.workflow }}-${{ matrix.channel }}-
            turboism-gradle-build-cache-v1-${{ github.workflow }}-${{ github.sha }}-
            turboism-gradle-build-cache-v1-${{ github.workflow }}-
            turboism-gradle-build-cache-v1-CI-${{ github.sha }}-
            turboism-gradle-build-cache-v1-CI-
            turboism-gradle-build-cache-v1-
      - name: Install the NSIS installer compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nsis
      - name: Resolve explicit QA-only identity, without allocating or publishing a product build
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          BASE=$(python3 -c 'import sys;sys.path.insert(0,"scripts/release");from turboism_release.versions import framework_version;from pathlib import Path;print(framework_version(Path.cwd()))')
          if [ "$CHANNEL" = stable ]; then VERSION="$BASE"; NUMBER=900000000; elif [ "$CHANNEL" = beta ]; then VERSION="$BASE-beta.1"; NUMBER=900000001; else VERSION="$BASE-0.nightly.900000002"; NUMBER=900000002; fi
          echo "TURBOISM_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TURBOISM_BUILD_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "TURBOISM_BUILD_NUMBER=$NUMBER" >> "$GITHUB_ENV"
          echo "TURBOISM_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_turboismRelease=true" >> "$GITHUB_ENV"
      - name: Assemble the four real channel packages
        run: bash packaging/windows-installer/assemble-release.sh "$TURBOISM_BUILD_VERSION"
      - name: Verify all four real packages and their embedded identity
        run: |
          python3 scripts/release/verify-release.py --channel "$TURBOISM_BUILD_CHANNEL" --version "$TURBOISM_BUILD_VERSION" --dist build/windows-installer/dist --release-plugins packaging/release-plugins.txt --windows-stage build/windows-installer/staging --manifest-output build/qa-manifest.json
          python3 scripts/test/verify_built_identity.py > build/qa-identity.json
          git diff --exit-code
      - name: Retain reports only, never QA installers
        if: always()
        run: |
          mkdir -p artifacts
          cp build/qa-manifest.json build/qa-identity.json artifacts/ 2>/dev/null || true
          find build -path '*/test-results/*' -name '*.xml' -print0 | tar --null -T - -czf artifacts/junit-results.tar.gz
          git rev-parse HEAD > artifacts/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: channel-package-${{ matrix.channel }}
          path: artifacts
          retention-days: 7
