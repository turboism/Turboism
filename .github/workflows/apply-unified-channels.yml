name: Apply reviewed unified channel source
on:
  push:
    branches: [feat/unified-build-channels-20260909]
    paths: [.github/workflows/apply-unified-channels.yml]
permissions:
  contents: write
concurrency:
  group: apply-unified-channel-source
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Apply only the exact reviewed source patch, never workflow changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code 65dba5b35203c018956f4d8d490a9f6e8cd73758 HEAD -- . ':(exclude).github'
          python3 - <<'PY'
          import os,json,base64,hashlib,urllib.request,subprocess
          from pathlib import Path
          ids=['9593dec9b808d014f1f8b860fe76ea892e619d38','47267b2fb4e42d375610cf173621d6e80d203a25','75ddedbff774efeea53dfa682a4a3222570676b7','352dcad952f256231e6822db84b261acaf621ff7','5feb9941b5edb16fc1c99c3dd75fc5de2e8c98b0','fd0f2bc4c8064c1ed5b0ff75a97ab5ae394618ab','1158582b166dbb4881e0aa63f726e4c3fcde2290','f47dd275adc4f418d81337be61c2e1b127537c05']
          def blob(sha):
            req=urllib.request.Request('https://api.github.com/repos/turboism/Turboism/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as response:value=json.load(response)
            data=base64.b64decode(value['content'])
            assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==sha
            return data
          patch=b''.join(blob(sha) for sha in ids).replace(b'\n diff --git ',b'\ndiff --git ')
          assert hashlib.sha256(patch).hexdigest()=='8e70f5939116576776b32313488bc1b31daf0a6d73a8ece76bac153aa935233d'
          assert b'diff --git a/.github/' not in patch
          path=Path(os.environ['RUNNER_TEMP'])/'unified-source.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert changed and all(not p.startswith('.github/') for p in changed)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Run release and channel tests before committing source
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -m unittest discover -s scripts/test -p 'test_release*.py'
          python3 -m unittest discover -s scripts/test -p 'test_build_channels.py'
          python3 -m unittest discover -s scripts/test -p 'test_nightly.py'
          python3 -m unittest discover -s scripts/test -p 'test_prerelease.py'
          python3 -m unittest discover -s scripts/test -p 'test_product_cli.py'
          node --test distribution/test/*.test.mjs
          python3 scripts/check_remote_hygiene.py --worktree
      - name: Commit and push application source only to the isolated feature branch
        run: |
          test -z "$(git diff --cached --name-only -- .github)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: unify product channels, embedded build identity and verified prerelease publication'
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/tested-commit.txt
          git archive HEAD | gzip > artifacts/source.tar.gz
          git push origin HEAD:refs/heads/feat/unified-build-channels-20260909
      - name: Retain source evidence if writing is rejected
        if: always()
        run: |
          mkdir -p artifacts
          git diff --cached > artifacts/pending-source.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-channel-source-transport
          path: artifacts
          retention-days: 7
