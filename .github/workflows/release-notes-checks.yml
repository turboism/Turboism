name: Verify release notes
on:
  push:
    branches: [fix/nightly-release-notes-20260911]
  pull_request:
    paths: ['scripts/release/**', 'scripts/test/test_release_details.py', 'distribution/**', 'release-notes/**', '.github/workflows/release-notes-checks.yml']
permissions:
  contents: read
concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Retain the actual committed source for independent review
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          git archive HEAD > artifacts/source.tar
          git bundle create artifacts/history.bundle HEAD --tags
      - name: Distribution regression tests
        run: node --test distribution/test/*.test.mjs
      - name: Product identity regression tests
        run: python3 -m unittest discover -s scripts/release -p 'test*.py'
      - name: Frozen notes and publication regression tests
        run: python3 -m unittest scripts.test.test_release_details scripts.test.test_prerelease scripts.test.test_nightly scripts.test.test_build_channels scripts.test.test_release_promotion
      - name: Source hygiene
        run: python3 scripts/check_remote_hygiene.py --worktree
      - name: Validate Worker bundle without deploying
        run: npx --yes wrangler@4.127.0 deploy --dry-run --config distribution/wrangler.json --outdir artifacts/worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-details-source-and-checks
          path: artifacts
          retention-days: 7
