# First-party plugin release candidate builder.
# packaging/market-plugins.json is a persistent store-eligibility policy. The
# protected publisher compares every built candidate to the verified signed v2
# catalog and publishes only inferred changes.

name: Plugin release candidate

on:
  push:
    branches: ["main"]
    paths:
      - "plugins/**"
      - "packaging/market-plugins.json"
      - "scripts/release/prepare-market-release.py"
      - "scripts/release/turboism-release.py"
      - "scripts/release/turboism_release/**"
      - "scripts/test/test_prepare_market_release.py"
      - "scripts/test/test_release_orchestrator.py"
      - ".github/workflows/publish-selected-plugins.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

concurrency:
  group: plugin-release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-plugin-candidate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check complete public history hygiene
        run: python3 scripts/check_remote_hygiene.py --all

      - name: Validate store eligibility policy
        id: policy
        run: |
          OUTPUT="$(python3 scripts/release/prepare-market-release.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest packaging/market-plugins.json \
            --plan)"
          ELIGIBLE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^selected=//p')"
          echo "eligible=${ELIGIBLE:-0}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: steps.policy.outputs.eligible != '0'
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate and build eligible plugin metadata
        if: steps.policy.outputs.eligible != '0'
        env:
          TURBOISM_WORKTREE_ID: market-publish
        run: ./gradlew --no-daemon validatePluginMeta verifyFirstPartyPluginMetadata

      - name: Stage all eligible plugin candidates
        if: steps.policy.outputs.eligible != '0'
        run: |
          python3 scripts/release/prepare-market-release.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest packaging/market-plugins.json \
            --build-root build/worktree/market-publish \
            --output build/market-release \
            --source-revision "${{ github.sha }}"

      - name: Generate deterministic release candidate
        run: |
          market_args=()
          if [ "${{ steps.policy.outputs.eligible }}" != 0 ]; then
            market_args=(--market-dir build/market-release)
          fi
          python3 scripts/release/turboism-release.py build \
            "${market_args[@]}" \
            --candidate build/release-orchestrator/candidate.json

      - name: Upload release-plan candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turboism-plugin-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-orchestrator/candidate.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload market publication bundle
        if: steps.policy.outputs.eligible != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turboism-market-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/market-release
          retention-days: 7
          if-no-files-found: error
