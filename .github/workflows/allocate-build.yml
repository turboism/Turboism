name: Allocate product build identity
on:
  workflow_call:
    inputs:
      expected_source_sha:
        required: true
        type: string
      channel:
        required: false
        type: string
        default: stable
      version:
        required: false
        type: string
        default: ''
    outputs:
      build_number:
        value: ${{ jobs.allocate.outputs.build_number }}
      build_version:
        value: ${{ jobs.allocate.outputs.build_version }}
      build_channel:
        value: ${{ jobs.allocate.outputs.build_channel }}
      run_attempt:
        value: ${{ jobs.allocate.outputs.run_attempt }}
permissions:
  contents: write
jobs:
  allocate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      build_number: ${{ steps.identity.outputs.build_number }}
      run_attempt: ${{ github.run_attempt }}
      build_version: ${{ steps.identity.outputs.build_version }}
      build_channel: ${{ steps.identity.outputs.build_channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify caller and allocate an immutable identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          args=(--source "$GITHUB_SHA" --channel "$CHANNEL")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$CHANNEL" = nightly ]; then args+=(--nightly); fi
          python3 scripts/release/build-identity.py allocate "${args[@]}"
