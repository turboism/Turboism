# Minimum ordinary CI gate. Expensive host and release integration checks remain
# in their dedicated workflows and completed-commit verification paths.
#
# The dev-check job runs devCheck plus checkCompletedCommit (all module tests,
# packaged integration, Javadoc and tooling selftests) for every pull request
# and every main push. Visible-AWT tests run on an isolated Xvfb display with a
# fresh Gradle process. This workflow never publishes, never allocates a product
# build number and never launches a real host.

name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-check:
    name: devCheck
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install the isolated display server
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb

      - name: Install the pinned workflow guard tool
        run: python3 -m pip install 'PyYAML==6.0.3'

      - name: Verify the CI coverage contract
        run: python3 scripts/test/test_ci_coverage.py

      - name: Run development and completed-commit gates
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew --no-daemon devCheck checkCompletedCommit --console=plain
