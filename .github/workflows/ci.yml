# Minimum ordinary CI gate. Expensive host and release integration checks remain
# in their dedicated workflows and completed-commit verification paths.
#
# Pull requests run `:buildSrc:test` plus the fast `devCheck` gate in one single-use
# Gradle invocation under an isolated Xvfb display. Pushes to `main` execute the
# full `devCheck` + `checkCompletedCommit` closure (all module tests, packaged
# integration, Javadoc, formatting and tooling selftests). This workflow never
# publishes, never allocates a product build number and never launches a real host.

name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-check:
    name: devCheck
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore Gradle build and SDK reference caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/turboism-sdk-reference-v1
          key: turboism-gradle-build-cache-v1-${{ github.workflow }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turboism-gradle-build-cache-v1-${{ github.workflow }}-${{ github.sha }}-
            turboism-gradle-build-cache-v1-Unified build channel checks-${{ github.sha }}-
            turboism-gradle-build-cache-v1-${{ github.workflow }}-
            turboism-gradle-build-cache-v1-Unified build channel checks-
            turboism-gradle-build-cache-v1-

      - name: Ensure isolated display and shell lint tools
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends xvfb shellcheck
          fi

      - name: Install pinned lint and architecture tools
        run: |
          python3 -m pip install 'PyYAML==6.0.3' 'ruff==0.16.9'
          npm install --global '@ast-grep/cli'

      - name: Verify the CI coverage contract
        run: python3 scripts/test/test_ci_coverage.py

      - name: Run fast development gate on pull requests
        if: github.event_name == 'pull_request'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew --no-daemon :buildSrc:test devCheck --console=plain

      - name: Install image optimizer for completed-commit verification
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gifsicle

      - name: Run development and completed-commit gates on main
        if: github.event_name == 'push'
        env:
          TURBOISM_TEST_GIFSICLE: /usr/bin/gifsicle
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew --no-daemon :buildSrc:test devCheck checkCompletedCommit --console=plain
