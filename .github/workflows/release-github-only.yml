# Explicit promotion of verified product candidates; also resumes legacy drafts.
# No rebuild: the protected publisher creates the official tag only after validation.
name: Publish verified GitHub release
run-name: Publish GitHub release ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed Product release candidate workflow run id
        required: true
        type: string
      source_sha:
        description: Exact candidate source commit SHA
        required: true
        type: string
      candidate_run_attempt:
        description: Exact successful run attempt (required for new main candidates; optional for legacy tag runs)
        required: false
        default: ""
        type: string
      confirmation:
        description: Must be publish-github-only:<source_sha>
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  PLUGIN_DIRECTORY_REVISION: e49017551ac850bc5cc3cb6a5b4d45edbe030ac1

concurrency:
  group: turboism-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production-release
    timeout-minutes: 45
    steps:
      - name: Check out trusted publisher tooling
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Resolve verified candidate identity
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "publish-github-only:$SOURCE_SHA"
          python3 release-tools/scripts/release/promote-github-release.py resolve \
            --run-id "$RUN_ID" --source-sha "$SOURCE_SHA" --attempt "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate source separately from tooling
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Check complete public history hygiene
        run: python3 release-tools/scripts/check_remote_hygiene.py -C release-source --all

      - name: Download verified candidate payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: build/github-release-fallback/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Preflight candidate payload before any remote mutation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python3 release-tools/scripts/release/promote-github-release.py promote \
            --verify-only \
            --run-id "$RUN_ID" --source-sha "$SOURCE_SHA" --attempt "$RUN_ATTEMPT" \
            --confirmation "$CONFIRMATION" --source-root release-source \
            --bundle-root build/github-release-fallback/candidate

      - name: Download and verify market publication bundle if present
        id: market
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          set -euo pipefail
          MARKET_ARTIFACT="turboism-market-release-${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          FOUND="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .name == \"$MARKET_ARTIFACT\") | .id")"
          if [ -z "$FOUND" ]; then
            echo "has_plugins=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf build/github-release-fallback/market-release
          mkdir -p build/github-release-fallback/market-release
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$MARKET_ARTIFACT" \
            --dir build/github-release-fallback/market-release
          python3 release-tools/scripts/release/promote-github-release.py plugin-plan \
            --source-root release-source \
            --source-sha "$SOURCE_SHA" \
            --market-dir build/github-release-fallback/market-release \
            --output build/github-release-fallback/plan.json
          echo "has_plugins=true" >> "$GITHUB_OUTPUT"
          echo "market_artifact=$MARKET_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Check out public Plugin Directory verifier
        if: steps.market.outputs.has_plugins == 'true'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: turboism/turboism-plugin-directory
          ref: ${{ env.PLUGIN_DIRECTORY_REVISION }}
          path: build/github-release-fallback/plugin-directory
          persist-credentials: false

      - name: Verify pinned Plugin Directory revision
        if: steps.market.outputs.has_plugins == 'true'
        run: test "$(git -C build/github-release-fallback/plugin-directory rev-parse HEAD)" = "$PLUGIN_DIRECTORY_REVISION"

      - name: Dispatch or resume exact Plugin Directory request
        if: steps.market.outputs.has_plugins == 'true'
        id: provider
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_DIRECTORY_DISPATCH_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          MARKET_ARTIFACT: ${{ steps.market.outputs.market_artifact }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          REQUEST_ID="release-${SOURCE_SHA:0:12}-${SOURCE_RUN_ID}-${RUN_ATTEMPT}"
          DISPLAY_TITLE="Publish Plugin Directory v2 catalog · request ${REQUEST_ID}"
          matches() {
            gh run list \
              --repo turboism/turboism-plugin-directory \
              --workflow publish-plugin-directory-v2.yml \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId,displayTitle,status,conclusion,url \
              --jq ".[] | select(.displayTitle == \"$DISPLAY_TITLE\")"
          }
          MATCHES="$(matches)"
          COUNT="$(printf '%s\n' "$MATCHES" | jq -s 'length')"
          if [ "$COUNT" -eq 0 ]; then
            # workflow_dispatch needs a branch ref. Dispatch on main only when main is the
            # reviewed revision plus nothing but earlier catalog publications.
            CHANGED="$(gh api "repos/turboism/turboism-plugin-directory/compare/${PLUGIN_DIRECTORY_REVISION}...main" \
              --jq 'if (.status == "identical" or .status == "ahead") then ([.files[]?.filename] | map(select((startswith("public/api/v2/") or . == "catalog/v2/catalog.json") | not)) | length) else -1 end')"
            if [ "$CHANGED" != "0" ]; then
              echo "::error::turboism-plugin-directory main differs from the pinned ${PLUGIN_DIRECTORY_REVISION} outside catalog publications; re-pin after review."
              exit 1
            fi
            gh workflow run publish-plugin-directory-v2.yml \
              --repo turboism/turboism-plugin-directory \
              --ref main \
              -f source_run_id="$SOURCE_RUN_ID" \
              -f source_sha="$SOURCE_SHA" \
              -f artifact_name="$MARKET_ARTIFACT" \
              -f request_id="$REQUEST_ID"
            for _ in $(seq 1 30); do
              sleep 2
              MATCHES="$(matches)"
              COUNT="$(printf '%s\n' "$MATCHES" | jq -s 'length')"
              if [ "$COUNT" -ne 0 ]; then break; fi
            done
          fi
          if [ "$COUNT" -ne 1 ]; then
            echo "expected exactly one Plugin Directory run for $REQUEST_ID, found $COUNT"
            exit 1
          fi
          PROVIDER_RUN_ID="$(printf '%s\n' "$MATCHES" | jq -r .databaseId)"
          PROVIDER_STATUS="$(printf '%s\n' "$MATCHES" | jq -r .status)"
          PROVIDER_CONCLUSION="$(printf '%s\n' "$MATCHES" | jq -r '.conclusion // ""')"
          if [ "$PROVIDER_STATUS" = completed ]; then
            test "$PROVIDER_CONCLUSION" = success
          else
            gh run watch "$PROVIDER_RUN_ID" \
              --repo turboism/turboism-plugin-directory \
              --interval 10 \
              --exit-status
          fi
          echo "provider_run_id=$PROVIDER_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify public signed catalog and planned plugin bytes
        if: steps.market.outputs.has_plugins == 'true'
        id: verify
        run: |
          set -euo pipefail
          python3 release-tools/scripts/release/verify-plugin-publication.py \
            --plan build/github-release-fallback/plan.json \
            --verifier-repo build/github-release-fallback/plugin-directory \
            --timeout 300 \
            --output build/github-release-fallback/catalog-state.json
          CATALOG_FINGERPRINT="$(jq -c .catalogFingerprint build/github-release-fallback/catalog-state.json)"
          echo "catalog_fingerprint=$CATALOG_FINGERPRINT" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 30); do
            if curl -L --fail --silent --show-error --compressed \
                https://turboism.dev/plugins > build/github-release-fallback/directory-home.html && \
                grep -Fq "Turboism Plugin Directory" build/github-release-fallback/directory-home.html; then
              exit 0
            fi
            sleep 10
          done
          echo "Plugin Directory website https://turboism.dev/plugins did not respond before timeout"
          exit 1

      - name: Verify payload then create or resume official tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python3 release-tools/scripts/release/promote-github-release.py promote \
            --run-id "$RUN_ID" --source-sha "$SOURCE_SHA" --attempt "$RUN_ATTEMPT" \
            --confirmation "$CONFIRMATION" --source-root release-source \
            --bundle-root build/github-release-fallback/candidate
