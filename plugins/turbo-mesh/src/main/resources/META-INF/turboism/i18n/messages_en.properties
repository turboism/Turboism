turbo-mesh.algorithm.region.name=Turbo Mesh: texture regions
turbo-mesh.algorithm.region.description=Splits the texture into regions and triangulates each region with shared separator edges.
turbo-mesh.algorithm.region.parameter.minRegionRatio.label=Minimum region share
turbo-mesh.algorithm.region.parameter.minRegionRatio.description=Fraction of the painted area below which a region merges into its neighbour.
turbo-mesh.algorithm.region.parameter.autoMinRegionRatio.label=Fit region share to the silhouette
turbo-mesh.algorithm.region.parameter.autoMinRegionRatio.description=On: derive the share from the silhouette span, and ignore the value above.
turbo-mesh.algorithm.region.parameter.contrast.label=Colour contrast
turbo-mesh.algorithm.region.parameter.contrast.description=Lab colour distance that separates neighbouring regions.
turbo-mesh.algorithm.region.parameter.autoContrast.label=Fit contrast to the silhouette
turbo-mesh.algorithm.region.parameter.autoContrast.description=On: derive the contrast from the silhouette span, and ignore the value above.
turbo-mesh.algorithm.region.parameter.level.label=Region level
turbo-mesh.algorithm.region.parameter.level.description=Region depth: 1 merges the most, 3 keeps the finest regions.
turbo-mesh.algorithm.region.parameter.trackCount.label=Direction tracks
turbo-mesh.algorithm.region.parameter.trackCount.description=Guide lines the planner adds along each region.
turbo-mesh.algorithm.region.parameter.maxSpacing.label=Boundary spacing (px)
turbo-mesh.algorithm.region.parameter.maxSpacing.description=Longest boundary segment between two placed points.
turbo-mesh.algorithm.region.parameter.autoMaxSpacing.label=Fit boundary spacing to the silhouette
turbo-mesh.algorithm.region.parameter.autoMaxSpacing.description=On: derive the spacing from the silhouette span, and ignore the value above.
turbo-mesh.algorithm.region.parameter.simplifyTolerance.label=Outline simplification (px)
turbo-mesh.algorithm.region.parameter.simplifyTolerance.description=Largest deviation the outline simplification may introduce.
turbo-mesh.algorithm.region.parameter.autoSimplifyTolerance.label=Fit simplification to the silhouette
turbo-mesh.algorithm.region.parameter.autoSimplifyTolerance.description=On: derive the tolerance from the silhouette span, and ignore the value above.
turbo-mesh.algorithm.region.parameter.minSpacing.label=Minimum point distance (px)
turbo-mesh.algorithm.region.parameter.minSpacing.description=Closest distance two placed points may keep.
turbo-mesh.algorithm.region.parameter.autoMinSpacing.label=Fit minimum distance to the silhouette
turbo-mesh.algorithm.region.parameter.autoMinSpacing.description=On: derive the distance from the silhouette span, and ignore the value above.
turbo-mesh.algorithm.region.preset.sparse=Sparse
turbo-mesh.algorithm.region.preset.detailed=Detailed
turbo-mesh.algorithm.region.preset.hard-surface=Hard surface
turbo-mesh.algorithm.region.rejected.no-texture=The ArtMesh has no texture pixels, so the region planner cannot read the artwork.
turbo-mesh.algorithm.region.rejected.planning-failed=The region planner failed
turbo-mesh.algorithm.adaptive.name=Turbo Mesh: adaptive
turbo-mesh.algorithm.adaptive.description=Resamples the boundary by curvature and fills the interior with region-aware points.
turbo-mesh.algorithm.adaptive.parameter.density.label=Density preset
turbo-mesh.algorithm.adaptive.parameter.density.description=Feature weights that steer point placement.
turbo-mesh.algorithm.adaptive.parameter.maxBoundarySpacing.label=Boundary spacing (uv)
turbo-mesh.algorithm.adaptive.parameter.maxBoundarySpacing.description=Longest boundary segment between two placed points.
turbo-mesh.algorithm.adaptive.parameter.interiorSpacing.label=Interior spacing (uv)
turbo-mesh.algorithm.adaptive.parameter.interiorSpacing.description=Pitch of the interior point grid.
turbo-mesh.algorithm.adaptive.parameter.minSpacing.label=Minimum point distance (uv)
turbo-mesh.algorithm.adaptive.parameter.minSpacing.description=Closest distance two placed points may keep.
turbo-mesh.algorithm.adaptive.parameter.maxPoints.label=Point limit
turbo-mesh.algorithm.adaptive.parameter.maxPoints.description=Highest vertex count the run may produce; a larger plan fails.
turbo-mesh.algorithm.adaptive.option.density.auto-blend=Auto blend
turbo-mesh.algorithm.adaptive.option.density.soft-strip=Soft strip
turbo-mesh.algorithm.adaptive.option.density.soft-sheet=Soft sheet
turbo-mesh.algorithm.adaptive.option.density.rigid-geometry=Rigid geometry
