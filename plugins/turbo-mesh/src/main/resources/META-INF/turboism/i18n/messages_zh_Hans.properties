turbo-mesh.status.already-refined=当前网格已达到目标密度
turbo-mesh.algorithm.region.name=Turbo Mesh：纹理区域
turbo-mesh.algorithm.region.description=按纹理把图形分成若干区域，并用共享分界线分别三角化每个区域。
turbo-mesh.algorithm.region.parameter.minRegionRatio.label=区域最小占比
turbo-mesh.algorithm.region.parameter.minRegionRatio.description=小于该面积占比的区域会并入相邻区域。
turbo-mesh.algorithm.region.parameter.autoMinRegionRatio.label=占比按轮廓自适应
turbo-mesh.algorithm.region.parameter.autoMinRegionRatio.description=开启时按轮廓尺寸推算占比，忽略上面的数值。
turbo-mesh.algorithm.region.parameter.contrast.label=颜色对比度
turbo-mesh.algorithm.region.parameter.contrast.description=区分相邻区域的 Lab 色差。
turbo-mesh.algorithm.region.parameter.autoContrast.label=对比度按轮廓自适应
turbo-mesh.algorithm.region.parameter.autoContrast.description=开启时按轮廓尺寸推算对比度，忽略上面的数值。
turbo-mesh.algorithm.region.parameter.level.label=区域层级
turbo-mesh.algorithm.region.parameter.level.description=区域细度：1 合并最多，3 保留最细的区域。
turbo-mesh.algorithm.region.parameter.trackCount.label=方向引导线数
turbo-mesh.algorithm.region.parameter.trackCount.description=沿每个区域追加的引导线条数。
turbo-mesh.algorithm.region.parameter.maxSpacing.label=边界间距（px）
turbo-mesh.algorithm.region.parameter.maxSpacing.description=相邻布点之间边界线段的最大长度。
turbo-mesh.algorithm.region.parameter.autoMaxSpacing.label=边界间距按轮廓自适应
turbo-mesh.algorithm.region.parameter.autoMaxSpacing.description=开启时按轮廓尺寸推算间距，忽略上面的数值。
turbo-mesh.algorithm.region.parameter.simplifyTolerance.label=轮廓简化（px）
turbo-mesh.algorithm.region.parameter.simplifyTolerance.description=简化轮廓时允许的最大偏差。
turbo-mesh.algorithm.region.parameter.autoSimplifyTolerance.label=简化量按轮廓自适应
turbo-mesh.algorithm.region.parameter.autoSimplifyTolerance.description=开启时按轮廓尺寸推算偏差，忽略上面的数值。
turbo-mesh.algorithm.region.parameter.minSpacing.label=最小点间距（px）
turbo-mesh.algorithm.region.parameter.minSpacing.description=两个布点之间保留的最小距离。
turbo-mesh.algorithm.region.parameter.autoMinSpacing.label=最小间距按轮廓自适应
turbo-mesh.algorithm.region.parameter.autoMinSpacing.description=开启时按轮廓尺寸推算距离，忽略上面的数值。
turbo-mesh.algorithm.region.preset.sparse=稀疏
turbo-mesh.algorithm.region.preset.detailed=精细
turbo-mesh.algorithm.region.preset.hard-surface=硬表面
turbo-mesh.algorithm.region.rejected.no-texture=该 ArtMesh 没有纹理像素，区域规划器无法读取画面。
turbo-mesh.algorithm.region.rejected.planning-failed=区域规划器失败
turbo-mesh.algorithm.adaptive.name=Turbo Mesh：自适应
turbo-mesh.algorithm.adaptive.description=按曲率重采样边界，并用区域感知的点填充内部。
turbo-mesh.algorithm.adaptive.parameter.density.label=密度预设
turbo-mesh.algorithm.adaptive.parameter.density.description=影响布点的特征权重。
turbo-mesh.algorithm.adaptive.parameter.maxBoundarySpacing.label=边界间距（uv）
turbo-mesh.algorithm.adaptive.parameter.maxBoundarySpacing.description=相邻布点之间边界线段的最大长度。
turbo-mesh.algorithm.adaptive.parameter.interiorSpacing.label=内部间距（uv）
turbo-mesh.algorithm.adaptive.parameter.interiorSpacing.description=内部点网格的间距。
turbo-mesh.algorithm.adaptive.parameter.minSpacing.label=最小点间距（uv）
turbo-mesh.algorithm.adaptive.parameter.minSpacing.description=两个布点之间保留的最小距离。
turbo-mesh.algorithm.adaptive.parameter.maxPoints.label=点数上限
turbo-mesh.algorithm.adaptive.parameter.maxPoints.description=单次运行允许的最大顶点数，超出即失败。
turbo-mesh.algorithm.adaptive.option.density.auto-blend=自动混合
turbo-mesh.algorithm.adaptive.option.density.soft-strip=柔性条带
turbo-mesh.algorithm.adaptive.option.density.soft-sheet=柔性片状
turbo-mesh.algorithm.adaptive.option.density.rigid-geometry=刚性几何
turbo-mesh.algorithm.adaptive.preset.auto-blend=均衡
turbo-mesh.algorithm.adaptive.preset.soft-strip=柔性条带
turbo-mesh.algorithm.adaptive.preset.soft-sheet=柔性片状
turbo-mesh.algorithm.adaptive.preset.rigid-geometry=刚性几何
