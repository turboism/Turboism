plugin.name=보호된 내보내기
plugin.description=선택적 보호 런타임 모델 내보내기입니다. 작업 전용 복사본에서 Warp/회전 디포머를 평탄화하고 ArtMesh 식별자를 난독화하며, 완성된 스테이징 출력을 검증한 뒤 원자적으로 게시합니다. 검토된 Cubism 버전과 적격 모델에서만 동작합니다.
protected-export.option=보호된 내보내기
protected-export.unavailable=이 호스트 또는 모델에서는 보호된 내보내기를 사용할 수 없습니다. 검토된 Cubism 버전과 사전 검사를 통과한 모델만 지원됩니다.
