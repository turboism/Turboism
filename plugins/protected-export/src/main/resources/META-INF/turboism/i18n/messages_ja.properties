plugin.name=保護付きエクスポート
plugin.description=オプションの保護付きランタイムモデルエクスポートです。タスク専用コピー上でWarp/回転デフォーマを平坦化し、ArtMesh識別子を難読化し、完全なステージング出力を検証してからアトミックに公開します。レビュー済みのCubismバージョンと適格なモデルでのみ有効です。
protected-export.option=保護付きエクスポート
protected-export.unavailable=このホストまたはモデルでは保護付きエクスポートを利用できません。レビュー済みのCubismバージョンと、事前検査を通過したモデルのみ対応しています。
