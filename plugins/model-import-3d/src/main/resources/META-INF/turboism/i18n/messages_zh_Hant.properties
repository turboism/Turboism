dialog.appearance.message=選擇保留原材質，可匯入大型 GLB 人物的預設蒙皮和形態姿態。\n原生網格使用基礎色、自發光和透明貼圖；不還原法線貼圖及來源光照。\n靜態 glTF、OBJ 和 ZIP 保持原有大小與材質限制。\n原材質模式：X / Y / Z 各 ±180°。按面區分顏色：±30° 檢查。\n顏色方式：
dialog.appearance.option.source-material=保留原材質
dialog.appearance.option.face-colors=按面區分顏色
dialog.appearance.option.cancel=取消
dialog.confirm.atlas-info=紋理圖集：將建立 {0} 張 {1}×{2} 圖集。
dialog.confirm.title=確認匯入
dialog.confirm.simple=將建立 {0} 個網格，共 {1} 個形態。\n水平 / 垂直參數綁定點：{2} / {3}。\n可用一次復原撤回本次匯入。繼續？
dialog.confirm.layers=將建立 {0} 個曲面網格和 {1} 個變形器，保留源模型幾何與貼圖。\n水平 / 垂直參數綁定點：{2} / {3}。{4}\n遮擋層序取樣點：{5} / {6}。\n複雜交疊在旋轉時仍可能有偏差。可用一次復原撤回本次匯入。繼續？
dialog.confirm.layers.roll-note=\ Z 旋轉：5 點，三軸各 ±180°。
dialog.confirm.vertices=將建立 {0} 個曲面網格，保留原始 {1} 個三角形、UV 和貼圖。\nX / Y 各 9 個綁定點，使用橢圓插值；Z 旋轉：5 點，三軸各 ±180°。\n遮擋採用分組近似，複雜交疊仍可能有少量偏差。\n可用一次復原撤回本次匯入。整體移動或縮放時選擇「整體定位」變形器。繼續？
dialog.confirm.vertices-optimized=將建立 {0} 個曲面網格。\n源模型 {1} 面 → 匯入 {2} 面，保留材質邊界和 UV 接縫。\n曲面幾何與參數插值的合計偏差上界：{3} 像素（不含遮擋分組近似）。\nX / Y 各 9 點橢圓插值；Z 5 點；三軸各 ±180°。\n整體移動或縮放時選擇「整體定位」變形器。可用一次復原撤回本次匯入。繼續？
