dialog.appearance.title=导入 3D 模型
dialog.appearance.message=支持不透明静态 GLB、glTF、OBJ 与模型 ZIP。\n选择单独模型后，可按提示补选引用的材质、buffer 和 PNG/JPEG 贴图；也可一起打包为 ZIP。\n仅还原基础颜色；凹凸、光照与透明材质暂不支持。\n原材质模式：X / Y / Z 各 ±180°，支持整圈旋转。\n按面区分颜色为 ±30° 检查模式。\n颜色方式：
dialog.appearance.option.source-material=保留原材质
dialog.appearance.option.face-colors=按面区分颜色
dialog.appearance.option.cancel=取消
dialog.confirm.atlas-info=纹理图集：将创建 {0} 张 {1}×{2} 图集。
dialog.confirm.title=确认导入
dialog.confirm.simple=将创建 {0} 个网格，共 {1} 个形态。\n水平 / 垂直参数绑定点：{2} / {3}。\n可用一次撤销撤回本次导入。继续？
dialog.confirm.layers=将创建 {0} 个曲面网格和 {1} 个变形器，保留源模型几何与贴图。\n水平 / 垂直参数绑定点：{2} / {3}。{4}\n遮挡层序采样点：{5} / {6}。\n复杂交叠在旋转时仍可能有偏差。可用一次撤销撤回本次导入。继续？
dialog.confirm.layers.roll-note=\ Z 旋转：5 点，三轴各 ±180°。
dialog.confirm.vertices=将创建 {0} 个曲面网格，保留原始 {1} 个三角形、UV 和贴图。\nX / Y 各 9 个绑定点，使用椭圆插值；Z 旋转：5 点，三轴各 ±180°。\n遮挡采用分组近似，复杂交叠仍可能有少量偏差。\n可用一次撤销撤回本次导入。整体移动或缩放时选择“整体定位”变形器。继续？
dialog.confirm.vertices-optimized=将创建 {0} 个曲面网格。\n源模型 {1} 面 → 导入 {2} 面，保留材质边界和 UV 接缝。\n曲面几何与参数插值的合计偏差上界：{3} 像素（不含遮挡分组近似）。\nX / Y 各 9 点椭圆插值；Z 5 点；三轴各 ±180°。\n整体移动或缩放时选择“整体定位”变形器。可用一次撤销撤回本次导入。继续？
