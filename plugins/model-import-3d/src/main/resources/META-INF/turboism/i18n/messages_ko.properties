plugin.name=3D 모델 가져오기
plugin.description=정적 불투명 GLB, glTF, OBJ/MTL 및 모델 ZIP 패키지를 네이티브 Cubism 메시로 가져옵니다(PNG/JPEG 기본 색상 텍스처, XYZ 360도 회전 및 유계 지오메트리 최적화 지원).
