dialog.appearance.title=3D 모델 가져오기
dialog.appearance.message=정적 불투명 GLB, glTF, OBJ 및 모델 ZIP 패키지를 지원합니다.\n개별 모델 선택 후 메시지에 따라 참조 머티리얼, 버퍼 및 PNG/JPEG 텍스처를 추가 선택할 수 있습니다. ZIP으로 함께 묶을 수도 있습니다.\n기본 색상만 복원되며 노멀 맵, 조명 및 투명 머티리얼은 현재 지원되지 않습니다.\n원본 머티리얼 모드: X / Y / Z 각 ±180°, 360도 회전 지원.\n면별 색상 구분: ±30° 검사 모드.\n색상 모드:
dialog.appearance.option.source-material=원본 머티리얼 유지
dialog.appearance.option.face-colors=면별 색상 구분
dialog.appearance.option.cancel=취소
dialog.confirm.title=가져오기 확인
dialog.confirm.simple={0}개의 메시(총 {1}개 키)를 생성합니다.\n수평 / 수직 파라미터 바인딩 포인트: {2} / {3}.\n한 번의 실행 취소로 되돌릴 수 있습니다. 계속하시겠습니까?
dialog.confirm.layers={0}개의 곡면 메시와 {1}개의 디포머를 생성하여 원본 모델의 지오메트리와 텍스처를 유지합니다.\n수평 / 수직 파라미터 바인딩 포인트: {2} / {3}.{4}\n가림 레이어 샘플링 포인트: {5} / {6}.\n복잡하게 겹치는 부분은 회전 시 오차가 있을 수 있습니다. 한 번의 실행 취소로 되돌릴 수 있습니다. 계속하시겠습니까?
dialog.confirm.layers.roll-note=\ Z 회전: 5개 포인트, 3축 각 ±180°.
dialog.confirm.vertices={0}개의 곡면 메시를 생성하여 원본 {1}개의 삼각형, UV 및 텍스처를 유지합니다.\nX / Y 각 9개 바인딩 포인트(타원 보간 사용), Z 회전: 5개 포인트, 3축 각 ±180°.\n가림 처리는 그룹 근사를 사용하며 복잡하게 겹치는 부분은 약간의 오차가 있을 수 있습니다.\n한 번의 실행 취소로 되돌릴 수 있습니다. 전체를 이동하거나 크기를 조정할 때는 "전체 배치" 디포머를 선택하세요. 계속하시겠습니까?
dialog.confirm.vertices-optimized={0}개의 곡면 메시를 생성합니다.\n원본 모델 {1}면 → 가져오기 {2}면(머티리얼 경계 및 UV 심 유지).\n곡면 지오메트리 및 파라미터 보간의 합계 오차 상한: {3} 픽셀(가림 그룹 근사 제외).\nX / Y 각 9포인트 타원 보간, Z 5포인트, 3축 각 ±180°.\n전체를 이동하거나 크기를 조정할 때는 "전체 배치" 디포머를 선택하세요. 한 번의 실행 취소로 되돌릴 수 있습니다. 계속하시겠습니까?
dialog.message.info.title=3D 모델
