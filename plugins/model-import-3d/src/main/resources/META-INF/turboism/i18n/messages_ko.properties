success.xyz-rotation=가져오기가 완료되었습니다. 추가된 X / Y / Z 회전 파라미터(각 ±180°)를 드래그하여 한 바퀴 회전할 수 있습니다.\n전체를 이동하거나 크기를 조정할 때는 "전체 배치" 디포머를 선택하세요.
success.yaw-pitch=가져오기가 완료되었습니다. 추가된 Yaw / Pitch 파라미터를 드래그하여 회전할 수 있습니다.
