dialog.appearance.title=3D モデルのインポート
dialog.appearance.message=元の材質を選択すると、大型 GLB の既定のスキン・モーフ姿勢を読み込めます。\nベースカラー、発光、アルファを使用します。法線マップと元の照明は再現しません。\n静的 glTF、OBJ、ZIP の既存の容量・材質制限は維持されます。\n元の材質：X / Y / Z 各 ±180°。面の色分け：±30° 検査。\n色モード：
dialog.appearance.option.source-material=元のマテリアルを維持
dialog.appearance.option.face-colors=面ごとに色分け
dialog.appearance.option.cancel=キャンセル
dialog.confirm.atlas-info=テクスチャアトラス: {0} 枚（{1}×{2}）を作成します。
dialog.confirm.title=インポートの確認
dialog.confirm.simple={0} 個のメッシュ（計 {1} キー）を作成します。\n水平 / 垂直パラメータバインド点: {2} / {3}。\n1回の取り消し（Undo）で元に戻せます。続行しますか？
dialog.confirm.layers={0} 個の曲面メッシュと {1} 個のデフォーマを作成し、元モデルのジオメトリとテクスチャを維持します。\n水平 / 垂直パラメータバインド点: {2} / {3}。{4}\nオクルージョン層サンプリング点: {5} / {6}。\n複雑な重なりは回転時に偏差が生じる場合があります。1回の取り消しで元に戻せます。続行しますか？
dialog.confirm.layers.roll-note=\ Z 回転: 5 点、3軸各 ±180°。
dialog.confirm.vertices={0} 個の曲面メッシュを作成し、元の {1} 個の三角形、UV、テクスチャを維持します。\nX / Y 各 9 点の楕円補間バインド点、Z 回転: 5 点、3軸各 ±180°。\nオクルージョンはグループ近似を使用し、複雑な重なりにはわずかな偏差が生じる場合があります。\n1回の取り消しで元に戻せます。全体を移動または拡大縮小する場合は「全体配置」デフォーマを選択してください。続行しますか？
dialog.confirm.vertices-optimized={0} 個の曲面メッシュを作成します。\n元モデル: {1} 面 → インポート後 {2} 面（マテリアル境界と UV シームを維持）。\n曲面ジオメトリとパラメータ補間の合計誤差上限: {3} ピクセル（オクルージョングループ近似を除く）。\nX / Y 各 9 点の楕円補間、Z 5 点、3軸各 ±180°。\n全体を移動または拡大縮小する場合は「全体配置」デフォーマを選択してください。1回の取り消しで元に戻せます。続行しますか？
