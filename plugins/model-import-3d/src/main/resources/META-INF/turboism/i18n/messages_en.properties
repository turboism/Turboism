plugin.name=3D Model Import
plugin.description=Imports static opaque GLB, glTF, OBJ/MTL, and model ZIP packages as native Cubism meshes with PNG/JPEG base-color textures, XYZ full-circle rotation, and bounded geometry optimization.
action.import.label=Import 3D Model…
menu.group=3D Model
model.default-name=3D Model
file.chooser.title=Select GLB, glTF, OBJ, or model ZIP
resource.chooser.title=Select referenced model resource: {0}
dialog.appearance.title=Import 3D Model
dialog.appearance.message=Supports opaque static GLB, glTF, OBJ, and model ZIP packages.\nAfter choosing an individual model, you can select referenced materials, buffers, and PNG/JPEG textures when prompted; or package them together into a ZIP.\nOnly base colors are reconstructed; normal maps, lighting, and transparency are currently unsupported.\nOriginal Material Mode: X / Y / Z ±180° each, supporting full-circle rotation.\nDistinct Face Colors: ±30° inspection mode.\nColor mode:
dialog.appearance.option.source-material=Keep Original Materials
dialog.appearance.option.face-colors=Distinct Face Colors
dialog.appearance.option.cancel=Cancel
dialog.confirm.title=Confirm Import
dialog.confirm.simple=Will create {0} meshes with {1} total keys.\nHorizontal / vertical binding points: {2} / {3}.\nCan be undone in a single undo step. Continue?
dialog.confirm.layers=Will create {0} curved meshes and {1} deformers, preserving source model geometry and textures.\nHorizontal / vertical binding points: {2} / {3}.{4}\nOcclusion layer sampling points: {5} / {6}.\nComplex overlapping might still show deviations during rotation. Can be undone in a single undo step. Continue?
dialog.confirm.layers.roll-note=\ Z rotation: 5 points, ±180° on all three axes.
dialog.confirm.vertices=Will create {0} curved meshes, preserving original {1} triangles, UVs, and textures.\n9 binding points each for X / Y using elliptical interpolation; Z rotation: 5 points, ±180° on all three axes.\nOcclusion uses grouped approximation; complex overlapping might still show minor deviations.\nCan be undone in a single undo step. Select the "Overall Positioning" deformer to move or scale. Continue?
dialog.confirm.vertices-optimized=Will create {0} curved meshes.\nSource model: {1} faces -> imported {2} faces, preserving material boundaries and UV seams.\nCombined error bound for surface geometry and parameter interpolation: {3} pixels (excluding occlusion grouping approximation).\n9-point elliptical interpolation for X / Y; 5 points for Z; ±180° on all three axes.\nSelect the "Overall Positioning" deformer to move or scale. Can be undone in a single undo step. Continue?
dialog.message.info.title=3D Model
dialog.message.error.title=Cannot Import 3D Model
