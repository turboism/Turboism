dialog.appearance.title=Import 3D Model
dialog.appearance.message=Select source materials to import large GLB characters in their default skin and morph pose.\nNative meshes use base color, emissive and alpha textures; normal maps and source lighting are not reproduced.\nStatic glTF, OBJ and ZIP packages retain their existing size and material limits.\nOriginal materials: X / Y / Z ±180°. Distinct face colors: ±30° inspection.\nColor mode:
