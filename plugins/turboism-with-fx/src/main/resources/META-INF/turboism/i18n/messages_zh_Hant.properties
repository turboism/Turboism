label.config-owned-by-fx=連線 fx 後載入由 fx 管理的提供者與模型目錄。
label.config-applies-immediately=提供者和模型變更會立即套用至目前 fx 工作階段；憑證和持久設定仍由 fx 管理。
label.config-authentication-detail=內建設定由 fx 管理：請透過 fx 自有的 Codex、Vercel 或 Grok 登入流程完成驗證，Turboism 只切換目前 fx ACP 的提供者與模型。自訂 OpenAI 相容設定由 Turboism 管理：Turboism 會啟動本機回送轉接器並讓 fx 指向它。fx v0.0.5 本身沒有提供者或模型的建立/刪除 API。
label.config-updating=正在將所選設定套用至目前的 fx 工作階段…
label.fx-shell-action=互動式 fx 操作
label.fx-shell-detail=在獨立可見終端機中開啟已驗證的受管理 fx 或所選自訂 fx。登入與 API Key 輸入直接交由 fx 處理，Turboism 不讀取也不儲存。fx v0.0.5 自身沒有提供者/模型物件 API，因此自訂端點改用 Turboism 自有轉接器。
label.managed-runtime-detail=Turboism 會選擇離線安裝於 runtimes/fx/0.0.5 下的平台執行階段，並在啟動前驗證精確大小和 SHA-256。一般使用請將進階覆寫路徑留空。提供者驗證與持久設定仍由 fx 管理。
label.model-entry-detail=選擇 fx 模型，或輸入由 fx 管理的精確模型 ID。
label.provider-entry-detail=選擇 fx v0.0.5 傳回的提供者選項。
