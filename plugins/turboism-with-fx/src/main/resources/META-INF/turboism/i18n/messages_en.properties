label.config-owned-by-fx=Connect to fx to load its provider and model catalog.
label.config-applies-immediately=Provider and model changes apply immediately to the active fx session. Credentials and durable configuration remain fx-owned.
label.config-authentication-detail=Built-in profiles are fx-owned: authenticate through the fx-owned Codex, Vercel, or Grok flow, and Turboism only switches the active fx ACP provider and model. Custom OpenAI-compatible profiles are Turboism-owned: Turboism runs a local loopback adapter and points fx at it. fx v0.0.5 itself has no provider or model create/delete API.
label.config-updating=Applying the selection to the active fx session…
label.fx-shell-action=Interactive fx action
label.fx-shell-detail=Opens the verified managed or selected custom fx executable in a separate visible terminal. Login and API-key input go directly to fx; Turboism neither reads nor stores them. fx v0.0.5 has no provider/model object API of its own, so custom endpoints use a Turboism-owned adapter instead.
label.managed-runtime-detail=Turboism selects the offline platform runtime installed under runtimes/fx/0.0.5 and verifies its exact size and SHA-256 before launch. Leave the advanced override blank for normal use. Provider authentication and durable configuration remain fx-owned.
label.managed-repair-detail=Linux and macOS can download and verify a pinned fx v0.0.5 archive before atomic activation. Windows x64 is supplied offline by Turboism Full and can be restored only by product repair or reinstall. The current Windows candidate does not imply Unix feature parity.
label.model-entry-detail=Select an fx model or enter an exact fx-owned model ID.
label.provider-entry-detail=Select one of the provider choices returned by fx v0.0.5.
