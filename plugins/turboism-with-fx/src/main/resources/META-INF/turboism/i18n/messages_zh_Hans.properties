label.config-authentication-detail=内置配置由 fx 管理：请通过 fx 自有的 Codex、Vercel 或 Grok 登录流程完成认证，Turboism 只切换当前 fx ACP 的提供商与模型。自定义 OpenAI 兼容配置由 Turboism 管理：Turboism 会启动本地回环适配器并让 fx 指向它。fx v0.0.5 本身没有提供商或模型的创建/删除 API。
