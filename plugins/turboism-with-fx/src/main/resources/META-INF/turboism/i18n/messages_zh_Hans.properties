label.managed-runtime-detail=Turboism 会选择离线安装在 runtimes/fx/0.0.5 下的平台运行时，并在启动前验证精确大小和 SHA-256。正常使用请将高级覆盖路径留空。提供商认证和持久配置仍由 fx 管理。
