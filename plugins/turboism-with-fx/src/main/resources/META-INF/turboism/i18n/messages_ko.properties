label.managed-runtime-detail=Turboism은 runtimes/fx/0.0.5 아래에 오프라인 설치된 플랫폼 런타임을 선택하고 시작 전에 정확한 크기와 SHA-256을 검증합니다. 일반 사용 시 고급 재정의는 비워 두십시오. 공급자 인증과 영구 구성은 계속 fx가 소유합니다.
