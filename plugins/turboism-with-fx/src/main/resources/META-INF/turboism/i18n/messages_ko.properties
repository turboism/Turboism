label.config-applies-immediately=제공자와 모델 변경은 현재 fx 세션에 즉시 적용됩니다. 자격 증명과 영구 설정은 fx가 관리합니다.
label.config-authentication-detail=fx가 반환한 값을 선택하거나 fx가 관리하는 정확한 제공자/모델 ID를 입력할 수 있습니다. Turboism은 불투명 값을 현재 fx 세션에만 보내며 자격 증명을 저장하지 않습니다. 제공자 로그인과 카탈로그 관리는 Turboism 밖에서 fx가 담당합니다.
