# Localization catalog for the clip-mask viewer host-validation probe.
#
# The plugin metadata schema requires an i18n block, and the runtime rejects a plugin whose
# declared baseName has no catalog (PLUGIN_I18N_CATALOG_MISSING). The probe contributes a menu
# item and a panel section purely to exercise the registration lifecycle, so the only keys it
# needs are those labels.
probe.menu.label=Clip Mask Viewer Validation
probe.section.title=Clip Mask Viewer Validation
probe.action.label=Run Clip Mask Viewer Probe
