name: Build plugin template

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository != 'turboism/Turboism'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure SDK via setup script (non-interactive defaults)
        run: ./scripts/setup.sh --yes

      - name: Build plugin JAR
        run: ./gradlew --no-daemon build --console=plain
