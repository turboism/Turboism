name: Sync template from Turboism release

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel(s) to sync (all, stable, or beta)
        type: choice
        options: [all, stable, beta]
        default: all
        required: false
      tag:
        description: Optional explicit Turboism release tag (e.g. v0.67.0)
        type: string
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: sync-from-turboism
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'turboism/Turboism'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out template repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest stable and beta Turboism release tags
        id: resolve
        env:
          INPUT_CHANNEL: ${{ inputs.channel || 'all' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          channel_mode = os.environ.get("INPUT_CHANNEL", "all") or "all"
          explicit_tag = os.environ.get("INPUT_TAG", "").strip()

          def fetch_json(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "turboism-plugin-template-sync/1",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def resolve_channel(ch: str) -> str:
              try:
                  doc = fetch_json(f"https://api.turboism.dev/v1/releases/{ch}.json")
                  if isinstance(doc, dict) and doc.get("status") == "ready":
                      rel = doc.get("release") or {}
                      tag = str(rel.get("tag") or "")
                      if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", tag):
                          return tag
              except Exception:
                  pass
              try:
                  releases = fetch_json("https://api.github.com/repos/turboism/Turboism/releases?per_page=30")
                  if isinstance(releases, list):
                      for item in releases:
                          if not isinstance(item, dict) or item.get("draft") is True:
                              continue
                          tag = str(item.get("tag_name") or "")
                          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", tag):
                              continue
                          ver = tag[1:]
                          is_pre = bool(item.get("prerelease"))
                          if ch == "stable" and not is_pre and "-" not in ver:
                              return tag
                          if ch == "beta" and is_pre and "-0.nightly." not in ver:
                              return tag
              except Exception:
                  pass
              return ""

          stable_tag = ""
          beta_tag = ""
          if explicit_tag:
              if not explicit_tag.startswith("v"):
                  explicit_tag = "v" + explicit_tag
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", explicit_tag):
                  raise SystemExit(f"Invalid tag format: {explicit_tag}")
              if "-" in explicit_tag[1:]:
                  beta_tag = explicit_tag
              else:
                  stable_tag = explicit_tag
          else:
              if channel_mode in ("all", "stable"):
                  stable_tag = resolve_channel("stable")
              if channel_mode in ("all", "beta"):
                  beta_tag = resolve_channel("beta")

          if not stable_tag and not beta_tag:
              raise SystemExit("No published stable or beta Turboism release tag found.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"stable_tag={stable_tag}\n")
              out.write(f"beta_tag={beta_tag}\n")
          print(f"Resolved stable_tag={stable_tag or '<none>'} beta_tag={beta_tag or '<none>'}")
          PY

      - name: Fetch templates/plugin-template/ and sync tags
        env:
          STABLE_TAG: ${{ steps.resolve.outputs.stable_tag }}
          BETA_TAG: ${{ steps.resolve.outputs.beta_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          UPSTREAM_DIR="$(mktemp -d)"
          trap 'rm -rf "$UPSTREAM_DIR"' EXIT
          git init -q "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" remote add origin https://github.com/turboism/Turboism.git

          sync_release_tag() {
            local upstream_tag="$1"
            local target_branch="$2"
            local version="${upstream_tag#v}"
            local sdk_tag="sdk-${version}"

            echo "Fetching turboism/Turboism at ${upstream_tag}..."
            git -C "$UPSTREAM_DIR" fetch --depth=1 origin "refs/tags/${upstream_tag}"
            git -C "$UPSTREAM_DIR" checkout -q FETCH_HEAD

            if [[ ! -d "$UPSTREAM_DIR/templates/plugin-template" ]]; then
              echo "templates/plugin-template/ is not present in ${upstream_tag}; skipping."
              return 0
            fi
            # Releases cut before the standalone template existed carry an older scaffold
            # without setup scripts or this workflow; syncing them would regress the repo.
            if [[ ! -f "$UPSTREAM_DIR/templates/plugin-template/scripts/setup.sh" || \
                  ! -f "$UPSTREAM_DIR/templates/plugin-template/.github/workflows/sync-from-turboism.yml" ]]; then
              echo "${upstream_tag} predates the standalone template scaffold; skipping."
              return 0
            fi

            if git show-ref --verify --quiet "refs/remotes/origin/${target_branch}"; then
              git checkout -B "$target_branch" "refs/remotes/origin/${target_branch}"
            elif git show-ref --verify --quiet "refs/heads/${target_branch}"; then
              git checkout "$target_branch"
            else
              git checkout -B "$target_branch"
            fi

            # Never move a branch back to an older Turboism release.
            local current=""
            if [[ -f gradle.properties ]]; then
              current="$(sed -n 's/^turboismSdkVersion=//p' gradle.properties | head -n 1)"
            fi
            if [[ -n "$current" && "$current" != *-SNAPSHOT ]] && python3 - "$current" "$version" <<'PY'
          import re, sys
          def key(v):
              core, _, pre = v.partition("-")
              nums = tuple(int(x) for x in core.split("."))
              parts = tuple((0, int(p), "") if p.isdigit() else (1, 0, p) for p in pre.split(".")) if pre else ()
              return nums, (0,) if pre else (1,), parts
          sys.exit(0 if key(sys.argv[1]) > key(sys.argv[2]) else 1)
          PY
            then
              echo "${target_branch} already tracks newer Turboism ${current}; not syncing ${upstream_tag}."
              return 0
            fi
            # Replace repository contents while preserving .git
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            cp -a "$UPSTREAM_DIR/templates/plugin-template/." .

            if [[ -f gradle.properties ]]; then
              sed -i "s/^turboismSdkVersion=.*/turboismSdkVersion=${version}/" gradle.properties
            fi

            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(sync): sync template from turboism/Turboism ${upstream_tag}"
            fi

            if ! git show-ref --verify --quiet "refs/tags/${sdk_tag}"; then
              git tag -a "$sdk_tag" -m "Turboism Plugin Template for SDK ${version} (${upstream_tag})"
            fi

            git push origin "HEAD:refs/heads/${target_branch}"
            git push origin "refs/tags/${sdk_tag}"
          }

          if [[ -n "$BETA_TAG" ]]; then
            # If no stable tag is resolved, sync beta to main as well so the default branch is populated.
            if [[ -z "$STABLE_TAG" ]]; then
              sync_release_tag "$BETA_TAG" "main"
            else
              sync_release_tag "$BETA_TAG" "beta"
            fi
          fi

          if [[ -n "$STABLE_TAG" ]]; then
            sync_release_tag "$STABLE_TAG" "main"
          fi
