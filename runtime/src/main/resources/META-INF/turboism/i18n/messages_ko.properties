settings.performance.preset.tooltip=검증된 최적화 프로필을 한 번에 적용합니다:\n- 끔: 43개 성능 최적화를 모두 끕니다.\n- 균형(권장): 편집, GPU 렌더링, 에셋 전반의 안전한 무지연 최적화 32개를 켜고 실험적 항목은 꺼 둡니다.\n- 고부하 편집: 1프레임 지연 비동기 캔버스 읽기 등 '레거시 및 실험적 옵션'의 트레이드오프 항목까지 43개 모두 켭니다.\n- 사용자 지정: 아래 체크박스가 기본 프리셋과 다를 때 자동으로 표시됩니다.
settings.performance.recommendation.tooltip=일상적인 모델링과 애니메이션 작업에는 '균형' 프리셋을 권장합니다. 지연이나 화면 이상 없이 검증된 32개 최적화가 적용됩니다.\n증분 업데이트나 비동기 캔버스 읽기 같은 트레이드오프를 테스트할 때만 하단의 '레거시 및 실험적 옵션'을 펼쳐 주세요.
settings.performance.section.editing=편집 및 변형 가속
