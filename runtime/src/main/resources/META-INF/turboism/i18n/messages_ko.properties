settings.optimization.cursor-validation-elision=레이아웃 검증 및 범위 밖 히트 테스트 시 중복 AWT 커서 갱신 생략
settings.optimization.parameter-row-repaint=변경된 파라미터 팔레트 행만 증분 업데이트
settings.optimization.sibling-elision.reference=Live2D 커뮤니티 #4556 ↗
settings.optimization.reference-open-failed=참조 페이지를 열 수 없습니다. 다음 URL을 직접 여세요: {0}
settings.mesh-triangulation.hash-degeneracy.tooltip=메시 삼각분할 중 느린 해시 조회를 수정해 고밀도 자동 메시 생성을 크게 가속합니다.
settings.mesh-triangulation.edge-index.tooltip=삼각분할 중 엣지를 인덱싱해 고밀도 자동 연결 속도를 높이고 메모리 부담을 줄입니다.
settings.atlas.tile-bbox.tooltip=아틀라스 투명 여백 검사를 각 메시의 실제 경계 안으로 제한해 생성 속도를 높입니다.
settings.atlas.cache-reuse.tooltip=새로고침 및 내보내기 시 변경되지 않은 아틀라스 페이지를 재사용해 불필요한 재합성을 생략합니다.
settings.optimization.model-update-skip.tooltip=화면 확대·이동만 일어난 프레임에서 전체 모델 CPU 재계산을 건너뜁니다.
settings.optimization.incremental-update.tooltip=단일 파라미터를 조작할 때 영향받지 않는 파츠 계산을 건너뜁니다. 기본 꺼짐 이유: 카메라 이동/확대 시 추적 오버헤드가 늘어나고 지원되지 않는 모델 구조가 있습니다.
settings.optimization.incremental-update-affecters.tooltip=글루 어펙터만 사용하는 모델에도 증분 업데이트를 적용합니다(ArtPath 모델은 기존 경로 사용). 기본 꺼짐 이유: 위의 증분 업데이트가 켜져 있어야 동작하며 체감 이득이 제한적입니다.
settings.optimization.uniform-location-cache.tooltip=한 프레임 동안 셰이더 Uniform 위치를 캐시합니다. 기본 꺼짐 이유: 기본 활성인 셰이더 단위 캐시로 대체되었으며, 켜면 메시 버퍼 업로드 건너뛰기와 충돌합니다.
settings.optimization.upload-elision.tooltip=변경되지 않은 메시 버퍼의 GPU 업로드를 생략하고 변형 시 바뀐 보조 선만 업로드합니다. 모델 업데이트 건너뛰기가 필요하며 프레임 Uniform 캐시가 켜지면 메시 비교는 중지됩니다.
settings.optimization.mesh-setup-elision.tooltip=모델 업데이트를 건너뛴 프레임에서 메시 버퍼 재설정을 생략해 확대/이동 시 CPU 부하를 줄입니다.
settings.optimization.input-path-elision.tooltip=마우스 이동 중 반복되는 포커스·커서 호출을 건너뜁니다. 기본 꺼짐 이유: 캔버스 드래그 반응성 최적화가 병목을 더 안전하게 해결하며, 창 포커스 전환에 영향을 줄 수 있습니다.
settings.optimization.mesa-gl-thread.tooltip=매 그리기 호출마다 수행하던 OpenGL 오류 검사를 프레임 끝으로 모아 렌더 스레드의 드라이버 대기를 줄입니다. Linux/Proton Mesa 환경에서는 스레드 GL 제출도 함께 활성화합니다.
settings.optimization.async-readback=파이프라인 캔버스 비동기 읽기 (화면 1프레임 지연)
settings.optimization.async-readback.tooltip=UI 스레드가 GPU의 프레임 완료를 기다리지 않아 초대형 모델의 변형 프레임률을 높입니다. 기본 꺼짐 이유: 캔버스 화면이 마우스 조작보다 1프레임 늦게 따라옵니다.
settings.optimization.mesh-interpolation.tooltip=확장 보간 곡선 가중치와 키폼 조회를 캐시해 프레임률을 높이고 메모리 할당을 줄입니다.
settings.optimization.shader-uniform.tooltip=셰이더별로 Uniform 위치를 캐시해 그리기마다 반복되는 드라이버 조회를 줄입니다.
settings.optimization.matrix-scratch.tooltip=변환 계층 순회 시 임시 행렬을 재사용해 렌더링과 선택 시 GC 부하를 낮춥니다.
settings.optimization.image-archive-reuse.tooltip=저장 시 수정되지 않은 이미지의 PNG 재압축을 건너뜁니다. 기본 꺼짐 이유: 원본 데이터 캐싱으로 메모리를 더 사용하며 일반 저장에서의 체감 차이가 작습니다.
settings.optimization.float-array-parse-cache.tooltip=모델 파일을 읽을 때 반복되는 숫자 배열 파싱 결과를 재사용합니다. 기본 꺼짐 이유: 모델 열기 가속에 비해 효과가 미미하고 캐시 메모리를 유지합니다.
settings.optimization.texture-upload-preparation.tooltip=번들 Java 17에서 모델 로딩 시 텍스처 픽셀 변환을 가속합니다. 기본 꺼짐 이유: 로딩 단축 폭이 약 3–8%로 작고 기본 GraalVM에서는 적용되지 않습니다.
settings.optimization.warp-position-projection.tooltip=확장 보간 중 임시 좌표 래퍼 객체 생성을 줄입니다. 기본 꺼짐 이유: 이득이 매우 작고 기본 활성인 워프 디포머 가속으로 대부분 대체되었습니다.
settings.optimization.reinit-pair-elision.tooltip=모델이 재초기화될 때 임시 페어 객체 할당을 줄입니다. 기본 꺼짐 이유: 재초기화 빈도가 낮아 체감 성능 차이가 거의 없습니다.
settings.optimization.clip-mask-deduplication.tooltip=같은 프레임에서 동일한 클리핑 마스크를 쓰는 파츠들이 이미 그린 마스크 텍스처를 재사용합니다.
settings.optimization.clip-mask-scissor-clear.tooltip=클리핑 마스크 지우기 범위를 마스크 영역으로 제한해 전체 화면 클리어 부하를 줄입니다.
settings.optimization.extended-interpolation-incremental-setup.tooltip=모델 구조 편집 시 바뀌지 않은 오브젝트의 확장 보간 재구축을 건너뛰어 정렬·실행 취소 시 멈춤을 줄입니다.
settings.optimization.model-instance-coalesce.tooltip=같은 편집 주기 내 중복된 모델 갱신 호출을 병합해 연속 편집 시 수초간 멈추는 현상을 막습니다.
settings.optimization.inspector-property-bypass.tooltip=인스펙터에서 합성 모드를 바꿀 때 전체 모델 재구축 없이 셰이더만 갱신합니다. 기본 꺼짐 이유: Cubism 5.3+ 전용이며 적용 범위가 좁습니다.
settings.optimization.extended-interpolation-sibling-elision.tooltip=확장 보간의 느린 형제 탐색과 강제 재구축(#4556 수정)을 생략하며 결과는 동일하게 유지합니다.
settings.optimization.warp-grid-interpolation.tooltip=범위 내 워프 그리드 보간을 가속해 동일한 변형 결과로 CPU 부하를 낮춥니다.
settings.optimization.warp-normal-point-elision.tooltip=비활성화된 부모 외부 워프 제어점의 불필요한 계산과 업로드를 건너뜁니다.
settings.optimization.camera-matrix-cache.tooltip=카메라가 바뀌지 않는 동안 카메라 변환 행렬을 캐시해 프레임당 부하를 줄입니다.
settings.optimization.render-pass-traversal.tooltip=렌더 패스 순회와 렌더러 조회를 간소화하고 디버그 문자열 생성을 제거합니다.
settings.optimization.mesh-hit-test.tooltip=마우스 선택 시 임시 객체 할당 없이 메시 경계를 바로 계산합니다.
settings.optimization.scene-handler-cache.tooltip=캔버스 마우스 핸들러 목록을 캐시하고 구조 변경 시에만 갱신합니다.
settings.optimization.cursor-validation-elision.tooltip=레이아웃 확인과 범위 밖 포인터 조회 시 불필요한 커서 갱신을 건너뜁니다.
settings.optimization.parameter-row-repaint.tooltip=값이 실제로 변경된 파라미터 팔레트 행만 다시 그립니다.
settings.cubism-jvm.disable-auto-backup.tooltip=주기적 자동 백업을 꺼서 대형 모델 편집 중 디스크 저장으로 멈추는 현상을 없앱니다. 켜져 있는 동안 자동 복구 백업이 중단됩니다.
settings.cubism-jvm.zgc.tooltip=실행 시 저지연 Z 가비지 컬렉터를 사용해 무거운 모델 편집 중 메모리 정리로 인한 끊김과 프레임 드롭을 줄입니다.
settings.cubism-jvm.tooltip=Cubism 실행용 Java 런타임을 선택합니다. GraalVM은 더 높은 처리량과 프레임률을 제공하며 번들 Java는 공식 런타임을 유지합니다.
settings.cubism-jvm.memory-profile.tooltip=최대 힙 메모리를 제한하거나 유휴 이미지 캐시를 더 빨리 해제해 RAM 사용량을 낮춥니다.
