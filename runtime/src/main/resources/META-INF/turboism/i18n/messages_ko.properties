guide.page.about.title=Turboism 소개
guide.page.about.intro=Turboism은 Live2D Cubism Editor용 런타임 확장 도구이자 플러그인 프레임워크입니다. Cubism 본체는 바꾸지 않으며 모든 기능은 플러그인으로 제공됩니다.
guide.page.about.capabilities=모델링 지원은 파라미터, 메시, PSD 연동, 패널 확장, 로컬 자동화를 포함합니다.
guide.page.about.dependencies=사용 가능한 기능은 설치된 플러그인, 권한, Editor의 정확한 버전에 따라 달라집니다.
guide.page.about.update=업데이트는 Turboism 메뉴 또는 다운로드 페이지에서 진행합니다. 먼저 Cubism을 종료하고 프로젝트를 백업하세요.
guide.page.plugins.title=플러그인과 마켓
guide.page.plugins.intro=플러그인은 Turboism의 기능 단위입니다. 필요한 것만 설치하고 언제든지 켜거나 끌 수 있습니다.
guide.page.plugins.install=공식 플러그인은 플러그인 마켓에서 설치하거나 플러그인 관리에서 로컬 플러그인 파일을 선택합니다.
guide.page.plugins.manage=플러그인 관리에서 활성화, 비활성화, 제거를 수행합니다. 플러그인 설정에는 각 플러그인의 옵션이 있습니다.
guide.page.plugins.market=공식 마켓은 서명된 패키지를 제공하므로 카탈로그 업데이트도 릴리스마다 도착합니다.
guide.page.support.title=도움이 필요하신가요
guide.page.support.intro=공식 채널이 관리자에게 가장 빠르게 전달됩니다.
guide.page.support.logs=신고 전에 Turboism 로그를 열고 Editor 버전과 함께 첨부하세요.
guide.page.support.issues=재현 가능한 문제와 제안은 GitHub Issues에 남겨 주세요.
guide.page.support.security=보안 문제는 contact@turboism.dev로 비공개로 알려 주세요.
