settings.atlas.tile-bbox.tooltip=텍스처 아틀라스 각 타일 이미지의 알파 경계 처리를 메시의 최소 바운딩 박스 내로 한정하여 투명 픽셀 스캔과 임시 버퍼 할당을 생략함으로써 생성 속도와 메모리를 최적화합니다.
settings.atlas.cache-reuse.tooltip=아틀라스 페이지 크기, 항목 변환 행렬 및 원본 픽셀의 내용 서명을 계산하여 변경되지 않은 아틀라스 페이지를 재사용하고 중복 페이지 재합성과 메모리 사용을 줄입니다.
settings.optimization.model-update-skip.tooltip=다시 그리기 전에 모델 파라미터, 선택 영역, 편집 상태를 비교하여 줌/팬 등 모델이 변경되지 않은 프레임에서 불필요한 CPU 모델 업데이트 계산을 생략해 프레임 레이트를 높입니다.
settings.optimization.incremental-update.tooltip=디포머 및 아트메시별 파라미터 변화와 부모-자식 더티 전파를 추적하여 영향받지 않는 파츠의 보간과 변형 계산을 생략함으로써 복잡한 모델의 프레임 레이트를 향상시킵니다.
settings.optimization.uniform-location-cache.tooltip=단일 렌더 프레임 내에서 검증된 OpenGL 셰이더 Uniform 위치를 캐시하여 드로우마다 반복되는 glGetUniformLocation 조회와 임시 할당을 생략함으로써 프레임 레이트와 메모리를 최적화합니다.
settings.optimization.upload-elision.tooltip=모델 업데이트가 생략된 프레임에서 정점 및 인덱스 버퍼 내용이 변경되지 않은 경우 중복된 glBufferData / glBufferSubData GPU 업로드를 생략하여 렌더링 부하를 줄입니다.
settings.optimization.input-path-elision.tooltip=포커스와 커서가 변경되지 않은 경우 마우스 이벤트마다 발생하는 중복 requestFocus 및 setCursor 호출을 단락시켜 네이티브 윈도우 시스템 조회를 생략하고 입력 지연을 줄입니다.
settings.optimization.mesa-gl-thread.tooltip=Linux/Proton (Mesa) 환경에서 스레드 기반 GL 제출을 활성화하고 드로우마다 실행되는 동기식 glGetError 검사를 프레임 끝으로 지연시켜 스레드 플러시를 방지합니다(네이티브 Windows에서는 무시됨).
settings.optimization.mesh-interpolation.tooltip=타원 및 SNS 확장 보간의 곡선 가중치를 캐시하고 키폼 GUID 인덱싱과 로컬 배열 갱신을 수행하여 반복적인 삼각함수 계산과 리스트 할당을 줄이고 프레임 레이트를 높입니다.
settings.optimization.shader-uniform.tooltip=GShader 인스턴스 및 GL 프로그램 핸들별로 Uniform 위치를 캐시하여 프리드로우 단계에서 반복되는 glGetUniformLocation 드라이버 조회를 줄입니다.
settings.optimization.matrix-scratch.tooltip=GTransform.getLocalToWorldMatrix() 부모 계층 순회 내에서 2개의 로컬 4×4 임시 행렬을 교대로 재사용하여 계층마다 발생하는 중간 행렬 객체 할당과 GC 부하를 줄입니다.
settings.optimization.image-archive-reuse.tooltip=모델 저장 시 픽셀이 변경되지 않은 이미지 리소스의 원본 PNG 바이트 스트림을 재사용하여 비용이 큰 PNG 재인코딩과 임시 메모리 할당을 생략하고 저장 속도를 높입니다.
settings.optimization.float-array-parse-cache.tooltip=모델 역직렬화 중 반복되는 부동소수점 배열 구문 분석 결과를 캐시하고 방어적 복사본을 반환하여 중복 문자열 파싱과 임시 할당을 줄이고 로드 속도를 높입니다.
settings.optimization.texture-upload-preparation.tooltip=사전 계산된 65,536개 항목의 sRGB 룩업 테이블을 통해 ARGB/ABGR 이미지를 프리멀티플라이드 RGBA8 버퍼로 일괄 변환하여 텍스처 업로드 전처리를 가속합니다(내장 Java 17 전용).
settings.optimization.warp-position-projection.tooltip=워프 디포머 확장 보간 시 기본 float 배열에서 직접 읽기 전용 GVector2 좌표 리스트를 투영하여 임시 WarpPointRef 래퍼 할당을 생략하고 메모리 할당을 줄입니다(내장 Java 17 전용).
settings.cubism-jvm.disable-auto-backup.tooltip=세션 중 에디터의 주기적 자동 백업 타이머를 비활성화하여 대형 모델 편집 도중 발생하는 주기적 프로젝트 직렬화 및 디스크 쓰기 끊김 현상을 제거합니다.
settings.cubism-jvm.zgc.tooltip=실행 시 동시 저지연 가비지 컬렉터(-XX:+UseZGC)를 활성화하여 GC 일시 정지 시간을 밀리초 미만으로 유지하고 고부하 편집 중 프레임 드롭을 줄입니다.
settings.cubism-jvm.tooltip=Cubism을 실행할 JVM을 선택합니다. GraalVM은 고급 JIT 최적화를 통해 처리량과 프레임 레이트를 높이며, 번들 Java는 공식 기본 런타임을 유지합니다.
settings.cubism-jvm.memory-profile.tooltip=최대 힙 크기를 제한하거나 SoftReference LRU 유지 시간을 단축하여 유휴 이미지 캐시를 신속히 회수하고 상주 물리 메모리 사용량을 줄입니다.
