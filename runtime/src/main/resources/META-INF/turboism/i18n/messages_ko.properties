settings.optimization.atlas-loading=텍스처 아틀라스 로딩 가속
settings.optimization.atlas-loading.tooltip=병렬 메시 삼각분할, 병렬 미리보기 축소 및 O(N) UI 목록 인덱싱으로 텍스처 아틀라스 편집기 열기와 이미지 목록 갱신을 가속합니다. Cubism을 다시 시작하면 적용됩니다.
settings.optimization.triangulation-spatial-index=메시 삼각분할 공간 인덱싱
settings.optimization.triangulation-spatial-index.tooltip=출력 삼각형을 변경하지 않고 스레드 안전한 2D 공간 그리드와 정밀 엣지 조회 테이블로 제약 엣지 교차, 점 위치 탐색 및 공선 엣지 검사를 가속합니다. Cubism을 다시 시작하면 적용됩니다.
settings.optimization.model-open-acceleration=모델 파일(.cmo3) 열기 가속
settings.optimization.model-open-acceleration.tooltip=메시 정점·인덱스 버퍼 사전 할당, 일괄 다각형 삼각분할, 병렬 텍스처 디코딩 및 논블로킹 디스크 썸네일 캐시로 모델 열기를 가속하며, 텍스처 업로드 전처리와 함께 동작합니다. Cubism을 다시 시작하면 적용됩니다.
settings.optimization.runtime-export-acceleration=런타임 모델(.moc3) 내보내기 가속
settings.optimization.runtime-export-acceleration.tooltip=평면 O(1) 정점 해시 조회 테이블로 내보내기 시 O(N²) 스캔을 제거하고 출력 데이터를 변경하지 않고 MOC3 부동소수점 버퍼 일괄 쓰기를 가속합니다. Cubism을 다시 시작하면 적용됩니다.
settings.optimization.warp-deform-edit-acceleration=워프 디포머 및 브러시 편집 가속
settings.optimization.warp-deform-edit-acceleration.tooltip=편집 모드의 워프 디포머 역변환, 베지어 그리드 계산, 변형 브러시 루프 및 오버레이 업로드를 시각적 결과나 형상 변경 없이 가속합니다. Cubism을 다시 시작하면 적용됩니다.
settings.optimization.atlas-interactive-render=텍스처 아틀라스 캔버스 상호작용 가속
settings.optimization.atlas-interactive-render.tooltip=오버레이 스프라이트 캐싱, 뷰포트 클리핑, 드래그 UI 동기화 병합 및 불필요한 재그리기 생략으로 최종 아틀라스 베이크를 변경하지 않고 확대/축소·이동·드래그 성능을 향상시킵니다. Cubism을 다시 시작하면 적용됩니다.
settings.optimization.mesh-edit-acceleration=대화형 메시 편집 가속
settings.optimization.mesh-edit-acceleration.tooltip=삼각형 내부 점 탐색, 메시 오버레이 갱신, 소프트 선택 색상 계산 및 비-델로네 자동 연결 토폴로지 검사를 지오메트리 변경 없이 가속합니다. Cubism을 다시 시작하면 적용됩니다.
settings.optimization.memory-leak-mitigation=Cubism 메모리 및 OpenGL 리소스 누수 완화
settings.optimization.memory-leak-mitigation.tooltip=파츠 팔레트 키 리스너 누수 및 불필요한 트리 재구축을 방지하고, 해제된 OpenGL VBO/텍스처를 정리하며, 실행 취소 기록 상한을 적용하고, 닫힌 문서 및 인스펙터 참조를 정리합니다. Cubism을 다시 시작하면 적용됩니다.
