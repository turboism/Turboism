settings.optimization.atlas-loading=텍스처 아틀라스 로딩 가속
settings.optimization.atlas-loading.tooltip=병렬 처리를 통해 텍스처 아틀라스 편집기 열기와 목록 갱신을 가속합니다.
settings.optimization.triangulation-spatial-index=메시 삼각분할 공간 인덱싱
settings.optimization.triangulation-spatial-index.tooltip=공간 그리드를 사용해 출력 삼각형을 바꾸지 않고 고밀도 삼각분할을 가속합니다.
settings.optimization.model-open-acceleration=모델 파일(.cmo3) 열기 가속
settings.optimization.model-open-acceleration.tooltip=병렬 텍스처 디코딩, 빠른 삼각분할, 썸네일 캐싱으로 .cmo3 모델 열기를 가속합니다.
settings.optimization.runtime-export-acceleration=런타임 모델(.moc3) 내보내기 가속
settings.optimization.runtime-export-acceleration.tooltip=빠른 정점 조회와 버퍼 쓰기로 출력 데이터 변경 없이 .moc3 모델 내보내기를 가속합니다.
settings.optimization.warp-deform-edit-acceleration=워프 디포머 및 브러시 편집 가속
settings.optimization.warp-deform-edit-acceleration.tooltip=워프 디포머 드래그, 브러시 변형, 오버레이 갱신을 지오메트리 변경 없이 가속합니다.
settings.optimization.atlas-interactive-render=텍스처 아틀라스 캔버스 상호작용 가속
settings.optimization.atlas-interactive-render.tooltip=최종 아틀라스 출력을 바꾸지 않고 아틀라스 편집기의 확대·이동·드래그를 부드럽게 합니다.
settings.optimization.mesh-edit-acceleration=대화형 메시 편집 가속
settings.optimization.mesh-edit-acceleration.tooltip=지오메트리를 변경하지 않고 메시 편집, 소프트 선택, 자동 연결을 가속합니다.
settings.optimization.memory-leak-mitigation=메모리 및 GPU 리소스 누수 완화
settings.optimization.memory-leak-mitigation.tooltip=모델을 닫거나 화면을 전환할 때 사용하지 않는 OpenGL 버퍼와 텍스처를 해제하고 실행 취소 기록과 잔류 리스너를 정리해 장시간 작업 시 메모리 증가를 막습니다.
settings.optimization.bundle.editing-model-update=변경 없는 모델 업데이트 건너뛰기 및 중복 갱신 병합
settings.optimization.bundle.editing-model-update.tooltip=확대·이동처럼 모델이 바뀌지 않은 프레임의 재계산을 건너뛰고 한 번의 편집에서 겹치는 연속 갱신을 하나로 묶습니다. 캔버스 프레임률을 높이고 일괄 편집 시 멈춤을 줄입니다.
settings.optimization.bundle.editing-warp-interpolation=워프 디포머 및 확장 보간 가속 (#4556 멈춤 수정 포함)
settings.optimization.bundle.editing-warp-interpolation.tooltip=워프 그리드 계산, 변형 브러시 드래그, 확장 보간을 가속하고 같은 계층의 형제 오브젝트가 많을 때 발생하는 수초간 멈춤(#4556)을 해결합니다. 변형 결과는 동일합니다.
settings.optimization.bundle.editing-canvas-input=캔버스 드래그·선택 및 파라미터 패널 반응성 향상
settings.optimization.bundle.editing-canvas-input.tooltip=포인터 선택과 캔버스 마우스 응답을 빠르게 하고, 불필요한 커서 갱신을 건너뛰며, 변경된 파라미터 행만 다시 그립니다. 드래그와 슬라이더 조작이 훨씬 부드러워집니다.
settings.optimization.bundle.rendering-pipeline-cache=렌더 패스, 셰이더 및 카메라 변환 상태 캐시
settings.optimization.bundle.rendering-pipeline-cache.tooltip=카메라와 변환 행렬을 재사용하고 셰이더 매개변수 조회를 캐시하며 렌더 순회를 최적화합니다. 재생 및 화면 이동 시 CPU 부하와 GC 끊김을 줄입니다.
settings.optimization.bundle.rendering-upload-elision=변경 없는 GPU 버퍼 업로드 건너뛰기
settings.optimization.bundle.rendering-upload-elision.tooltip=모델이 바뀌지 않았을 때 GPU로 메시 버퍼를 다시 보내지 않으며, 변형 중에도 변경된 보조 선만 업로드합니다. 변경 없는 모델 업데이트 건너뛰기와 함께 동작합니다.
settings.optimization.bundle.rendering-clip-mask=클리핑 마스크 중복 제거 및 영역 제한 클리어
settings.optimization.bundle.rendering-clip-mask.tooltip=여러 파츠가 동일한 클리핑 마스크를 공유할 때 한 번 그린 마스크를 재사용하고 전체 화면 대신 마스크 영역만 지웁니다. 화질 저하 없이 무거운 모델의 GPU 부하를 크게 줄입니다.
settings.optimization.bundle.assets-atlas=텍스처 아틀라스 로딩·생성 및 캔버스 조작 가속
settings.optimization.bundle.assets-atlas.tooltip=텍스처 아틀라스 편집기 열기, 확대/이동/타일 드래그, 패킹 속도를 높이고 투명 영역 스캔과 변경 없는 페이지 재합성을 건너뜁니다. 최종 결과 이미지는 동일합니다.
settings.optimization.bundle.assets-mesh=메시 편집 및 자동 삼각분할 가속
settings.optimization.bundle.assets-mesh.tooltip=고밀도 메시의 자동 삼각분할, 자동 연결, 소프트 선택 및 정점 편집 속도를 높이며 메시 구조와 결과는 그대로 유지합니다.
settings.optimization.bundle.assets-model-io=모델 열기(.cmo3) 및 런타임 내보내기(.moc3) 가속
settings.optimization.bundle.assets-model-io.tooltip=병렬 텍스처 디코딩, 썸네일 캐싱, 빠른 정점 패킹으로 프로젝트 파일 열기와 런타임 모델 내보내기를 빠르게 하며 출력 데이터는 동일합니다.
