settings.mesh-triangulation.hash-degeneracy.tooltip=【선택 사항: 에셋 로드】메시 삼각분할 면 클래스의 상수 0 해시를 3정점 대칭 해시로 대체하여 해시 테이블이 선형 스캔으로 퇴화하는 것을 방지하고 메시 생성 시 CPU 부하를 줄입니다.
settings.mesh-triangulation.edge-index.tooltip=【선택 사항: 에셋 로드】삼각분할 중 엣지 집합에 컴팩트 인덱스를 구축하고 임시 엣지 객체 할당을 지연시켜 반복적인 선형 엣지 탐색과 메모리 할당을 줄입니다.
settings.atlas.tile-bbox.tooltip=【선택 사항: 에셋 로드】텍스처 아틀라스 각 타일 이미지의 알파 경계 처리를 메시의 최소 바운딩 박스 내로 한정하여 투명 픽셀 스캔과 임시 버퍼 할당을 생략함으로써 생성 속도와 메모리를 최적화합니다.
settings.atlas.cache-reuse.tooltip=【선택 사항: 에셋 로드】아틀라스 페이지 크기, 항목 변환 행렬 및 원본 픽셀의 내용 서명을 계산하여 변경되지 않은 아틀라스 페이지를 재사용하고 중복 페이지 재합성과 메모리 사용을 줄입니다.
settings.optimization.model-update-skip.tooltip=【권장】다시 그리기 전에 모델 파라미터, 선택 영역, 편집 상태를 비교하여 줌/팬 등 모델이 변경되지 않은 프레임에서 불필요한 CPU 모델 업데이트 계산을 생략해 프레임 레이트를 높입니다.
settings.optimization.incremental-update.tooltip=【선택 사항: 대상 모델만】디포머 및 아트메시별 파라미터 변화와 부모-자식 더티 전파를 추적하여 영향받지 않는 파츠의 보간과 변형 계산을 생략함으로써 복잡한 모델의 프레임 레이트를 향상시킵니다.
settings.optimization.incremental-update-affecters.tooltip=【선택 사항: 글루 전용】어펙터가 글루뿐인 모델도 증분 업데이트 재사용 대상에 포함합니다. 글루 정점은 매 업데이트마다 현재 변형 폼에서 다시 계산됩니다. ArtPath 또는 다른 어펙터 유형이 있는 모델은 계속 네이티브 경로를 사용합니다.
settings.optimization.uniform-location-cache.tooltip=【권장: 업로드 생략 및 프레임 끝 지연 GL 검사와 함께 사용】단일 렌더 프레임 내에서 검증된 OpenGL 셰이더 Uniform 위치를 캐시하여 드로우마다 반복되는 glGetUniformLocation 조회와 임시 할당을 생략합니다. 프레임 끝 지연 GL 검사는 이 캐시에 의존합니다. 업로드 생략을 함께 켜면 메시 내용 비교는 비활성화되지만 라인 오버레이 분할은 계속 유효합니다.
settings.optimization.upload-elision.tooltip=[모델 업데이트 건너뛰기와 함께 사용 권장; Uniform Location Cache 활성화 시 메시 비교만 중지] 모델 업데이트가 건너뛰어진 프레임에서 메시 정점/인덱스 내용을 비교해 변경되지 않은 glBufferData/glBufferSubData 업로드를 생략합니다. 또한 라인 오버레이 색상/인덱스는 내용이 실제로 바뀔 때만 더티로 표시하므로 변형 시 실제로 변경된 배열만 업로드합니다. 이 부분은 Uniform Location Cache가 켜져 있어도 동작합니다.
settings.optimization.mesh-setup-elision.tooltip=【권장: 모델 업데이트 건너뛰기와 함께 사용】모델 업데이트가 생략되고 9개의 영구 버퍼가 모두 최신 상태일 때 GMesh2.setup의 위치·법선·UV·색상·알파·인덱스 재설정을 건너뛰어 카메라 확대/이동 중 메시별 CPU 설정 부하를 줄입니다.
settings.optimization.input-path-elision.tooltip=【권장】포커스와 커서가 변경되지 않은 경우 마우스 이벤트마다 발생하는 중복 requestFocus 및 setCursor 호출을 단락시켜 네이티브 윈도우 시스템 조회를 생략하고 입력 지연을 줄입니다.
settings.optimization.mesa-gl-thread.tooltip=【Mesa: Linux/Proton】드라이버의 스레드 기반 GL 제출을 활성화합니다. 모든 플랫폼에서 드로우마다 수행되던 동기 glGetError 검사를 프레임 끝으로 모아 렌더 스레드가 매 드로우마다 동기 쿼리를 기다리지 않게 합니다. 네이티브 Windows에서는 Mesa 스레드화가 적용되지 않지만 프레임 끝 지연 검사는 설치됩니다.
settings.optimization.async-readback=캔버스 읽기 파이프라인 활성화(캔버스가 1프레임 지연)
settings.optimization.async-readback.tooltip=캔버스 읽기를 픽셀 팩 버퍼 기반 파이프라인으로 바꿔 EDT가 방금 제출한 프레임의 GPU 완료를 기다리지 않게 합니다. 픽셀은 동일하지만 캔버스에는 이전 프레임이 그려져 UI보다 1프레임 늦습니다. 무거운 모델에서 변형 프레임률이 약 15–20% 향상됨을 실측했습니다. 검토된 JOGL 2.4.0이 필요하며 다음 실행부터 적용됩니다.
settings.optimization.mesh-interpolation.tooltip=【선택 사항】타원 및 SNS 확장 보간의 곡선 가중치를 캐시하고 키폼 GUID 인덱싱과 로컬 배열 갱신을 수행하여 반복적인 삼각함수 계산과 리스트 할당을 줄이고 프레임 레이트를 높입니다.
settings.optimization.shader-uniform.tooltip=【권장: Uniform 위치 캐시와 함께 사용】GShader 인스턴스 및 GL 프로그램 핸들별로 Uniform 위치를 캐시하여 프리드로우 단계에서 반복되는 glGetUniformLocation 드라이버 조회를 줄입니다.
settings.optimization.matrix-scratch.tooltip=【권장: Uniform 위치 캐시와 함께 사용】GTransform.getLocalToWorldMatrix() 부모 계층 순회 내에서 2개의 로컬 4×4 임시 행렬을 교대로 재사용하여 계층마다 발생하는 중간 행렬 객체 할당과 GC 부하를 줄입니다.
settings.optimization.image-archive-reuse.tooltip=【선택 사항: 에셋 로드】모델 저장 시 픽셀이 변경되지 않은 이미지 리소스의 원본 PNG 바이트 스트림을 재사용하여 비용이 큰 PNG 재인코딩과 임시 메모리 할당을 생략하고 저장 속도를 높입니다.
settings.optimization.float-array-parse-cache.tooltip=【선택 사항: 에셋 로드】모델 역직렬화 중 반복되는 부동소수점 배열 구문 분석 결과를 캐시하고 방어적 복사본을 반환하여 중복 문자열 파싱과 임시 할당을 줄이고 로드 속도를 높입니다.
settings.optimization.texture-upload-preparation.tooltip=【선택 사항: 대규모 모델】사전 계산된 65,536개 sRGB 룩업 테이블로 표준 래스터를 직접 읽어 ARGB/ABGR 이미지를 프리멀티플라이드 RGBA8로 일괄 변환합니다. 최대 8192×8192(출력 버퍼 256 MiB, 내장 Java 17 전용)를 지원합니다. 실기 검증에서 대규모 모델의 11/11 텍스처 전처리가 바이트 단위로 일치했고, 5.1.03/5.2.03/5.3.04에서 로딩 중앙값이 3.1–7.7% 단축되고 관측 할당이 13.7–32.5% 감소했으나, 그룹당 2~3개 표본의 스크리닝 결과이며 보장이 아닙니다. 픽셀은 변경되지 않습니다. 다음 실행 시 적용됩니다.
settings.optimization.warp-position-projection.tooltip=【실험적】워프 디포머 확장 보간 시 기본 float 배열에서 직접 읽기 전용 GVector2 좌표 리스트를 투영하여 임시 WarpPointRef 래퍼 할당을 생략하고 메모리 할당을 줄입니다(내장 Java 17 전용).
settings.optimization.reinit-pair-elision.tooltip=CModel.reinitModelInstance_exe를 다시 작성하여 각 재사용 맵에 GUID와 객체를 직접 기록함으로써 재초기화할 때마다 모델 객체당 하나의 Kotlin Pair 할당을 제거합니다。
settings.optimization.clip-mask-deduplication.tooltip=동일 프레임 내에서 여러 드로어블이 동일한 클리핑 마스크 세트를 공유하는 경우, 렌더링된 오프스크린 FBO 텍스처를 재사용하여 화질 저하 없이 중복 클리어 및 메시 렌더링 패스를 생략합니다。
settings.optimization.clip-mask-scissor-clear.tooltip=클리핑 마스크 렌더링 시 glScissor를 사용하여 클리어 범위를 마스크 실루엣의 화면 바운딩 박스로 제한함으로써 전체 캔버스 FBO 클리어에 따른 GPU 픽셀 채우기 및 대역폭 낭비를 대폭 줄입니다。
settings.optimization.extended-interpolation-incremental-setup.tooltip=키폼이나 바인딩이 변경되지 않은 미변경 객체에 대해 CModelSource.setup()의 전체 모델 확장 보간 메시 재구축을 건너뛰어, 대규모 모델에서 설정 지연을 최대 80% 줄입니다。
settings.optimization.model-instance-coalesce.tooltip=동일한 편집 트랜잭션 또는 이벤트 주기 내에서 중복되는 updateModelInstances 호출을 통합하여, 캔버스 재렌더링 전 최신 상태를 보장하면서 연속적인 지연 현상을 방지합니다。
settings.optimization.inspector-property-bypass.tooltip=인스펙터에서 알파 합성 등의 시각적 속성을 변경할 때 전체 updateModelInstances 재구축을 건너뛰고 대상 셰이더만 직접 업데이트합니다. Cubism 5.3.x에서만 적용됩니다.
settings.optimization.extended-interpolation-sibling-elision.tooltip=【권장】Live2D 커뮤니티 #4556의 수초간 멈춤 현상을 수정합니다. 동일 Part 폴더 또는 루트 내 형제 요소에 대한 O(N*M) 선형 탐색과 미변경 형제 요소의 강제 updateInterpolatedForms(true) 재구축을 O(1) 조회 및 더티 검사 기반 업데이트로 대체합니다.
settings.optimization.warp-grid-interpolation.tooltip=【권장】그리드 경계 내 워프 디포머의 이중선형 및 삼각형 보간을 가속하고 경계 밖 외삽만 호스트에 위임하여, 동일한 출력을 유지하면서 워프 CPU 부하를 줄입니다.
settings.optimization.warp-normal-point-elision.tooltip=【권장】법선 점 표시가 비활성화된 상태에서 비활성화된 부모 외부 워프 제어점의 박싱 및 GPU 버퍼 업로드를 생략합니다.
settings.optimization.camera-matrix-cache.tooltip=【권장】루트 카메라 변환이 변경되지 않은 동안 GCamera.getWorldToCameraMatrix() 결과를 캐시하여 렌더링 및 피킹 중 반복적인 행렬 할당과 역행렬 계산을 줄입니다.
settings.optimization.render-pass-traversal.tooltip=【권장】렌더 패스의 이터레이터 순회를 인덱스 루프로 대체하고 엔터티별 GEntity.getRenderer()를 캐시하며 드로우별 디버그 레이블 문자열 연결을 제거합니다.
settings.optimization.mesh-hit-test.tooltip=【권장】포인터 히트 테스트 및 선택 시 임시 GBounds 객체를 할당하지 않고 정점 배열에서 직접 메시 바운딩 박스를 평가합니다.
settings.optimization.scene-handler-cache.tooltip=【권장】깊이 우선 씬 마우스 핸들러 목록을 캐시하고 마우스 핸들러 토폴로지가 변경될 때만 선택적으로 무효화하여 포인터 이벤트마다 전체 씬 트리를 순회하는 비용을 없앱니다.
settings.optimization.cursor-validation-elision.tooltip=【권장】Swing 레이아웃 검증 및 컨테이너 범위 밖 포인터 조회 시 불필요한 AWT 커서 갱신 호출을 단락시켜 창 시스템 왕복 비용을 줄입니다.
settings.optimization.parameter-row-repaint.tooltip=【권장】파라미터 변경 시 모든 행을 다시 그리지 않고 변경된 파라미터 팔레트 행만 증분 동기화합니다.
settings.cubism-jvm.disable-auto-backup.tooltip=【선택 사항: 백업 정책】세션 중 에디터의 주기적 자동 백업 타이머를 비활성화하여 대형 모델 편집 도중 발생하는 주기적 프로젝트 직렬화 및 디스크 쓰기 끊김 현상을 제거합니다.
settings.cubism-jvm.zgc.tooltip=실행 시 동시 저지연 가비지 컬렉터(-XX:+UseZGC，-XX:ZUncommitDelay=60)를 활성화하여 GC 일시 정지 시간을 밀리초 미만으로 유지하고 고부하 편집 중 프레임 드롭을 줄입니다.
settings.cubism-jvm.tooltip=Cubism을 실행할 JVM을 선택합니다. GraalVM은 고급 JIT 최적화를 통해 처리량과 프레임 레이트를 높이며, 번들 Java는 공식 기본 런타임을 유지합니다.
settings.cubism-jvm.memory-profile.tooltip=최대 힙 크기를 제한하거나 SoftReference LRU 유지 시간을 단축하여 유휴 이미지 캐시를 신속히 회수하고 상주 물리 메모리 사용량을 줄입니다.
