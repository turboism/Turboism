settings.performance.preset.tooltip=실측으로 검증된 최적화 프로필을 빠르게 적용합니다:\n- 끔: 43개 네이티브 최적화 스위치를 모두 끕니다.\n- 균형(권장): 지연이 없고 비트 단위로 정확한 31개 기본 활성 최적화를 활성화합니다(핫패스 및 렌더링/입력 생략[확장 보간 형제 재구축 생략, 워프 그리드 보간 가속, 법선 점 업로드 생략, 카메라 행렬 캐시, 렌더 패스 순회 가속, 메시 히트 테스트 할당 제거, 씬 핸들러 캐시, 커서 검증 생략, 파라미터 행 증분 다시 그리기], 행렬 스크래치, 업로드 생략[라인 오버레이 분할 포함], 클립 마스크 중복 제거 및 시저 클리어, 에셋 로드/편집 캐시 등).\n- 고부하 편집: 43개 최적화를 모두 활성화합니다(균형 + 선택형 스위치 및 증분 업데이트, 글루 어펙터, 프레임 끝 지연 GL 검사 / Mesa GL 스레드, 1프레임 지연 파이프라인 비동기 읽기 되돌리기).\n- 사용자 지정: 개별 체크박스 상태가 기본 프리셋과 일치하지 않을 때 자동으로 표시됩니다.
settings.performance.recommendation.tooltip=일상 권장 프로필(균형 프리셋): 비트 단위로 정확하고 지연이 없는 31개 기본 활성 최적화를 활성화합니다(핫패스 및 렌더링/입력 생략[확장 보간 형제 재구축 생략, 워프 그리드 보간 가속, 법선 점 업로드 생략, 카메라 행렬 캐시, 렌더 패스 순회 가속, 메시 히트 테스트 할당 제거, 씬 핸들러 캐시, 커서 검증 생략, 파라미터 행 증분 다시 그리기], 행렬 스크래치, 셰이더별 Uniform 캐시, 업로드 생략[라인 오버레이 분할], 모델 업데이트 건너뛰기, 메시 Setup 생략, 클립 마스크 중복 제거 및 시저 클리어, 확장 보간 증분 설정, 모델 인스턴스 통합, 메시 보간, 워프/메시 편집·내보내기 가속, 메모리 누수 완화, 에셋 로드 캐시).\n작업 부하·지연 트레이드오프가 있는 4개 선택 항목(고부하 편집 프리셋에 포함):\n- 증분 업데이트 + 글루 어펙터: 대형 모델의 파라미터/디포머 편집을 가속하지만 순수 카메라 이동/확대 시 의존성 추적 오버헤드가 추가됩니다.\n- 프레임 끝 지연 GL 검사(Mesa GL 스레드): 드로우별 glGetError 검사를 프레임 경계로 지연합니다(드로우 콜이 많은 씬 및 Linux/Proton Mesa에 유리).\n- 파이프라인 캔버스 읽기 되돌리기: 파이프라인 PBO로 동기 GPU 읽기 대기를 제거하지만 캔버스가 UI보다 1프레임 늦게 표시됩니다.
