settings.optimization.warp-normal-point-elision=비활성화된 부모 외부 워프 제어점 업로드 생략
settings.optimization.camera-matrix-cache=변경 없는 루트 카메라 월드-카메라 행렬 캐시
settings.optimization.render-pass-traversal=렌더 패스 순회 및 렌더러 조회 가속
settings.optimization.mesh-hit-test=할당 없이 메시 히트 테스트 바운딩 박스 직접 평가
