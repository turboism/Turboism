update-notes.fallback.intro=Turboism이 업데이트되어 바로 사용할 수 있습니다.
update-notes.fallback.detail=이 버전의 상세 업데이트 내역이 오프라인에 포함되어 있지 않습니다. GitHub Releases에서 전체 변경 사항을 확인하세요.
