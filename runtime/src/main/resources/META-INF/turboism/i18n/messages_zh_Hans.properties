settings.performance.preset.custom=自定义
settings.performance.preset.tooltip=快速切换整体性能优化方案：\n- 关闭：停用全部 43 项性能优化。\n- 均衡（推荐）：开启全部 32 项零延迟且稳定的日常优化（覆盖编辑、显卡渲染与资源加载），不启用实验或权衡项。\n- 重度编辑：开启全部 43 项优化（包含“过时与实验性选项”中的高负载取舍项，如异步画布回读）。\n- 自定义：下方勾选状态与内置方案不一致时自动显示。
settings.performance.recommendation.tooltip=日常建模与动画制作推荐使用“均衡”预设：已包含全部 32 项经过实测稳定的零延迟优化，兼顾流畅度与画面准确。\n仅在排查特定问题或测试高负载取舍（如局部增量更新、晚一帧的异步画布回读）时，再展开底部的“过时与实验性选项”。
