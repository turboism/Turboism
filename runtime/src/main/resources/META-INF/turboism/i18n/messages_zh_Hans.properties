settings.cubism-jvm.memory-profile-note=限制堆的档位让编辑器在堆内压力下释放其软引用缓存，而不是把堆设为整机内存大小。此项在下次启动编辑器时生效，可与 ZGC 选项同时使用。若启动命令中已有显式 -Xmx，则以该值为准，优先于档位的堆上限。
