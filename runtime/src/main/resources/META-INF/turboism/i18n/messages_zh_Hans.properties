settings.optimization.atlas-loading=加快纹理集载入
settings.optimization.atlas-loading.tooltip=通过并行处理加快纹理集编辑器打开与图像列表刷新。
settings.optimization.triangulation-spatial-index=网格三角化空间索引加速
settings.optimization.triangulation-spatial-index.tooltip=使用空间网格加速高密度网格三角化计算，三角形结果完全一致。
settings.optimization.model-open-acceleration=加快打开模型文件（.cmo3）
settings.optimization.model-open-acceleration.tooltip=通过缓冲归档读取、高速 XML 反序列化、移除显式 GC、并行 PNG 预解码与并行纹理上传打包加快 .cmo3 模型打开。
settings.optimization.runtime-export-acceleration=加快运行时模型导出（.moc3）
settings.optimization.runtime-export-acceleration.tooltip=通过快速顶点查找与缓冲写入加快 .moc3 运行时模型导出，输出数据一致。
settings.optimization.warp-deform-edit-acceleration=加速曲面变形器与变形画笔编辑
settings.optimization.warp-deform-edit-acceleration.tooltip=加速曲面变形器拖动、笔刷变形与覆盖层更新，不改变几何精度。
settings.optimization.atlas-interactive-render=加快纹理集画布交互
settings.optimization.atlas-interactive-render.tooltip=提升纹理集画布缩放、平移与拖动的流畅度，不改变最终导出图像。
settings.optimization.mesh-edit-acceleration=加快交互式网格编辑
settings.optimization.mesh-edit-acceleration.tooltip=加速交互式网格编辑、软选区与自动连线，不改变网格结构。
settings.optimization.memory-leak-mitigation=缓解内存与显存资源泄漏
settings.optimization.memory-leak-mitigation.tooltip=切换视图或关闭模型时及时释放废弃的 OpenGL 缓冲与纹理，限制撤销历史无限增长并清理残留引用，减少长时间工作后的内存膨胀。
settings.optimization.bundle.editing-model-update=跳过未变更的模型更新并合并重复刷新
settings.optimization.bundle.editing-model-update.tooltip=缩放或平移画布等未改动模型参数时跳过整帧模型重算，并将单次编辑触发的连续刷新合并为一次。可显著提高帧率并避免批量调整卡顿。
settings.optimization.bundle.editing-warp-interpolation=加速曲面变形器与扩展插值（含 #4556 卡死修复）
settings.optimization.bundle.editing-warp-interpolation.tooltip=加快曲面变形网格计算、变形笔刷拖动与扩展插值，并修复同类部件过多导致的数秒卡死（#4556）。不改变任何变形形状与视觉效果。
settings.optimization.bundle.editing-canvas-input=提升画布拖动跟手度、拾取与参数面板响应
settings.optimization.bundle.editing-canvas-input.tooltip=加快鼠标拾取与画布响应，跳过多余的光标刷新，并只重绘发生变化的参数据行。拖动控制点和拉动参数滑块时会明显更跟手。
settings.optimization.bundle.rendering-pipeline-cache=缓存渲染管线、着色器与相机矩阵
settings.optimization.bundle.rendering-pipeline-cache.tooltip=复用相机与层级变换矩阵、缓存着色器参数位置，并精简渲染循环。降低每帧的 CPU 与内存回收开销，减少播放和拖拽时的掉帧。
settings.optimization.bundle.rendering-upload-elision=跳过未变更的 GPU 缓冲上传
settings.optimization.bundle.rendering-upload-elision.tooltip=模型未变动时跳过向显卡重复上传网格数据，并在变形时仅上传有改动的辅助线数据。需配合“跳过未变更的模型更新”发挥完整效果。
settings.optimization.bundle.rendering-clip-mask=剪贴蒙版去重与区域清屏
settings.optimization.bundle.rendering-clip-mask.tooltip=多个部件共用同一组剪贴蒙版时直接复用已绘制结果，且清屏范围只局限在蒙版所在区域而非整张画布。大幅减轻显卡负担且零画质损失。
settings.optimization.bundle.assets-atlas=加速纹理集载入、生成与画布交互
settings.optimization.bundle.assets-atlas.tooltip=加快纹理集编辑器打开、缩放拖动与打包生成，并跳过全透明扫描与未改动页面的重复合成。导出的纹理集图像完全一致。
settings.optimization.bundle.assets-mesh=加速网格编辑与自动三角化生成
settings.optimization.bundle.assets-mesh.tooltip=大幅加快高密度网格的自动生成、自动连线、软选区和交互编辑响应，且网格拓扑与顶点位置完全不变。
settings.optimization.bundle.assets-model-io=加速模型打开、保存、PSD 导入与 .moc3 导出
settings.optimization.bundle.assets-model-io.tooltip=通过并行图像编解码、缓冲归档与更快的序列化，缩短打开 .cmo3 模型、导入 PSD、保存 .cmo3/.can3 工程及导出 .moc3 运行时模型的时间，输出文件完全一致。
