settings.optimization.warp-position-projection=加速弯曲变形器坐标投影
settings.mesh-triangulation.hash-degeneracy.tooltip=通过将网格三角化面片类的常数 0 哈希替换为基于三顶点索引的对称哈希，消除哈希表退化为线性扫描的问题，大幅降低自动生成网格时的 CPU 耗时与卡顿。
settings.mesh-triangulation.edge-index.tooltip=通过为三角化过程中的边集合建立紧凑哈希索引并延迟临时边对象分配，省略重复的全列表线性边查找，从而提升高密度网格自动连线速度并减少对象分配。
settings.atlas.tile-bbox.tooltip=通过将纹理集每张部件图像的 Alpha 边缘处理范围限定在网格紧致包围盒内，省略包外全透明像素的扫描与临时缓冲分配，从而加速纹理集生成并降低内存峰值。
settings.atlas.cache-reuse.tooltip=通过对纹理集页面尺寸、部件变换矩阵与源图像像素计算内容签名，在导出或重复打开时直接复用未发生变化的纹理集页面缓存，省略重复的整页图像合成以优化耗时与内存。
settings.optimization.model-update-skip.tooltip=通过在重绘前比对模型参数值、选区、编辑状态与显示设置，在仅缩放或平移画布等模型未发生变化的帧上直接省略整帧 CPU 模型变形计算，从而显著提升画布帧率与交互流畅度。
settings.optimization.incremental-update.tooltip=通过追踪每个变形器与网格关联的参数变化及父子脏传播链，在单参数调整时省略未受影响部件的插值与网格变形计算，从而提升复杂模型编辑时的实时帧率。
settings.optimization.uniform-location-cache.tooltip=通过在单帧渲染周期内缓存已确认无误的 OpenGL 着色器 Uniform 参数位置，省略每次绘制调用中重复的驱动层 glGetUniformLocation 查询与临时对象分配，从而提高渲染帧率并降低内存分配。
settings.optimization.upload-elision.tooltip=通过在模型更新被跳过的静止帧上比对顶点与索引缓冲区内容，省略未变更数据的 glBufferData / glBufferSubData GPU 上传调用，从而减少 CPU-GPU 带宽占用并提升画布帧率。
settings.optimization.input-path-elision.tooltip=通过在画布已持有焦点且光标实例未变时短路每个鼠标事件中的重复 requestFocus 与 setCursor 调用，省略底层窗口系统的冗余状态查询，从而降低输入事件延迟并提升交互帧率。
settings.optimization.mesa-gl-thread.tooltip=在 Linux/Proton (Mesa) 环境下启用驱动多线程 GL 提交，并将帧内每次绘制后的同步 glGetError 检查合并到帧末统一执行，避免主线程与 GL 提交线程频繁同步阻塞，大幅提升渲染帧率（原生 Windows 下自动忽略）。
settings.optimization.mesh-interpolation.tooltip=通过缓存椭圆与 SNS 拓展插值曲线权重、建立关键形式 GUID 索引并仅局部刷新受影响的坐标数组，省略重复的三角函数求值与全量列表拼接，从而提升拓展插值模型的帧率并减少内存分配。
settings.optimization.shader-uniform.tooltip=通过在着色器对象级别缓存每个 GL 程序句柄的 Uniform 位置映射表，省略预绘制阶段重复的 glGetUniformLocation 调用，在未启用帧级缓存的环境下降低驱动查询开销。
settings.optimization.matrix-scratch.tooltip=通过在单次 GTransform.getLocalToWorldMatrix() 父子层级遍历内部交替复用两个局部 4×4 临时矩阵，省略每一层父节点乘法产生的新矩阵对象分配，从而降低渲染与拾取时的内存分配速率与 GC 压力。
settings.optimization.image-archive-reuse.tooltip=通过在加载解码时记录图像资源的原始 PNG 字节流与像素校验，在保存模型且图像像素未发生修改时直接复用原始 PNG 归档字节，省略耗时的 PNG 重新压缩编码以大幅加快保存速度并降低内存峰值。
settings.optimization.float-array-parse-cache.tooltip=通过缓存模型反序列化过程中重复出现的浮点数组词元解析结果并返回防御性副本，省略大量重复的 Float.parseFloat 字符串解析与临时对象创建，从而加快大型模型加载速度并减少内存占用。
settings.optimization.texture-upload-preparation.tooltip=通过预构建的 sRGB 65536 项预乘查找表直接将 ARGB/ABGR 纹理图像批量转换为 JOGL 所需的 RGBA8 预乘字节流，省略逐像素颜色空间转换开销以加速纹理上传并降低临时内存分配（仅限内置 Java 17）。
settings.optimization.warp-position-projection.tooltip=通过在弯曲变形器拓展插值前直接从底层坐标数组读取只读 (x, y) 向量列表，省略构建临时 WarpPointRef 引用对象集合的开销，从而减少插值过程中的临时内存分配（仅限内置 Java 17）。
settings.cubism-jvm.disable-auto-backup.tooltip=通过在会话启动时关闭编辑器的定时后台自动备份，省略编辑过程中周期性的整项目序列化与磁盘写入，从而消除大型模型编辑时的定时卡顿。
settings.cubism-jvm.zgc.tooltip=通过在启动参数中启用并发低延迟垃圾回收器 (-XX:+UseZGC)，将垃圾回收停顿时间控制在亚毫秒级，从而减少高频绘制与大模型操作时的 GC 卡顿。
settings.cubism-jvm.tooltip=选择运行 Cubism 编辑器的 Java 虚拟机：GraalVM 提供更优的即时编译 (JIT) 优化以提升帧率与吞吐量，内置 Java 则保持官方默认运行环境。
settings.cubism-jvm.memory-profile.tooltip=通过限制最大堆内存或缩短软引用缓存 (SoftReference LRU) 存活时间，促使 JVM 及时回收闲置图像缓存，从而显著降低编辑器的常驻物理内存占用。
