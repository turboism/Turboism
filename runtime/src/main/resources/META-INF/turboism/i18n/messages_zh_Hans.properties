settings.mesh-triangulation.hash-degeneracy.tooltip=修复网格三角化时的慢速哈希查找，大幅加快高密度自动网格生成。
settings.mesh-triangulation.edge-index.tooltip=为三角化过程中的边建立索引，加快高密度网格自动连线并减少内存波动。
settings.atlas.tile-bbox.tooltip=将纹理集的透明边界扫描限制在网格紧致范围内，加快图集生成并省内存。
settings.atlas.cache-reuse.tooltip=在刷新或导出时复用未发生变化的纹理集页面缓存，避免整页重绘。
settings.optimization.model-update-skip.tooltip=在只缩放或平移画布等模型未变化的帧上跳过整帧 CPU 模型重算。
settings.optimization.incremental-update.tooltip=拖动单个参数时跳过未受影响的部件以减少计算。默认关闭原因：单纯平移/缩放画布时依赖追踪反而会增加开销，且部分复杂模型特性会跳过加速。
settings.optimization.incremental-update-affecters.tooltip=让仅含胶水影响器的模型也能使用局部增量更新（含 ArtPath 的模型仍走原路径）。默认关闭原因：依赖上方“局部增量更新”开关且提速有限。
settings.optimization.uniform-location-cache.tooltip=在单帧渲染期间缓存着色器参数位置。默认关闭原因：已被默认开启的“着色器级缓存”替代，且开启后会与“跳过未变更的 GPU 缓冲上传”互斥。
settings.optimization.upload-elision.tooltip=跳过未变更的网格显卡缓冲上传，并仅上传变动的辅助线。需配合模型更新跳过；开启帧级着色器位置缓存时网格比对会停用。
settings.optimization.mesh-setup-elision.tooltip=在跳过模型更新的帧上省略重复的网格缓冲设置，降低缩放与平移时的 CPU 耗时。
settings.optimization.input-path-elision.tooltip=在鼠标移动时跳过重复的焦点与光标设置调用。默认关闭原因：相关瓶颈已由“提升画布拖动跟手度”更安全地解决，单独开启可能影响特定窗口焦点。
settings.optimization.mesa-gl-thread.tooltip=将每次绘制后的 OpenGL 错误检查合并到每帧末尾统一执行，避免渲染线程频繁等待显卡同步。在 Linux/Proton 的 Mesa 驱动下还会同时启用多线程提交。
settings.optimization.async-readback=流水线画布异步回读（画面延迟 1 帧）
settings.optimization.async-readback.tooltip=界面线程不再原地等待显卡画完当前帧，可提升超重型模型的变形帧率。默认关闭原因：画布显示会比鼠标操作晚 1 帧，拖动时会有轻微滞后感。
settings.optimization.mesh-interpolation.tooltip=缓存扩展插值曲线权重与关键形式索引，提升帧率并减少内存分配。
settings.optimization.shader-uniform.tooltip=按着色器对象缓存参数位置，减少每帧绘制时对显卡驱动的重复查询。
settings.optimization.matrix-scratch.tooltip=遍历变换层级时复用临时矩阵，降低渲染与拾取时的内存分配和垃圾回收压力。
settings.optimization.image-archive-reuse.tooltip=保存工程时复用未改动的原始 PNG 压缩数据以减少重编码。默认关闭原因：缓存原始字节会占用更多内存，且常规保存提速有限。
settings.optimization.float-array-parse-cache.tooltip=读取模型文件时复用重复出现的数字数组解析结果。默认关闭原因：相比“加速模型打开”整体提速微弱，且会占用少量长期缓存。
settings.optimization.texture-upload-preparation.tooltip=在内置 Java 17 环境下通过查找表加快大图纹理的加载格式转换。默认关闭原因：实测加载提速较小（约 3–8%），且在默认的 GraalVM 下不生效。
settings.optimization.warp-position-projection.tooltip=扩展插值读取弯曲变形器坐标时减少临时包装对象分配。默认关闭原因：收益极小，且已被默认开启的“加速曲面变形器与扩展插值”覆盖。
settings.optimization.reinit-pair-elision.tooltip=模型重新初始化时省略每部件一次的临时配对对象分配。默认关闭原因：仅在重新初始化时触发，对日常操作几乎没有可感知提升。
settings.optimization.clip-mask-deduplication.tooltip=同一帧内多个部件共用同一组剪贴蒙版时直接复用已绘制的蒙版纹理。
settings.optimization.clip-mask-scissor-clear.tooltip=将剪贴蒙版的清屏范围限制在蒙版屏幕包围盒内，减少全画布清理开销。
settings.optimization.extended-interpolation-incremental-setup.tooltip=编辑模型结构时跳过未修改对象的全量扩展插值重建，大幅缓解调整顺序或撤销时的卡顿。
settings.optimization.model-instance-coalesce.tooltip=合并同一次操作周期内重复的模型刷新请求，防止复合编辑导致数秒卡死。
settings.optimization.inspector-property-bypass.tooltip=在检查器中修改透明度或混合模式时跳过整模型重建。默认关闭原因：仅支持 Cubism 5.3+ 且适用场景较窄。
settings.optimization.extended-interpolation-sibling-elision.tooltip=避免扩展插值中的低效同级扫描与强制重建（#4556 修复），输出完全一致。
settings.optimization.warp-grid-interpolation.tooltip=加速范围内曲面变形网格插值计算，输出几何完全不变。
settings.optimization.warp-normal-point-elision.tooltip=跳过已禁用的父级外控制点额外计算与上传。
settings.optimization.camera-matrix-cache.tooltip=在相机未变动时缓存相机变换矩阵，降低每帧计算开销。
settings.optimization.render-pass-traversal.tooltip=精简渲染通道遍历与渲染器查找，并去掉绘制时的调试标签拼接开销。
settings.optimization.mesh-hit-test.tooltip=鼠标拾取时直接计算网格包围盒，避免产生多余的临时对象。
settings.optimization.scene-handler-cache.tooltip=缓存画布鼠标处理器列表，仅在结构变动时更新。
settings.optimization.cursor-validation-elision.tooltip=跳过布局校验和越界鼠标查询时多余的光标刷新调用。
settings.optimization.parameter-row-repaint.tooltip=参数变化时仅重绘实际改动过的参数面板行。
settings.cubism-jvm.disable-auto-backup.tooltip=关闭定时后台自动备份，避免大型模型在编辑中途因磁盘保存突然卡顿。开启期间不会自动保存崩溃恢复备份。
settings.cubism-jvm.zgc.tooltip=启动时启用低延迟 Z 垃圾回收器，大幅减少高负载编辑与大模型操作时的内存回收卡顿与掉帧。
settings.cubism-jvm.tooltip=选择运行 Cubism 的 Java 环境：GraalVM 提供更强的即时编译优化与更高帧率，内置 Java 则保留官方默认环境。
settings.cubism-jvm.memory-profile.tooltip=限制最大内存上限或更快释放闲置图像缓存，避免编辑器占用过多系统内存。
