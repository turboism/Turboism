guide.page.about.title=认识 Turboism
guide.page.about.intro=Turboism 是面向 Live2D Cubism Editor 的运行时增强工具与插件框架。它不修改 Cubism 本体，所有功能都通过插件提供。
guide.page.about.capabilities=建模辅助涵盖参数、网格、PSD 支持、面板增强与本地自动化。
guide.page.about.dependencies=可用功能取决于已安装的插件、插件权限以及 Editor 的精确版本。
guide.page.about.update=在 Turboism 菜单或下载页更新。更新前请关闭 Cubism 并备份工程。
guide.page.plugins.title=插件与插件市场
guide.page.plugins.intro=插件是 Turboism 的功能单元。按需安装，并可随时启用或停用。
guide.page.plugins.install=在插件市场安装官方插件，或在插件管理中选择本地插件文件。
guide.page.plugins.manage=插件管理负责启用、停用与卸载；插件设置保存每个插件的选项。
guide.page.plugins.market=官方市场提供已签名的插件包，插件目录更新随版本一同送达。
guide.page.support.title=需要帮助？
guide.page.support.intro=官方渠道能最快联系到维护者。
guide.page.support.logs=反馈前请打开 Turboism 日志，并附上日志和 Editor 版本。
guide.page.support.issues=请在 GitHub Issues 提交可复现的问题与建议。
guide.page.support.security=安全问题请私下发送至 contact@turboism.dev。
card.author-support.title=支持作者
card.author-support.body=这是一个开源免费软件。如果它帮到了你，请考虑支持我或分享它。
