settings.performance.preset.tooltip=快速套用整體效能最佳化方案：\n- 關閉：停用全部 43 項效能最佳化。\n- 平衡（推薦）：開啟全部 32 項零延遲且穩定的日常最佳化（涵蓋編輯、顯示卡渲染與資源載入），不啟用實驗或權衡項目。\n- 重度編輯：開啟全部 43 項最佳化（包含「過時與實驗性選項」中的高負載取捨項目，如非同步畫布回讀）。\n- 自訂：下方核取方塊狀態與內建方案不一致時自動顯示。
settings.performance.recommendation.tooltip=日常建模與動畫製作推薦使用「平衡」預設：已包含全部 32 項經過實測穩定的零延遲最佳化，兼顧流暢度與畫面準確。\n僅在排查特定問題或測試高負載取捨（如局部增量更新、晚一幀的非同步畫布回讀）時，再展開底部的「過時與實驗性選項」。
