settings.optimization.texture-upload-preparation=加速紋理上傳像素預處理
settings.optimization.warp-position-projection=加速彎曲變形器座標投影
settings.mesh-triangulation.hash-degeneracy.tooltip=透過將網格三角化面片類別的常數 0 雜湊替換為基於三頂點索引的對稱雜湊，消除雜湊表退化為線性掃描的問題，大幅降低自動生成網格時的 CPU 耗時與卡頓。
settings.mesh-triangulation.edge-index.tooltip=透過為三角化過程中的邊集合建立緊湊雜湊索引並延遲臨時邊物件配置，省略重複的全列表線性邊查找，從而提升高密度網格自動連線速度並減少物件配置。
settings.atlas.tile-bbox.tooltip=透過將紋理集每張部件影像的 Alpha 邊緣處理範圍限定在網格緊緻包圍盒內，省略包外全透明像素的掃描與臨時緩衝配置，從而加速紋理集生成並降低記憶體峰值。
settings.atlas.cache-reuse.tooltip=透過對紋理集頁面尺寸、部件變換矩陣與源影像像素計算內容簽章，在匯出或重複開啟時直接複用未發生變化的紋理集頁面快取，省略重複的整頁影像合成以最佳化耗時與記憶體。
settings.optimization.model-update-skip.tooltip=透過在重繪前比對模型參數值、選取區、編輯狀態與顯示設定，在僅縮放或平移畫布等模型未發生變化的幀上直接省略整幀 CPU 模型變形計算，從而顯著提升畫布幀率與互動流暢度。
settings.optimization.incremental-update.tooltip=透過追蹤每個變形器與網格關聯的參數變化及父子髒傳播鏈，在單參數調整時省略未受影響部件的插值與網格變形計算，從而提升複雜模型編輯時的即時幀率。
settings.optimization.uniform-location-cache.tooltip=透過在單幀渲染週期內快取已確認無誤的 OpenGL 著色器 Uniform 參數位置，省略每次繪製呼叫中重複的驅動層 glGetUniformLocation 查詢與臨時物件配置，從而提高渲染幀率並降低記憶體配置。
settings.optimization.upload-elision.tooltip=透過在模型更新被略過的靜止幀上比對頂點與索引緩衝區內容，省略未變更資料的 glBufferData / glBufferSubData GPU 上傳呼叫，從而減少 CPU-GPU 頻寬佔用並提升畫布幀率。
settings.optimization.input-path-elision.tooltip=透過在畫布已持有焦點且游標實例未變時短路每個滑鼠事件中的重複 requestFocus 與 setCursor 呼叫，省略底層視窗系統的冗餘狀態查詢，從而降低輸入事件延遲並提升互動幀率。
settings.optimization.mesa-gl-thread.tooltip=在 Linux/Proton (Mesa) 環境下啟用驅動多執行緒 GL 提交，並將幀內每次繪製後的同步 glGetError 檢查合併到幀末統一執行，避免主執行緒與 GL 提交執行緒頻繁同步阻塞，大幅提升渲染幀率（原生 Windows 下自動忽略）。
settings.optimization.mesh-interpolation.tooltip=透過快取橢圓與 SNS 拓展插值曲線權重、建立關鍵形式 GUID 索引並僅局部重新整理受影響的座標陣列，省略重複的三角函數求值與全量列表拼接，從而提升拓展插值模型的幀率並減少記憶體配置。
settings.optimization.shader-uniform.tooltip=透過在著色器物件層級快取每個 GL 程式控制代碼的 Uniform 位置映射表，省略預繪製階段重複的 glGetUniformLocation 呼叫，在未啟用幀級快取的環境下降低驅動查詢開銷。
settings.optimization.matrix-scratch.tooltip=透過在單次 GTransform.getLocalToWorldMatrix() 父子層級遍歷內部交替複用兩個局部 4×4 臨時矩陣，省略每一層父節點乘法產生的新矩陣物件配置，從而降低渲染與拾取時的記憶體配置速率與 GC 壓力。
settings.optimization.image-archive-reuse.tooltip=透過在載入解碼時記錄影像資源的原始 PNG 位元組流與像素校驗，在儲存模型且影像像素未發生修改時直接複用原始 PNG 歸檔位元組，省略耗時的 PNG 重新壓縮編碼以大幅加快儲存速度並降低記憶體峰值。
settings.optimization.float-array-parse-cache.tooltip=透過快取模型反序列化過程中重複出現的浮點陣列詞元解析結果並傳回防禦性副本，省略大量重複的 Float.parseFloat 字串解析與臨時物件建立，從而加快大型模型載入速度並減少記憶體佔用。
settings.optimization.texture-upload-preparation.tooltip=透過預先建立的 sRGB 65536 項預乘查找表直接將 ARGB/ABGR 紋理影像批次轉換為 JOGL 所需的 RGBA8 預乘位元組流，省略逐像素色彩空間轉換開銷以加速紋理上傳並降低臨時記憶體配置（僅限內建 Java 17）。
settings.optimization.warp-position-projection.tooltip=透過在彎曲變形器拓展插值前直接從底層座標陣列讀取唯讀 (x, y) 向量列表，省略建立臨時 WarpPointRef 引用物件集合的開銷，從而減少插值過程中的臨時記憶體配置（僅限內建 Java 17）。
settings.cubism-jvm.disable-auto-backup.tooltip=透過在工作階段啟動時關閉編輯器的定時背景自動備份，省略編輯過程中週期性的整專案序列化與磁碟寫入，從而消除大型模型編輯時的定時卡頓。
settings.cubism-jvm.zgc.tooltip=透過在啟動參數中啟用並行低延遲垃圾回收器 (-XX:+UseZGC)，將垃圾回收停頓時間控制在亞毫秒級，從而減少高頻繪製與大模型操作時的 GC 卡頓。
settings.cubism-jvm.tooltip=選擇執行 Cubism 編輯器的 Java 虛擬機器：GraalVM 提供更優的即時編譯 (JIT) 最佳化以提升幀率與吞吐量，內建 Java 則保持官方預設執行環境。
settings.cubism-jvm.memory-profile.tooltip=透過限制最大堆積記憶體或縮短軟引用快取 (SoftReference LRU) 存活時間，促使 JVM 及時回收閒置影像快取，從而顯著降低編輯器的常駐實體記憶體佔用。
