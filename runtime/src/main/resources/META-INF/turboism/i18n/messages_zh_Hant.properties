guide.page.about.title=認識 Turboism
guide.page.about.intro=Turboism 是面向 Live2D Cubism Editor 的執行階段增強工具與外掛框架。它不修改 Cubism 本體，所有功能都透過外掛提供。
guide.page.about.capabilities=建模輔助涵蓋參數、網格、PSD 支援、面板增強與本機自動化。
guide.page.about.dependencies=可用功能取決於已安裝的外掛、外掛權限以及 Editor 的精確版本。
guide.page.about.update=在 Turboism 選單或下載頁更新。更新前請關閉 Cubism 並備份專案。
guide.page.plugins.title=外掛與外掛市集
guide.page.plugins.intro=外掛是 Turboism 的功能單位。依需求安裝，並可隨時啟用或停用。
guide.page.plugins.install=在外掛市集安裝官方外掛，或在外掛管理中選擇本機外掛檔案。
guide.page.plugins.manage=外掛管理負責啟用、停用與解除安裝；外掛設定保存每個外掛的選項。
guide.page.plugins.market=官方市集提供已簽章的外掛套件，外掛目錄更新隨版本一同送達。
guide.page.support.title=需要協助？
guide.page.support.intro=官方管道能最快聯絡到維護者。
guide.page.support.logs=回報前請開啟 Turboism 記錄，並附上記錄和 Editor 版本。
guide.page.support.issues=請在 GitHub Issues 提交可重現的問題與建議。
guide.page.support.security=安全性問題請私下寄送至 contact@turboism.dev。
