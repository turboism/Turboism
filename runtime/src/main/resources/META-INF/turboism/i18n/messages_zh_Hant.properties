settings.optimization.atlas-loading=加快紋理集載入
settings.optimization.atlas-loading.tooltip=透過平行處理加快紋理集編輯器開啟與影像清單重新整理。
settings.optimization.triangulation-spatial-index=網格三角化空間索引加速
settings.optimization.triangulation-spatial-index.tooltip=使用空間網格加速高密度網格三角化計算，三角形結果完全一致。
settings.optimization.model-open-acceleration=加快開啟模型檔案（.cmo3）
settings.optimization.model-open-acceleration.tooltip=透過平行紋理解碼、快速三角化與縮圖快取加快 .cmo3 模型開啟。
settings.optimization.runtime-export-acceleration=加快執行期模型匯出（.moc3）
settings.optimization.runtime-export-acceleration.tooltip=透過快速頂點查詢與緩衝寫入加快 .moc3 執行期模型匯出，輸出資料一致。
settings.optimization.warp-deform-edit-acceleration=加速曲面變形器與變形筆刷編輯
settings.optimization.warp-deform-edit-acceleration.tooltip=加速曲面變形器拖曳、筆刷變形與覆蓋層更新，不改變幾何精度。
settings.optimization.atlas-interactive-render=加快紋理集畫布互動
settings.optimization.atlas-interactive-render.tooltip=提升紋理集畫布縮放、平移與拖曳的流暢度，不改變最終匯出影像。
settings.optimization.mesh-edit-acceleration=加快互動式網格編輯
settings.optimization.mesh-edit-acceleration.tooltip=加速互動式網格編輯、軟選取與自動連線，不改變網格結構。
settings.optimization.memory-leak-mitigation=緩解記憶體與顯示記憶體資源洩漏
settings.optimization.memory-leak-mitigation.tooltip=切換檢視或關閉模型時及時釋放廢棄的 OpenGL 緩衝與紋理，限制復原歷史無限增長並清理殘留參考，減少長時間工作後的記憶體膨脹。
settings.optimization.bundle.editing-model-update=跳過未變更的模型更新並合併重複重新整理
settings.optimization.bundle.editing-model-update.tooltip=縮放或平移畫布等未改動模型參數時跳過整幀模型重算，並將單次編輯觸發的連續重新整理合併為一次。可顯著提高幀率並避免批次調整卡頓。
settings.optimization.bundle.editing-warp-interpolation=加速曲面變形器與擴展插值（含 #4556 卡死修復）
settings.optimization.bundle.editing-warp-interpolation.tooltip=加快曲面變形網格計算、變形筆刷拖曳與擴展插值，並修復同類部件過多導致的數秒卡死（#4556）。不改變任何變形形狀與視覺效果。
settings.optimization.bundle.editing-canvas-input=提升畫布拖曳跟手度、選取與參數面板回應
settings.optimization.bundle.editing-canvas-input.tooltip=加快滑鼠選取與畫布回應，跳過多餘的游標重新整理，並只重繪發生變化的參數列。拖曳控制點與拉動參數滑桿時會明顯更跟手。
settings.optimization.bundle.rendering-pipeline-cache=快取渲染管線、著色器與相機矩陣
settings.optimization.bundle.rendering-pipeline-cache.tooltip=複用相機與階層變換矩陣、快取著色器參數位置，並精簡渲染迴圈。降低每幀的 CPU 與記憶體回收開銷，減少播放與拖曳時的掉幀。
settings.optimization.bundle.rendering-upload-elision=跳過未變更的 GPU 緩衝上傳
settings.optimization.bundle.rendering-upload-elision.tooltip=模型未變動時跳過向顯示卡重複上傳網格資料，並在變形時僅上傳有改動的輔助線資料。需搭配「跳過未變更的模型更新」發揮完整效果。
settings.optimization.bundle.rendering-clip-mask=剪貼蒙版去重與區域清屏
settings.optimization.bundle.rendering-clip-mask.tooltip=多個部件共用同一組剪貼蒙版時直接複用已繪製結果，且清屏範圍僅限於蒙版所在區域而非整張畫布。大幅減輕顯示卡負擔且零畫質損失。
settings.optimization.bundle.assets-atlas=加速紋理集載入、生成與畫布互動
settings.optimization.bundle.assets-atlas.tooltip=加快紋理集編輯器開啟、檢視縮放拖曳與打包生成，並跳過全透明掃描與未改動頁面的重複合成。匯出的紋理集影像完全一致。
settings.optimization.bundle.assets-mesh=加速網格編輯與自動三角化生成
settings.optimization.bundle.assets-mesh.tooltip=大幅加快高密度網格的自動生成、自動連線、軟選取與互動編輯回應，且網格拓樸與頂點位置完全不變。
settings.optimization.bundle.assets-model-io=加速模型開啟、儲存、PSD 匯入與 .moc3 匯出
settings.optimization.bundle.assets-model-io.tooltip=透過平行影像編解碼、緩衝封存與更快的序列化，縮短開啟 .cmo3 模型、匯入 PSD、儲存 .cmo3/.can3 工程及匯出 .moc3 執行期模型的時間，輸出檔案內容完全一致。
