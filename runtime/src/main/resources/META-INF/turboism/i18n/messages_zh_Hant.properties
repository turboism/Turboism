settings.optimization.incremental-update.tooltip=拖曳單一參數時跳過未受影響的部件以減少計算。預設關閉原因：單純平移/縮放畫布時相依追蹤反而會增加開銷，且部分複雜模型特性會跳過加速。
settings.optimization.incremental-update-affecters.tooltip=讓僅含膠水影響器的模型也能使用局部增量更新（含 ArtPath 的模型仍走原路徑）。預設關閉原因：依賴上方「局部增量更新」開關且提速有限。
settings.optimization.uniform-location-cache.tooltip=在單幀渲染期間快取著色器參數位置。預設關閉原因：已被預設開啟的「著色器級快取」替代，且開啟後會與「跳過未變更的 GPU 緩衝上傳」互斥。
settings.optimization.upload-elision.tooltip=跳過未變更的網格顯示卡緩衝上傳，並僅上傳變動的輔助線。需搭配模型更新跳過；開啟幀級著色器位置快取時網格比對會停用。
settings.optimization.mesh-setup-elision.tooltip=在跳過模型更新的幀上省略重複的網格緩衝設定，降低縮放與平移時的 CPU 耗時。
settings.optimization.input-path-elision.tooltip=在滑鼠移動時跳過重複的焦點與游標設定呼叫。預設關閉原因：相關瓶頸已由「提升畫布拖曳跟手度」更安全地解決，單獨開啟可能影響特定視窗焦點。
settings.optimization.mesa-gl-thread.tooltip=將每次繪製後的 OpenGL 錯誤檢查合併到每幀末尾統一執行，避免渲染執行緒頻繁等待顯示卡同步。在 Linux/Proton 的 Mesa 驅動下還會同時啟用多執行緒提交。
settings.optimization.async-readback=管線化畫布非同步回讀（畫面延遲 1 幀）
settings.optimization.async-readback.tooltip=介面執行緒不再原地等待顯示卡畫完目前幀，可提升超重型模型的變形幀率。預設關閉原因：畫布顯示會比滑鼠操作晚 1 幀，拖曳時會有輕微滯後感。
settings.optimization.mesh-interpolation.tooltip=快取擴展插值曲線權重與關鍵形式索引，提升幀率並減少記憶體配置。
settings.optimization.shader-uniform.tooltip=依著色器物件快取參數位置，減少每幀繪製時對顯示卡驅動的重複查詢。
settings.optimization.matrix-scratch.tooltip=遍歷變換階層時複用臨時矩陣，降低渲染與拾取時的記憶體配置與垃圾回收壓力。
settings.optimization.image-archive-reuse.tooltip=儲存工程時複用未改動的原始 PNG 壓縮資料以減少重編碼。預設關閉原因：快取原始位元組會佔用更多記憶體，且一般儲存提速有限。
settings.optimization.float-array-parse-cache.tooltip=讀取模型檔案時複用重複出現的數字陣列解析結果。預設關閉原因：相比「加速模型開啟」整體提速微弱，且會佔用少量長期快取。
settings.optimization.texture-upload-preparation.tooltip=在內建 Java 17 環境下透過查找表加快大圖紋理的載入格式轉換。預設關閉原因：實測載入提速較小（約 3–8%），且在預設的 GraalVM 下不生效。
settings.optimization.warp-position-projection.tooltip=擴展插值讀取彎曲變形器座標時減少臨時包裝物件配置。預設關閉原因：收益極小，且已被預設開啟的「加速曲面變形器與擴展插值」覆蓋。
settings.optimization.reinit-pair-elision.tooltip=模型重新初始化時省略每個部件一次的臨時配對物件配置。預設關閉原因：僅在重新初始化時觸發，對日常操作幾乎沒有可感知提升。
settings.optimization.clip-mask-deduplication.tooltip=同一幀內多個部件共用同一組剪貼蒙版時直接複用已繪製的蒙版紋理。
settings.optimization.clip-mask-scissor-clear.tooltip=將剪貼蒙版的清屏範圍限制在蒙版螢幕包圍盒內，減少全畫布清理開銷。
settings.optimization.extended-interpolation-incremental-setup.tooltip=編輯模型結構時跳過未修改物件的全量擴展插值重建，大幅緩解調整順序或復原時的卡頓。
settings.optimization.model-instance-coalesce.tooltip=合併同一次操作週期內重複的模型重新整理請求，防止複合編輯導致數秒卡死。
settings.optimization.inspector-property-bypass.tooltip=在檢查器中修改透明度或混合模式時跳過整模型重建。預設關閉原因：僅支援 Cubism 5.3+ 且適用場景較窄。
settings.optimization.extended-interpolation-sibling-elision.tooltip=避免擴展插值中的低效同級掃描與強制重建（#4556 修復），輸出完全一致。
settings.optimization.warp-grid-interpolation.tooltip=加速範圍內曲面變形網格插值計算，輸出幾何完全不變。
settings.optimization.warp-normal-point-elision.tooltip=跳過已停用的父級外控制點額外計算與上傳。
settings.optimization.camera-matrix-cache.tooltip=在相機未變動時快取相機變換矩陣，降低每幀計算開銷。
settings.optimization.render-pass-traversal.tooltip=精簡渲染通道遍歷與渲染器查詢，並去掉繪製時的除錯標籤字串串接開銷。
settings.optimization.mesh-hit-test.tooltip=滑鼠選取時直接計算網格包圍盒，避免產生多餘的臨時物件。
settings.optimization.scene-handler-cache.tooltip=快取畫布滑鼠處理器清單，僅在結構變動時更新。
settings.optimization.cursor-validation-elision.tooltip=跳過版面配置驗證與越界滑鼠查詢時多餘的游標重新整理呼叫。
settings.optimization.parameter-row-repaint.tooltip=參數變化時僅重繪實際改動過的參數面板列。
settings.cubism-jvm.disable-auto-backup.tooltip=關閉定時背景自動備份，避免大型模型在編輯中途因磁碟儲存突然卡頓。開啟期間不會自動儲存崩潰復原備份。
settings.cubism-jvm.zgc.tooltip=啟動時啟用低延遲 Z 垃圾回收器，大幅減少高負載編輯與大模型操作時的記憶體回收卡頓與掉幀。
settings.cubism-jvm.tooltip=選擇執行 Cubism 的 Java 環境：GraalVM 提供更強的即時編譯最佳化與更高幀率，內建 Java 則保留官方預設環境。
settings.cubism-jvm.memory-profile.tooltip=限制最大記憶體上限或更快釋放閒置影像快取，避免編輯器佔用過多系統記憶體。
