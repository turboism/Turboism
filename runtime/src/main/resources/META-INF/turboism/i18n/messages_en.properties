settings.mesh-triangulation.hash-degeneracy.tooltip=Fixes slow hash lookups during mesh triangulation so dense auto-meshes generate much faster.
settings.mesh-triangulation.edge-index.tooltip=Indexes mesh edges during triangulation to speed up dense auto-connect and reduce memory churn.
settings.atlas.tile-bbox.tooltip=Limits atlas transparency checks to each mesh's tight bounds, speeding up texture atlas generation.
settings.atlas.cache-reuse.tooltip=Reuses unchanged texture atlas pages across refreshes and exports to skip redundant recomposition.
settings.optimization.model-update-skip.tooltip=Skips full CPU model recalculation on frames where only the camera zoom or pan changed.
settings.optimization.incremental-update.tooltip=Skips unaffected parts when dragging a single parameter on compatible models. Off by default because dependency tracking adds overhead during pure camera pan/zoom and skips unsupported model features.
settings.optimization.incremental-update-affecters.tooltip=Lets incremental update handle models that use glue affecters, while still falling back for ArtPath models. Off by default because it requires Incremental Update and offers modest gains.
settings.optimization.uniform-location-cache.tooltip=Caches OpenGL uniform locations for a single frame. Off by default because it is superseded by the default per-shader cache and disables mesh upload skipping when enabled.
settings.optimization.upload-elision.tooltip=Skips re-sending unchanged mesh buffers to the GPU and uploads only modified overlay lines. Requires unchanged model update skipping; mesh comparison stops if the frame uniform cache is enabled.
settings.optimization.mesh-setup-elision.tooltip=Skips resetting vertex buffers when the model update was skipped, cutting CPU overhead during zoom and pan.
settings.optimization.input-path-elision.tooltip=Skips repeated focus and cursor calls during mouse movement. Off by default because canvas dragging & UI responsiveness optimizations already solve the main bottleneck more safely.
settings.optimization.mesa-gl-thread.tooltip=Moves OpenGL error checks from every draw call to once at the end of each frame so the render thread does not stall waiting on the driver. Also enables threaded GL submission on Linux/Proton Mesa drivers.
settings.optimization.async-readback=Pipelined canvas readback (adds 1-frame delay)
settings.optimization.async-readback.tooltip=Stops the UI thread from waiting for the GPU to finish each frame, raising deformation FPS on very heavy models. Off by default because the canvas displays one frame behind your cursor.
settings.optimization.mesh-interpolation.tooltip=Caches extended interpolation curve weights and keyform lookups to boost frame rates and reduce memory allocations.
settings.optimization.shader-uniform.tooltip=Caches OpenGL uniform locations per shader so draws avoid repeated graphics driver lookups.
settings.optimization.matrix-scratch.tooltip=Reuses temporary matrices when walking the transform hierarchy to cut memory churn during rendering and picking.
settings.optimization.image-archive-reuse.tooltip=Skips re-encoding unmodified PNG images when saving a project. Off by default because keeping encoded bytes uses extra memory for small save-time gains.
settings.optimization.float-array-parse-cache.tooltip=Reuses previously parsed number arrays when loading model files. Off by default because gains are minor compared to parallel model-open optimizations and it keeps a small cache in memory.
settings.optimization.texture-upload-preparation.tooltip=Speeds up texture pixel conversion with a lookup table when loading models on Bundled Java 17. Off by default because gains are modest (~3–8% load speedup) and it does not apply under GraalVM.
settings.optimization.warp-position-projection.tooltip=Avoids temporary coordinate wrappers during warp extended interpolation on Java 17+. Off by default because its benefit is tiny and superseded by warp deformer acceleration.
settings.optimization.reinit-pair-elision.tooltip=Avoids temporary pair object allocations when a model reinitializes. Off by default because reinitialization happens rarely and measurable speedup is negligible.
settings.optimization.clip-mask-deduplication.tooltip=Reuses rendered mask textures within the same frame when multiple parts share identical clipping masks.
settings.optimization.clip-mask-scissor-clear.tooltip=Limits clipping mask clearing to the mask's screen bounds instead of clearing the full canvas.
settings.optimization.extended-interpolation-incremental-setup.tooltip=Skips full extended-interpolation rebuilds for unchanged objects when editing model structure.
settings.optimization.model-instance-coalesce.tooltip=Merges duplicate model refresh calls within the same edit cycle to prevent multi-second freezes.
settings.optimization.inspector-property-bypass.tooltip=Updates the shader directly instead of rebuilding the model when changing blend or color properties in the Inspector. Off by default because it applies only to Cubism 5.3+ and narrow inspector edits.
settings.optimization.extended-interpolation-sibling-elision.tooltip=Avoids slow sibling scans and forced rebuilds in extended interpolation (#4556 fix) without changing output.
settings.optimization.warp-grid-interpolation.tooltip=Speeds up in-bounds warp grid interpolation while keeping deformation geometry identical.
settings.optimization.warp-normal-point-elision.tooltip=Skips extra work and uploads for disabled outside-of-parent warp control points.
settings.optimization.camera-matrix-cache.tooltip=Caches the camera transform matrix while the camera is unchanged to cut per-frame overhead.
settings.optimization.render-pass-traversal.tooltip=Streamlines render-pass loops and renderer lookups while removing debug label string work.
settings.optimization.mesh-hit-test.tooltip=Evaluates mesh bounds directly during mouse hit-testing without temporary bounding-box allocations.
settings.optimization.scene-handler-cache.tooltip=Caches scene mouse-handler lists and updates them only when handler layout changes.
settings.optimization.cursor-validation-elision.tooltip=Skips redundant cursor updates during layout checks and out-of-bounds pointer queries.
settings.optimization.parameter-row-repaint.tooltip=Repaints only parameter palette rows whose values actually changed.
settings.cubism-jvm.disable-auto-backup.tooltip=Stops periodic background auto-backups so large models do not freeze during disk saves. Automatic crash recovery backups are disabled while this is on.
settings.cubism-jvm.zgc.tooltip=Uses the low-pause Z Garbage Collector on launch to eliminate GC stutters and frame drops on heavy models.
settings.cubism-jvm.tooltip=Selects the Java runtime used to launch Cubism: GraalVM gives higher throughput and frame rates, while Bundled Java uses the official runtime.
settings.cubism-jvm.memory-profile.tooltip=Caps maximum heap memory or releases idle image caches sooner so Cubism uses less RAM.
