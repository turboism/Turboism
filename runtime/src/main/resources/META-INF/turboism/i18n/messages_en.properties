settings.cubism-jvm.memory-profile-note=Capped-heap profiles let the editor release its soft-reference caches under memory pressure instead of sizing the heap to all installed RAM. The choice applies on the next Editor launch and can be combined with ZGC. An explicit -Xmx already present in the launch command takes precedence over the profile's heap limit.
settings.performance.restart-note=Performance optimizations may cause visual issues. All settings and optimizations on this page require restarting the editor to take effect.
