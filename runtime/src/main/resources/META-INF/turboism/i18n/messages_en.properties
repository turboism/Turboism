settings.performance.preset=Optimization preset
settings.performance.preset.off=Off (All disabled)
settings.performance.preset.balanced=Balanced (Recommended)
settings.performance.preset.heavy-editing=Heavy Editing (Max throughput)
settings.performance.preset.custom=Custom
settings.performance.preset.tooltip=Choose an optimization profile:\n- Off: Turns off all 43 performance optimizations.\n- Balanced (Recommended): Enables all 32 safe, zero-delay optimizations across editing, GPU rendering, and assets, leaving experimental options off.\n- Heavy Editing: Enables all 43 options, including Legacy & Experimental trade-offs such as 1-frame async canvas readback.\n- Custom: Shown automatically when checkboxes differ from built-in presets.
settings.performance.recommendation.tooltip=For everyday modeling and animation, use the Balanced preset: it enables all 32 verified optimizations with no extra delay or visual issues.\nOnly expand Legacy & Experimental (or use Heavy Editing) when testing specific trade-offs such as incremental part updates or async canvas readback.
settings.performance.section.editing=Editing & Deformation
settings.performance.section.editing.tooltip=Speeds up model updates, warp deformer drags, extended interpolation, and canvas input response.
settings.performance.section.assets=Mesh, Atlas & Files
settings.performance.section.assets.tooltip=Speeds up texture atlas editing, mesh generation, and model opening/exporting, and prevents resource leaks.
settings.performance.section.legacy=Legacy & Experimental
settings.performance.section.legacy.tooltip=Options kept off by default because they offer minor gains, conflict with default optimizations, or trade responsiveness or latency.
settings.performance.section.rendering=Rendering & GPU
