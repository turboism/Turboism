guide.page.about.title=Meet Turboism
guide.page.about.intro=Turboism is a runtime enhancement tool and plugin framework for Live2D Cubism Editor. It never modifies Cubism itself: every feature arrives through a plugin.
guide.page.about.capabilities=Modeling helpers cover parameters, meshes, PSD support, panel enhancements, and local automation.
guide.page.about.dependencies=Available features depend on the installed plugins, their permissions, and the exact Editor version.
guide.page.about.update=Update from the Turboism menu or the download page. Close Cubism and back up the project first.
guide.page.plugins.title=Plugins and the plugin market
guide.page.plugins.intro=Plugins are the feature units of Turboism. Install only what you need, and enable or disable each one at any time.
guide.page.plugins.install=Install official plugins from the plugin market, or choose a local plugin file in plugin management.
guide.page.plugins.manage=Plugin management enables, disables, and uninstalls plugins. Plugin settings holds the options of each plugin.
guide.page.plugins.market=The official market serves signed packages, so catalog updates arrive with each release.
guide.page.support.title=Need help?
guide.page.support.intro=The official channels reach the maintainers fastest.
guide.page.support.logs=Open Turboism Logs before reporting, and attach the log together with the Editor version.
guide.page.support.issues=Report reproducible problems and suggestions on GitHub Issues.
guide.page.support.security=Report security concerns privately to contact@turboism.dev.
