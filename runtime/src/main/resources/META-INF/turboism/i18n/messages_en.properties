settings.mesh-triangulation.hash-degeneracy.tooltip=Replaces the triangulator face class's constant-0 hashCode with a symmetric three-vertex hash to prevent hash tables from degenerating into linear scans during mesh generation.
settings.mesh-triangulation.edge-index.tooltip=Maintains a compact edge index and defers temporary edge allocations during triangulation, eliminating repeated linear edge scans and reducing GC pressure on dense meshes.
settings.atlas.tile-bbox.tooltip=Bounds per-tile alpha edge processing to each mesh's tight bounding box, skipping full-page transparent pixel scans and large scratch allocations during texture atlas generation.
settings.atlas.cache-reuse.tooltip=Computes a content signature over atlas dimensions, item transforms, and source pixels to reuse unchanged atlas pages and skip redundant full-page recomposition.
settings.optimization.model-update-skip.tooltip=Compares model parameters, selection, editing state, and view settings before each repaint to skip redundant CPU model updates on unchanged frames, improving zoom and pan frame rates.
settings.optimization.incremental-update.tooltip=Tracks per-deformer and per-ArtMesh parameter changes along the parent-child hierarchy to skip interpolation and deformation for unaffected parts, improving frame rates on complex models.
settings.optimization.uniform-location-cache.tooltip=Caches verified OpenGL shader uniform locations within each render frame to eliminate repeated driver glGetUniformLocation queries and per-draw allocations, improving frame rate and memory usage.
settings.optimization.upload-elision.tooltip=Elides redundant glBufferData and glBufferSubData VBO uploads on skipped model-update frames when buffer contents are unchanged, reducing CPU-to-GPU upload overhead.
settings.optimization.input-path-elision.tooltip=Short-circuits redundant requestFocus and setCursor calls on every mouse event when focus and cursor are unchanged, avoiding native window-system round-trips and reducing input latency.
settings.optimization.mesa-gl-thread.tooltip=Under Linux/Proton with Mesa, enables threaded GL command submission and defers per-draw glGetError checks to the end of each frame to prevent synchronous thread flushes (ignored on native Windows).
settings.optimization.mesh-interpolation.tooltip=Caches Ellipse and SNS curve weights, indexes keyform GUID lookups, and performs bounded local array updates to eliminate repeated trigonometric evaluation and list allocations.
settings.optimization.shader-uniform.tooltip=Caches uniform locations per GShader instance and GL program handle during pre-draw to avoid repeated glGetUniformLocation driver queries.
settings.optimization.matrix-scratch.tooltip=Alternates two invocation-local 4x4 scratch matrices inside GTransform.getLocalToWorldMatrix() parent-chain traversal, eliminating intermediate matrix allocations per hierarchy level.
settings.optimization.image-archive-reuse.tooltip=Reuses the original encoded PNG byte stream when archiving unchanged CImageResource textures during save, skipping expensive PNG re-encoding and temporary buffer allocations.
settings.optimization.float-array-parse-cache.tooltip=Caches parsed float arrays during model deserialization and returns defensive copies, avoiding repeated string-to-float parsing and temporary allocations during file load.
settings.optimization.texture-upload-preparation.tooltip=Converts ARGB and ABGR texture images into premultiplied RGBA8 byte buffers via a precomputed 65,536-entry sRGB lookup table, accelerating JOGL texture upload preparation on bundled Java 17.
settings.optimization.warp-position-projection.tooltip=Projects read-only GVector2 coordinates directly from CWarpDeformerForm's backing float array during extended interpolation, bypassing temporary WarpPointRef wrapper allocations on bundled Java 17.
settings.cubism-jvm.disable-auto-backup.tooltip=Disables the editor's periodic auto-backup timer for the session to eliminate mid-edit project serialization and disk-write stalls on large models.
settings.cubism-jvm.zgc.tooltip=Enables the concurrent low-pause Z Garbage Collector (-XX:+UseZGC) on launch to keep GC pauses sub-millisecond and reduce frame drops during heavy editing.
settings.cubism-jvm.tooltip=Selects the JVM used to launch Cubism: GraalVM provides advanced JIT compilation for higher throughput and frame rates, while Bundled Java uses the official runtime.
settings.cubism-jvm.memory-profile.tooltip=Caps maximum heap size or shortens the SoftReference LRU clock so the JVM reclaims idle image caches promptly instead of expanding to full system RAM.
