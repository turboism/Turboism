settings.optimization.atlas-loading=Speed up texture atlas loading
settings.optimization.atlas-loading.tooltip=Speeds up opening the texture atlas editor and refreshing image lists using parallel processing.
settings.optimization.triangulation-spatial-index=Spatially index mesh triangulation
settings.optimization.triangulation-spatial-index.tooltip=Uses spatial grids during triangulation to speed up dense mesh generation without altering triangles.
settings.optimization.model-open-acceleration=Speed up opening Cubism models (.cmo3)
settings.optimization.model-open-acceleration.tooltip=Speeds up opening .cmo3 models with parallel texture decoding, faster triangulation, and thumbnail caching.
settings.optimization.runtime-export-acceleration=Speed up runtime model export (.moc3)
settings.optimization.runtime-export-acceleration.tooltip=Speeds up exporting .moc3 runtime models using flat vertex lookups and faster buffer writes.
settings.optimization.warp-deform-edit-acceleration=Accelerate warp deformer & brush editing
settings.optimization.warp-deform-edit-acceleration.tooltip=Speeds up warp deformer drags, brush strokes, and overlay updates without altering geometry.
settings.optimization.atlas-interactive-render=Speed up texture atlas canvas interaction
settings.optimization.atlas-interactive-render.tooltip=Makes panning, zooming, and dragging tiles in the texture atlas editor smoother without altering baked output.
settings.optimization.mesh-edit-acceleration=Speed up interactive mesh editing
settings.optimization.mesh-edit-acceleration.tooltip=Speeds up interactive mesh editing, soft selection, and auto-connect without altering mesh geometry.
settings.optimization.memory-leak-mitigation=Prevent memory & GPU resource leaks
settings.optimization.memory-leak-mitigation.tooltip=Frees unused OpenGL buffers and textures, bounds undo history growth, and cleans up stale listeners when closing models or switching views.
settings.optimization.bundle.editing-model-update=Skip unchanged model updates & merge duplicate refreshes
settings.optimization.bundle.editing-model-update.tooltip=Skips full model recalculation while zooming or panning an unchanged model, and merges repeated refreshes within a single edit. Boosts canvas frame rate and prevents multi-second stalls.
settings.optimization.bundle.editing-warp-interpolation=Accelerate warp deformers & extended interpolation (#4556 fix)
settings.optimization.bundle.editing-warp-interpolation.tooltip=Speeds up warp grid math, deform brush drags, and extended interpolation, while avoiding redundant sibling rebuilds that cause multi-second freezes (#4556). Visual output remains identical.
settings.optimization.bundle.editing-canvas-input=Improve canvas dragging, picking & parameter panel responsiveness
settings.optimization.bundle.editing-canvas-input.tooltip=Speeds up pointer picking, caches mouse-handler lookups, skips redundant cursor refreshes, and repaints only changed parameter rows. Makes dragging and slider scrubbing feel snappier.
settings.optimization.bundle.rendering-pipeline-cache=Cache render pass, shader & camera transform state
settings.optimization.bundle.rendering-pipeline-cache.tooltip=Reuses camera and transform matrices, caches shader parameter lookups, and streamlines render loops. Cuts per-frame CPU overhead and garbage collection stutters.
settings.optimization.bundle.rendering-upload-elision=Skip unchanged GPU buffer uploads
settings.optimization.bundle.rendering-upload-elision.tooltip=Skips re-sending unchanged mesh data to the GPU and updates only modified overlay lines during edits. Works together with skipping unchanged model updates.
settings.optimization.bundle.rendering-clip-mask=Deduplicate clipping masks & limit mask clear area
settings.optimization.bundle.rendering-clip-mask.tooltip=Reuses a single rendered mask when parts share identical clipping masks and clears only the mask area instead of the full canvas. Cuts GPU fill load with zero quality loss.
settings.optimization.bundle.assets-atlas=Accelerate texture atlas loading & canvas interaction
settings.optimization.bundle.assets-atlas.tooltip=Speeds up opening the texture atlas editor, zooming and dragging tiles, and skipping transparent borders or unchanged pages during packing. Exported atlas images stay identical.
settings.optimization.bundle.assets-mesh=Accelerate mesh editing & auto-triangulation
settings.optimization.bundle.assets-mesh.tooltip=Speeds up dense mesh triangulation, auto-connect, soft selection, and interactive vertex editing without changing mesh geometry.
settings.optimization.bundle.assets-model-io=Speed up opening (.cmo3) & exporting (.moc3) models
settings.optimization.bundle.assets-model-io.tooltip=Uses parallel texture decoding, thumbnail caching, and faster vertex packing to open project files and export runtime models faster without changing output files.
