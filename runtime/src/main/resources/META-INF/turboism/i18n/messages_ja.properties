settings.performance.preset.tooltip=検証済みの最適化プロファイルをまとめて切り替えます：\n- オフ：全 43 項目の最適化を無効にします。\n- バランス（推奨）：編集・GPU 描画・アセット向けの安全なゼロ遅延最適化 32 項目を有効にし、実験的オプションはオフのままにします。\n- 高負荷編集：全 43 項目を有効にします（1 フレーム遅延の非同期読み戻しなど「レガシー・実験的オプション」のトレードオフ項目を含む）。\n- カスタム：個別チェックが既定プリセットと異なる場合に自動表示されます。
settings.performance.recommendation.tooltip=通常のモデリングとアニメーション制作には「バランス」プリセットを推奨します。遅延や描画崩れのない検証済み 32 項目が有効になります。\n差分更新や非同期読み戻しなどのトレードオフを試す場合のみ、下部の「レガシー・実験的オプション」を開いてください。
