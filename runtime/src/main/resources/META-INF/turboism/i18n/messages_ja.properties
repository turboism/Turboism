guide.page.about.title=Turboism とは
guide.page.about.intro=Turboism は Live2D Cubism Editor 向けの実行時拡張ツール兼プラグインフレームワークです。Cubism 本体は変更せず、機能はすべてプラグインとして提供されます。
guide.page.about.capabilities=モデリング支援には、パラメータ、メッシュ、PSD 連携、パネル拡張、ローカル自動化があります。
guide.page.about.dependencies=利用できる機能は、導入済みプラグイン、その権限、Editor の正確なバージョンで決まります。
guide.page.about.update=更新は Turboism メニューまたはダウンロードページから行います。先に Cubism を終了し、プロジェクトをバックアップしてください。
guide.page.plugins.title=プラグインとマーケット
guide.page.plugins.intro=プラグインは Turboism の機能単位です。必要なものだけを導入し、いつでも有効化または無効化できます。
guide.page.plugins.install=公式プラグインはプラグインマーケットから導入するか、プラグイン管理でローカルのプラグインファイルを選択します。
guide.page.plugins.manage=プラグイン管理で有効化、無効化、削除を行います。プラグイン設定には各プラグインのオプションがあります。
guide.page.plugins.market=公式マーケットは署名済みパッケージを配布するため、カタログの更新もリリースごとに届きます。
guide.page.support.title=お困りのとき
guide.page.support.intro=公式チャネルが保守者へ最も早く届きます。
guide.page.support.logs=報告前に Turboism のログを開き、Editor のバージョンと一緒に添付してください。
guide.page.support.issues=再現できる問題と提案は GitHub Issues へお寄せください。
guide.page.support.security=セキュリティの懸念は contact@turboism.dev へ非公開でお知らせください。
