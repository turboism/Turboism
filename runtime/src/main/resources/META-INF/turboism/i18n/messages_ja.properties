settings.optimization.upload-elision=スキップされたフレームで変更のないGPUバッファーアップロードを省略
settings.optimization.input-path-elision=入力イベントごとの冗長なフォーカスとカーソル呼び出しを省略
settings.optimization.mesa-gl-thread=Mesa スレッド化 GL サブミットと遅延エラーチェックを有効化
settings.optimization.mesh-interpolation=アートメッシュとデフォーマの拡張補間計算を高速化
settings.optimization.shader-uniform=シェーダーごとの Uniform 位置をキャッシュ
settings.optimization.matrix-scratch=変換階層走査でローカル一時行列を再利用
settings.optimization.image-archive-reuse=保存時に未変更の PNG アーカイブを再利用
settings.optimization.float-array-parse-cache=モデルシリアライズ時の浮動小数点配列解析をキャッシュ
settings.optimization.texture-upload-preparation=テクスチャアップロードのピクセル前処理を高速化
settings.optimization.warp-position-projection=ワープデフォーマの座標投影を高速化
settings.mesh-triangulation.hash-degeneracy.tooltip=メッシュ三角分割の面クラスの定数 0 ハッシュを 3 頂点対称ハッシュに置き換え、ハッシュテーブルの線形走査への縮退を防ぎメッシュ生成時の CPU 負荷を削減します。
settings.mesh-triangulation.edge-index.tooltip=三角分割中の辺集合にコンパクトな索引を構築し一時辺オブジェクトの割り当てを遅延させることで、反復的な線形辺検索とメモリ割り当てを削減します。
settings.atlas.tile-bbox.tooltip=テクスチャアトラスの各タイル画像のアルファ境界処理をメッシュの最小境界ボックス内に限定し、透明領域の走査と一時バッファ割り当てを省いてアトラス生成とメモリ使用量を最適化します。
settings.atlas.cache-reuse.tooltip=アトラスのページサイズ・配置変換・元画像ピクセルから内容署名を計算し、未変更のアトラスページを再利用して冗長なページ再合成とメモリ消費を削減します。
settings.optimization.model-update-skip.tooltip=再描画前にモデルパラメータ・選択状態・編集フラグを比較し、ズームやパンなどモデルが変化していないフレームでの CPU モデル更新計算を省略してフレームレートを向上させます。
settings.optimization.incremental-update.tooltip=デフォーマやアートメッシュごとのパラメータ変化と親子階層のダーティ伝播を追跡し、影響を受けない部品の補間と変形計算を省略して複雑モデルのフレームレートを向上させます。
settings.optimization.uniform-location-cache.tooltip=1 フレームの描画スコープ内で確認済みの OpenGL シェーダー Uniform 位置をキャッシュし、描画ごとの glGetUniformLocation 呼び出しと一時割り当てを省いてフレームレートとメモリを最適化します。
settings.optimization.upload-elision.tooltip=モデル更新がスキップされたフレームで頂点・インデックスバッファの内容が未変更の場合に glBufferData / glBufferSubData の GPU アップロードを省略し、描画負荷を軽減します。
settings.optimization.input-path-elision.tooltip=フォーカスとカーソルが変化していない場合に入力イベントごとの冗長な requestFocus / setCursor 呼び出しを短絡し、ウィンドウシステムへの問い合わせを省いて入力遅延を低減します。
settings.optimization.mesa-gl-thread.tooltip=Linux/Proton (Mesa) 環境でスレッド化 GL サブミットを有効化し、描画ごとの同期 glGetError をフレーム末尾に集約してスレッドフラッシュを防ぎます（ネイティブ Windows では無視されます）。
settings.optimization.mesh-interpolation.tooltip=楕円・SNS 拡張補間の曲線重みをキャッシュし、キーフォーム GUID 索引と局所配列更新によって反復的な三角関数計算とリスト生成を省きフレームレートとメモリを最適化します。
settings.optimization.shader-uniform.tooltip=GShader インスタンスおよび GL プログラムハンドルごとに Uniform 位置をキャッシュし、描画前処理での反復的な glGetUniformLocation クエリを削減します。
settings.optimization.matrix-scratch.tooltip=GTransform.getLocalToWorldMatrix() の親階層走査内で 2 つのローカル 4×4 一時行列を交互に再利用し、階層ごとの中間行列オブジェクト割り当てと GC 負荷を削減します。
settings.optimization.image-archive-reuse.tooltip=モデルの保存時にピクセルが変更されていない画像リソースの元の PNG バイト列を再利用し、高コストな PNG 再エンコードと一時メモリ割り当てを省略して保存を高速化します。
settings.optimization.float-array-parse-cache.tooltip=モデルのデシリアライズ中に頻出する浮動小数点配列の解析結果をキャッシュして防御的コピーを返し、文字列解析の繰り返しを抑えて読み込み速度とメモリ使用量を改善します。
settings.optimization.texture-upload-preparation.tooltip=事前計算された 65,536 エントリの sRGB ルックアップテーブルを用いて ARGB/ABGR 画像をプリマルチプライド RGBA8 へ一括変換し、テクスチャアップロード前処理を高速化します（内蔵 Java 17 のみ）。
settings.optimization.warp-position-projection.tooltip=ワープデフォーマの拡張補間時に基底の float 配列から直接 GVector2 座標リストを生成し、一時的な WarpPointRef ラッパーの生成を省いてメモリ割り当てを削減します（内蔵 Java 17 のみ）。
settings.cubism-jvm.disable-auto-backup.tooltip=セッション中の定期自動バックアップタイマーを無効化し、大規模モデルの編集時に発生する定期的なプロジェクト書き出しによる一時停止を解消します。
settings.cubism-jvm.zgc.tooltip=起動時に並行低遅延ガベージコレクタ (-XX:+UseZGC) を有効化し、GC 停止時間をサブミリ秒に抑えて高負荷編集時のフレーム落ちを軽減します。
settings.cubism-jvm.tooltip=Cubism を実行する JVM を選択します。GraalVM は高度な JIT 最適化によりスループットとフレームレートを向上させ、同梱 Java は公式の既定環境を維持します。
settings.cubism-jvm.memory-profile.tooltip=最大ヒープサイズを制限するかソフト参照 (SoftReference) の保持時間を短縮することで、アイドル状態の画像キャッシュを早期に解放し常駐メモリ使用量を抑えます。
