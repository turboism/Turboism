settings.cubism-jvm.memory-profile-note=ヒープ上限付きプロファイルでは、搭載 RAM 全体ではなく上限内のメモリ圧力でエディタのソフト参照キャッシュが解放されます。この設定は次回の Editor 起動時に適用され、ZGC オプションと併用できます。起動コマンドに明示的な -Xmx が既にある場合は、その値がプロファイルのヒープ上限より優先されます。
settings.performance.restart-note=パフォーマンス最適化によって表示に問題が生じる場合があります。このページのすべての設定と最適化はエディタの再起動後に適用されます。
