update-notes.fallback.detail=このバージョンの詳細な更新内容はオフラインに同梱されていません。GitHub Releases で全体の変更履歴を確認できます。
update-notes.link.releases=GitHub リリースページ

settings.optimization.atlas-loading=テクスチャアトラスの読み込みを高速化
settings.optimization.atlas-loading.tooltip=並列処理によりテクスチャアトラス編集画面の起動と一覧更新を高速化します。
settings.optimization.triangulation-spatial-index=メッシュ三角分割を空間索引化
settings.optimization.triangulation-spatial-index.tooltip=空間グリッドにより高密度メッシュの三角分割を高速化します（出力三角形は同一）。
settings.optimization.model-open-acceleration=モデルファイル（.cmo3）の展開を高速化
settings.optimization.model-open-acceleration.tooltip=バッファ付きアーカイブ読み込み、高速 XML デシリアライズ、明示的 GC 抑止、並列 PNG 事前デコード、並列テクスチャアップロードパッキングにより .cmo3 の読み込みを高速化します。
settings.optimization.runtime-export-acceleration=ランタイムモデル（.moc3）の書き出しを高速化
settings.optimization.runtime-export-acceleration.tooltip=高速な頂点検索とバッファー書き出しにより出力データを変えず .moc3 の書き出しを高速化します。
settings.optimization.warp-deform-edit-acceleration=ワープデフォーマとブラシ編集を高速化
settings.optimization.warp-deform-edit-acceleration.tooltip=ワープデフォーマのドラッグ、ブラシ変形、オーバーレイ更新を形状変更なしで高速化します。
settings.optimization.atlas-interactive-render=テクスチャアトラス画面の操作を高速化
settings.optimization.atlas-interactive-render.tooltip=アトラス編集画面の拡大・移動・ドラッグ操作を滑らかにします（最終出力は不変）。
settings.optimization.mesh-edit-acceleration=メッシュ編集のインタラクティブ処理を高速化
settings.optimization.mesh-edit-acceleration.tooltip=メッシュ編集、ソフト選択、自動接続の応答を形状変更なしで高速化します。
settings.optimization.memory-leak-mitigation=メモリ・GPU リソースのリークを防止
settings.optimization.memory-leak-mitigation.tooltip=モデルを閉じたときや表示切り替え時に不要な OpenGL バッファーやテクスチャーを解放し、Undo 履歴やリスナーの肥大化を防ぎます。
settings.optimization.bundle.editing-model-update=未変更のモデル更新をスキップし重複更新を統合
settings.optimization.bundle.editing-model-update.tooltip=ズームやパンなどモデルが変わっていない場面の再計算を省き、1回の編集で重なった更新をまとめます。キャンバスが滑らかになり一括編集時の引っかかりを防ぎます。
settings.optimization.bundle.editing-warp-interpolation=ワープデフォーマと拡張補間を高速化（#4556 修正含む）
settings.optimization.bundle.editing-warp-interpolation.tooltip=ワープ格子計算やブラシ変形、拡張補間を高速化し、同階層パーツ増加による数秒フリーズ（#4556）を防ぎます。変形形状や見た目は変わりません。
settings.optimization.bundle.editing-canvas-input=キャンバス操作・選択とパラメータパネルの応答を改善
settings.optimization.bundle.editing-canvas-input.tooltip=ポインター選択やマウス応答を高速化し、不要なカーソル更新を省いて変更されたパラメータ行だけを再描画します。ドラッグやスライダー操作が軽快になります。
settings.optimization.bundle.rendering-pipeline-cache=レンダーパス・シェーダー・カメラ行列の状態をキャッシュ
settings.optimization.bundle.rendering-pipeline-cache.tooltip=カメラや階層変換の行列を再利用し、シェーダー参照をキャッシュして描画ループを効率化します。再生や移動時の CPU 負荷と GC カクつきを減らします。
settings.optimization.bundle.rendering-upload-elision=未変更の GPU バッファー転送をスキップ
settings.optimization.bundle.rendering-upload-elision.tooltip=モデルに変化がないときは GPU へのメッシュ転送を省き、変形時は変化した補助線だけを更新します。未変更のモデル更新スキップと組み合わせて機能します。
settings.optimization.bundle.rendering-clip-mask=クリッピングマスク重複排除と範囲限定クリア
settings.optimization.bundle.rendering-clip-mask.tooltip=同じクリッピングマスクを共有するパーツ間で描画結果を使い回し、マスクのクリア範囲も必要な領域だけに絞ります。画質を損なわず GPU 負荷を大きく減らします。
settings.optimization.bundle.assets-atlas=テクスチャアトラスの読み込み・生成・操作を高速化
settings.optimization.bundle.assets-atlas.tooltip=テクスチャアトラス編集画面の読み込みや拡大・移動・配置を高速化し、透明余白のスキャンや未変更ページの再合成を省きます。出力画像は変わりません。
settings.optimization.bundle.assets-mesh=メッシュ編集と自動三角分割を高速化
settings.optimization.bundle.assets-mesh.tooltip=高密度メッシュの自動生成や自動接続、ソフト選択、頂点編集の応答を高速化します。メッシュの形状や接続結果は変わりません。
settings.optimization.bundle.assets-model-io=モデル読込・保存・PSD 取込と .moc3 書き出しを高速化
settings.optimization.bundle.assets-model-io.tooltip=並列画像処理やバッファー圧縮、高速なシリアライズにより、.cmo3 の読込、PSD の取込、.cmo3/.can3 の保存、.moc3 の書き出しを出力結果を変えずに短縮します。
