settings.mesh-triangulation.edge-index.tooltip=三角分割中の辺に索引を構築し、高密度メッシュの自動接続を高速化してメモリ負荷を抑えます。
settings.atlas.tile-bbox.tooltip=アトラスの透明余白処理を各メッシュの最小範囲に絞り、アトラス生成を高速化します。
settings.atlas.cache-reuse.tooltip=更新や書き出し時に未変更のアトラスページを再利用し、再合成を省略します。
settings.optimization.model-update-skip.tooltip=ズームやパンのみ行われたフレームでモデル全体の CPU 再計算をスキップします。
settings.optimization.incremental-update.tooltip=単一パラメータ操作時に無関係なパーツの更新を省きます。既定オフの理由：カメラのパン・ズーム時に追跡負荷が増え、対応しない機能を含むモデルでは使えません。
settings.optimization.incremental-update-affecters.tooltip=グルーアフェクタのみを含むモデルでも差分更新を使えるようにします（ArtPath を含むモデルは従来経路）。既定オフの理由：上の差分更新が前提で効果も限定的です。
settings.optimization.uniform-location-cache.tooltip=1フレームの間シェーダーの Uniform 位置をキャッシュします。既定オフの理由：既定有効のシェーダー単位キャッシュで代替済みで、有効時はメッシュ転送スキップと競合します。
settings.optimization.upload-elision.tooltip=未変更メッシュの GPU 転送を省き、変形時は変化した補助線だけを更新します。モデル更新スキップが必要で、フレーム Uniform キャッシュ有効時はメッシュ比較が停止します。
settings.optimization.mesh-setup-elision.tooltip=モデル更新をスキップしたフレームで頂点バッファーの再設定を省き、拡大・移動時の CPU 負荷を減らします。
settings.optimization.input-path-elision.tooltip=マウス移動時の重複したフォーカス・カーソル設定を省きます。既定オフの理由：キャンバス操作応答の改善でより安全にカバーされており、稀にフォーカス切り替えに影響します。
settings.optimization.mesa-gl-thread.tooltip=描画ごとに行っていた OpenGL エラーチェックをフレーム末尾の1回にまとめ、描画スレッドの同期待ちを減らします。Linux/Proton の Mesa 環境ではスレッド送信も有効になります。
settings.optimization.async-readback=キャンバス読み戻しのパイプライン化（表示が1フレーム遅延）
settings.optimization.async-readback.tooltip=UI スレッドが GPU の描画完了を待たないようにし、超重量モデルの変形 FPS を上げます。既定オフの理由：表示内容が操作より1フレーム遅れます。
settings.optimization.mesh-interpolation.tooltip=拡張補間の曲線重みとキーフォーム検索をキャッシュし、フレームレート向上と割り当て削減を行います。
settings.optimization.shader-uniform.tooltip=シェーダー単位で Uniform 位置をキャッシュし、描画ごとのドライバ問い合わせを減らします。
settings.optimization.matrix-scratch.tooltip=階層変換の走査で一時行列を再利用し、描画・ピッキング時のメモリ割り当てを減らします。
settings.optimization.image-archive-reuse.tooltip=プロジェクト保存時に未変更画像の PNG 再圧縮を省略します。既定オフの理由：元データの保持にメモリを消費し、通常の保存では効果が限定的です。
settings.optimization.float-array-parse-cache.tooltip=モデルファイル読み込み時に同じ数値配列の解析結果を使い回します。既定オフの理由：モデル読み込み高速化と比べて効果がごく小さく、キャッシュを保持するためです。
settings.optimization.texture-upload-preparation.tooltip=同梱 Java 17 環境でテクスチャ読み込み時のピクセル変換を高速化します。既定オフの理由：読み込み短縮が約 3〜8% と小さく、既定の GraalVM では動作しないためです。
settings.optimization.warp-position-projection.tooltip=拡張補間時に一時的な座標ラッパー生成を省きます。既定オフの理由：効果はごく小さく、既定有効のワープ変形高速化でほぼ代替されているためです。
settings.optimization.reinit-pair-elision.tooltip=モデル再初期化時の一時ペア割り当てを省きます。既定オフの理由：発生頻度が低く、体感できる高速化がほとんどないためです。
settings.optimization.clip-mask-deduplication.tooltip=同じフレーム内で同一のクリッピングマスクを使うパーツ間で描画済みテクスチャを再利用します。
settings.optimization.clip-mask-scissor-clear.tooltip=クリッピングマスクのクリア範囲をマスク境界内に限定し、全画面クリアの負荷を削減します。
settings.optimization.extended-interpolation-incremental-setup.tooltip=モデル構造変更時に未変更オブジェクトの拡張補間再構築を省き、並べ替えや取り消しのフリーズを軽減します。
settings.optimization.model-instance-coalesce.tooltip=同一編集サイクル内の重複したモデル更新呼び出しを統合し、連続操作での数秒フリーズを防ぎます。
settings.optimization.inspector-property-bypass.tooltip=インスペクターの合成モード変更時にモデル全体を再構築せずシェーダーだけ更新します。既定オフの理由：Cubism 5.3+ 限定で効果範囲が限定的です。
settings.optimization.extended-interpolation-sibling-elision.tooltip=拡張補間の低速な兄弟走査と強制再構築（#4556 修正）を省き、同じ結果のままフリーズを解消します。
settings.optimization.warp-grid-interpolation.tooltip=範囲内のワープ格子補間を高速化し、変形形状を変えずに CPU 負荷を減らします。
settings.optimization.warp-normal-point-elision.tooltip=無効化された親範囲外ワープ制御点の不要な計算と転送を省略します。
settings.optimization.camera-matrix-cache.tooltip=カメラが未変更の間は変換行列をキャッシュし、毎フレームの負荷を減らします。
settings.optimization.render-pass-traversal.tooltip=レンダーパス走査とレンダラー参照を効率化し、デバッグ文字列の組み立て負荷を除きます。
settings.optimization.mesh-hit-test.tooltip=マウス判定時に一時オブジェクトを作らず直接メッシュ境界を計算します。
settings.optimization.scene-handler-cache.tooltip=シーンのマウスハンドラー一覧をキャッシュし、構造変更時のみ更新します。
settings.optimization.cursor-validation-elision.tooltip=レイアウト検証や範囲外ポインター照会時の冗長なカーソル更新を省きます。
settings.optimization.parameter-row-repaint.tooltip=値が実際に変わったパラメーター行だけを再描画します。
settings.cubism-jvm.disable-auto-backup.tooltip=定期自動バックアップを停止し、大きなモデル編集中にディスク保存で固まるのを防ぎます。有効中はクラッシュ復旧用バックアップが停止します。
settings.cubism-jvm.zgc.tooltip=起動時に低遅延ガベージコレクタ ZGC を有効化し、高負荷編集時のメモリ回収による引っかかりやフレーム落ちを抑えます。
settings.cubism-jvm.tooltip=Cubism を実行する Java 環境を選択します。GraalVM は高度な最適化で高フレームレートを実現し、同梱 Java は公式既定環境を使います。
settings.cubism-jvm.memory-profile.tooltip=最大ヒープサイズを制限するか待機中の画像キャッシュを早めに解放し、常駐メモリ消費を抑えます。
