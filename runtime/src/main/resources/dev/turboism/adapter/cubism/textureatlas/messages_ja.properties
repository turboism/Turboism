dialog.algorithm.label=レイアウトアルゴリズム
dialog.algorithm.tooltip=自動レイアウト実行時に使用するパッキングアルゴリズムを選択します。
dialog.algorithm.native=ネイティブ (Cubism)
dialog.parallel.label=並列化
dialog.parallel.check=並列検索を有効にする（テクスチャ数 ≥16 で有効）
dialog.parallel.tooltip=候補順序の検索を別スレッドで並列実行します。対応しているアルゴリズムのみ利用可能です。
dialog.rotation.label=回転
dialog.rotation.tooltip=配置テクスチャの回転粒度（ポリゴンアルゴリズムのみ）。
dialog.rotation.option.none=なし
dialog.rotation.option.quarter=90°回転
dialog.rotation.option.free=自由回転（18段階）
dialog.lock.label=ロックプリセット
dialog.lock.tooltip=すべてのテクスチャの位置・角度・スケールを固定します。個別ポリシーが優先されます。
dialog.lock.option.none=なし
dialog.lock.option.all=すべて
dialog.lock.option.angle=角度
dialog.lock.option.scale=スケール
dialog.lock.option.angle_scale=角度＋スケール
dialog.lock.option.pos_angle=位置＋角度
dialog.scale-mode.label=スケールモード
dialog.scale-mode.tooltip=自動は収まる最大スケールを探索し、固定は下の値を使用します。
dialog.scale-mode.option.auto=自動
dialog.scale-mode.option.fixed=固定
dialog.fixed-scale.label=固定スケール（%）
dialog.fixed-scale.tooltip=スケールモードが固定のときに使うパーセント（1-800）。
dialog.auto-scale-tolerance.label=スケール許容誤差
dialog.auto-scale-tolerance.tooltip=自動スケールの相対ステップ下限（5.4 の AUTO_SCALE_TOLERANCE に相当。既定 0.005）。
dialog.auto-scale-max-try.label=スケール最大試行
dialog.auto-scale-max-try.tooltip=自動スケールの試行上限（5.4 の AUTO_SCALE_MAX_TRY に相当。0 は品質プリセットから導出）。
dialog.kernel.label=パッキングカーネル
dialog.kernel.tooltip=Dalsoo カーネル：Abey または Dalalah。
dialog.kernel.option.abey=Abey
dialog.kernel.option.dalalah=Dalalah

dialog.quality.label=検索範囲
dialog.quality.option.fast=高速（輪郭ごとに最大8個の接触点）
dialog.quality.option.balanced=候補を制限（既定、最大24個の接触点）
dialog.quality.option.dense=完全検索（低速）
dialog.quality.tooltip=接触位置の候補を制限して処理を高速化します。配置の密度が変わる場合があります。衝突判定には常に完全な輪郭を使用します。完全検索は複雑なモデルでは長時間かかる場合があります。
