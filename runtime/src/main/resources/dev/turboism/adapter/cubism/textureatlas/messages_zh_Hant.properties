dialog.rotation.option.quarter=直角旋轉（90° 步進）
dialog.rotation.option.free=自由旋轉（18 檔角度）
dialog.lock.label=鎖定預設
dialog.lock.tooltip=為全部紋理鎖定位置/角度/縮放；逐項策略仍可覆蓋。
dialog.lock.option.none=不鎖定
dialog.lock.option.all=全部鎖定
dialog.lock.option.angle=角度
dialog.lock.option.scale=縮放
dialog.lock.option.angle_scale=角度 + 縮放
dialog.lock.option.pos_angle=位置 + 角度
dialog.scale-mode.label=縮放模式
dialog.scale-mode.tooltip=自動縮放搜尋可容納的最大縮放；固定模式使用下方縮放值。
