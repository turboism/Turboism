dialog.parallel.tooltip=在獨立執行緒上平行執行候選排序搜尋。僅對支援平行的演算法可用。
dialog.rotation.label=旋轉檔位
dialog.rotation.tooltip=紋理放置的旋轉粒度（僅多邊形演算法可用）。
