dialog.fixed-scale.label=固定縮放（%）
dialog.fixed-scale.tooltip=縮放模式為固定時使用的百分比（1-800）。
dialog.auto-scale-tolerance.label=縮放容差
dialog.auto-scale-tolerance.tooltip=自動縮放的相對步進下界（對應 5.4 AUTO_SCALE_TOLERANCE；預設 0.005）。
dialog.auto-scale-max-try.label=縮放最大嘗試
dialog.auto-scale-max-try.tooltip=自動縮放嘗試上限（對應 5.4 AUTO_SCALE_MAX_TRY；0 表示依質量檔推導）。
dialog.kernel.label=打包核心
dialog.kernel.tooltip=Dalsoo 核心變體：Abey 或 Dalalah。
dialog.kernel.option.abey=Abey
dialog.kernel.option.dalalah=Dalalah
