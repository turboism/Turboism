[versions]
errorprone = "2.42.0"
palantirJavaFormat = "2.97.0"
spotless = "8.9.0"
junit = "5.10.3"
izpack = "5.2.6"
izpackGradle = "3.2.3"
jackson = "2.18.9"
resilience4j = "2.1.0"
asm = "9.7.1"
graal = "25.2.4"
shadow = "8.3.11"

[libraries]
# Error Prone
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

# Spotless Gradle Plugin
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# JUnit
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Jackson
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }

# Resilience4j
resilience4j-bulkhead = { module = "io.github.resilience4j:resilience4j-bulkhead", version.ref = "resilience4j" }
resilience4j-timelimiter = { module = "io.github.resilience4j:resilience4j-timelimiter", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }

# GraalVM
graal-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graal" }

# IzPack
izpack-api = { module = "org.codehaus.izpack:izpack-api", version.ref = "izpack" }
izpack-installer = { module = "org.codehaus.izpack:izpack-installer", version.ref = "izpack" }
izpack-gui = { module = "org.codehaus.izpack:izpack-gui", version.ref = "izpack" }
izpack-util = { module = "org.codehaus.izpack:izpack-util", version.ref = "izpack" }
izpack-ant = { module = "org.codehaus.izpack:izpack-ant", version.ref = "izpack" }
izpack-tools = { module = "org.codehaus.izpack:izpack-tools", version.ref = "izpack" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
izpack = { id = "org.izpack.gradle", version.ref = "izpackGradle" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
